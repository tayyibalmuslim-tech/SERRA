  ], ppl:["abutalib","abujahl"]},

 {id:"e35", t:"وفاة خديجة رضي الله عنها", d:"بعد أبي طالب بأيام — السنة العاشرة",
  s:"ماتت أم المؤمنين بعد خمس وعشرين سنة من الصحبة، فاجتمع على النبي ﷺ فقد السند والسكن.",
  n:"ماتت <strong>خديجة</strong> بعد أبي طالب بمدة يسيرة — قيل ثلاثة أيام وقيل شهرين — وكانت في نحو الخامسة والستين. فسُمّي هذا العام <strong>عام الحزن</strong>.\n\nوكانت خديجة <strong>وزير صدق</strong>: تثبّته إذا اهتزّ، وتصدّقه إذا كذّبه الناس، وتواسيه بمالها. ولذلك بقي وفاؤه لها طول عمره: كان يذبح الشاة فيهديها إلى خلائلها، وقال حين غارت عائشة: <strong>«إنّي قد رُزقت حبّها»</strong>، وقال: «آمنت بي إذ كفر بي الناس، وصدّقتني إذ كذّبني الناس، وواستني بمالها إذ حرمني الناس، ورزقني الله ولدها إذ حرمني أولاد النساء».\n\nفاجتمع على النبي ﷺ في عام واحد: <strong>فقد الحماية الخارجية (أبو طالب) وفقد السكن الداخلي (خديجة)</strong>، ثم تلاه مباشرة قرار الخروج إلى الطائف.",
  g:"sahih", src:"صحيح مسلم (فضائل خديجة)، مسند أحمد، سيرة ابن هشام.",
  ben:[
   {t:"البيت الداعم ركن في نجاح صاحب الرسالة. فقده أشدّ من فقد الحلفاء الخارجيين.", tags:["maraa","ukhuwa"]},
   {t:"الوفاء لمن وقف معك وقت الشدة يبقى مهما طال الزمن. النبي ﷺ ظلّ يذكرها بعد عشر سنوات من موتها.", tags:["wafa","akhlaq"]},
   {t:"المصائب تأتي مجتمعة أحياناً — سنّة إلهية في تمحيص أهل الرسالات لا علامة سخط.", tags:["ibtila","sabr"]},
   {t:"خمس وعشرون سنة من الصحبة انتهت في يوم. مهما طالت العشرة فالفراق موعدها — فاجعل رصيدك عندهم خيراً.", tags:["ajal","akhlaq"]}
  ], ppl:["khadija","aisha"]},

 {id:"e36", t:"رحلة الطائف", d:"شوال، السنة العاشرة من البعثة",
  s:"خرج ﷺ إلى ثقيف يدعوهم فردّوه أقبح ردّ وأغروا به سفهاءهم حتى أدموا عقبيه، فقال دعاءه المشهور.",
  n:"خرج ﷺ ماشياً إلى <strong>الطائف</strong> ومعه <strong>زيد بن حارثة</strong> — نحو ستين ميلاً — يلتمس النصرة من ثقيف. فأقام عشرة أيام يكلّم أشرافهم، فردّوا عليه أقبح ردّ. قال أحدهم: أما وجد الله أحداً أرسله غيرك؟ وقال آخر: والله لا أكلّمك أبداً، إن كنت رسولاً فأنت أعظم خطراً من أن أردّ عليك الكلام.\n\nثم <strong>أغروا به سفهاءهم وعبيدهم</strong> فوقفوا له صفّين يرمونه بالحجارة حتى <strong>أدموا عقبيه</strong>، وزيد يقيه بنفسه حتى شُجّ رأسه.\n\nفلجأ إلى بستان لعتبة وشيبة، ثم قال دعاءه: <strong>«اللهم إليك أشكو ضعف قوتي، وقلة حيلتي، وهواني على الناس... إن لم يكن بك غضب عليّ فلا أبالي، ولكن عافيتك هي أوسع لي»</strong>.\n\nثم جاءه <strong>ملك الجبال</strong> يستأذنه أن يطبق عليهم الأخشبين، فقال ﷺ: <strong>«بل أرجو أن يخرج الله من أصلابهم من يعبد الله وحده لا يشرك به شيئاً»</strong>.",
  g:"sahih", src:"البخاري ومسلم (حديث عائشة: هل أتى عليك يوم أشدّ من أُحد)، ودعاء الطائف عند الطبراني وابن إسحاق.",
  ben:[
   {t:"«بل أرجو» — أعظم عبارة رحمة في التاريخ. قُدّم له الانتقام الكامل فرفضه نظراً لأجيال لم تُولد بعد.", tags:["afw","akhlaq"]},
   {t:"لم يشكُ إلا لله. الشكوى للخلق تُهين، والشكوى للخالق تُعين. ولاحظ: شكا ضعفه لا ظلمهم.", tags:["tawakkul","sabr"]},
   {t:"«إن لم يكن بك غضب عليّ فلا أبالي» — معيار النجاح عنده رضا الله لا نتيجة الرحلة. أعد ضبط بوصلتك.", tags:["thabat","tawakkul"]},
   {t:"سعى بأقصى ما يملك (مشى ستين ميلاً وأقام عشرة أيام) ثم فشل ظاهرياً. الفشل بعد بذل الوسع ليس تقصيراً.", tags:["takhtit","ibtila"]},
   {t:"قال ﷺ إن الطائف كان أشدّ من أُحد. الجرح النفسي من الرفض قد يفوق الجرح الجسدي.", tags:["sabr","ibtila"]}
  ], ppl:["zayd","adas","mutim"]},

 {id:"e37", t:"إسلام عدّاس وجوار المُطعم", d:"عقب الطائف مباشرة",
  s:"أسلم غلام نصراني في بستان الطائف، ثم دخل ﷺ مكة في جوار المطعم بن عدي المشرك.",
  n:"في بستان عتبة وشيبة، أرسلا إليه غلامهما النصراني <strong>عدّاس</strong> بقطف عنب استهزاءً. فلما وضعه قال النبي ﷺ: <strong>«باسم الله»</strong> ثم أكل. فقال عدّاس: إن هذا الكلام ما يقوله أهل هذه البلاد. فسأله ﷺ: من أي البلاد أنت؟ قال: من أهل <strong>نينوى</strong>. قال: <strong>«من قرية الرجل الصالح يونس بن متّى؟»</strong> قال: وما يدريك؟ قال: <strong>«ذاك أخي، كان نبياً وأنا نبي»</strong>. فأكبّ عدّاس يقبّل رأسه ويديه وقدميه.\n\nثم رجع ﷺ نحو مكة، ولم يستطع الدخول لأن قريشاً قد بلغها الخبر. فأرسل إلى ثلاثة يطلب الجوار، فأبى اثنان، وأجابه <strong>المُطعم بن عدي</strong> — وهو مشرك — فلبس سلاحه هو وبنوه ووقفوا في المسجد وقال: يا معشر قريش، إني قد أجرت محمداً فلا يهجه أحد. فطاف ﷺ وصلّى ثم دخل بيته.",
  g:"hasan", src:"سيرة ابن هشام، البخاري (طرف من جوار المطعم في باب الجوار).",
  ben:[
   {t:"ثمرة الرحلة كلها كانت رجلاً واحداً. لا تحتقر نتيجة صغيرة بعد جهد كبير — قد تكون هي المقصود.", tags:["ibtila","tarbiya"]},
   {t:"تسمية الله على الطعام هي التي فتحت باب الحوار. السلوك اليومي الظاهر قد يكون أبلغ دعوة من خطبة.", tags:["akhlaq","ilam"]},
   {t:"الاستعانة بغير المسلم في حماية مشروعة جائزة ومعمول بها. النبي ﷺ دخل مكة في جوار مشرك.", tags:["mukhalif","siyasa"]},
   {t:"حفظ النبي ﷺ للمطعم صنيعه ولم ينسه بعد سنوات (يوم بدر). ردّ الجميل خُلق نبوي وليس مجاملة.", tags:["wafa","akhlaq"]}
  ], ppl:["adas","mutim"]},

 {id:"e38", t:"عرض النفس على القبائل", d:"من السنة 10 إلى 12 من البعثة",
  s:"جال ﷺ في المواسم يعرض دعوته على القبائل يطلب من ينصره، فردّوه إلا بني عامر الذين اشترطوا الملك.",
  n:"بدأ ﷺ استراتيجية جديدة: <strong>عرض نفسه على القبائل</strong> في مواسم الحج وأسواق عكاظ ومجنّة وذي المجاز. كان يقول: <strong>«يا بني فلان، إني رسول الله إليكم، آمركم أن تعبدوا الله ولا تشركوا به شيئاً... وأن تمنعوني حتى أبلّغ عن ربي»</strong>.\n\nوكان أبو لهب يتبعه فيقول: لا تطيعوه فإنه صابئ كذاب.\n\nعرض على: كندة، وكلب، وبني حنيفة (وكانوا أقبح ردّاً)، وبني عامر بن صعصعة. وقال له سيّد بني عامر: <strong>أرأيت إن نحن بايعناك ثم أظهرك الله، أيكون لنا الأمر من بعدك؟</strong> فقال ﷺ: <strong>«الأمر إلى الله يضعه حيث يشاء»</strong>. فقال: أفنهدف نحورنا للعرب دونك، فإذا أظهرك الله كان الأمر لغيرنا؟ لا حاجة لنا بأمرك.",
  g:"hasan", src:"سيرة ابن هشام، مسند أحمد، سنن الترمذي.",
  ben:[
   {t:"رفض ﷺ تقديم تنازل واحد مقابل نصرة مضمونة. ثمن التمكين إذا كان تشويه الرسالة فهو غالٍ جداً.", tags:["thabat","siyasa"]},
   {t:"المثابرة على الطرق بعد الرفض المتكرر: قبيلة بعد قبيلة وموسم بعد موسم. النجاح ابن التكرار لا الحظ.", tags:["sabr","takhtit"]},
   {t:"طرح ﷺ عرضاً واضحاً محدداً: عقيدة + حماية. الوضوح في ما تطلبه يوفّر وقت الطرفين.", tags:["ilam","siyasa"]},
   {t:"من يشترط المنصب قبل العمل لن يُفلح في العمل. بنو عامر خسروا شرف النصرة لأنهم ساوموا مبكراً.", tags:["ukhuwa","qiyada"]}
  ], ppl:["abulahab"]},

 {id:"e39", t:"الإسراء والمعراج", d:"قبل الهجرة بنحو سنة أو أكثر",
  s:"أُسري به ﷺ من المسجد الحرام إلى الأقصى ثم عُرج به إلى السماوات، وفُرضت الصلوات الخمس.",
  n:"أُسري به ﷺ ليلاً من <strong>المسجد الحرام</strong> إلى <strong>المسجد الأقصى</strong> على البراق، فصلّى بالأنبياء إماماً. ثم <strong>عُرج به</strong> إلى السماوات السبع فرأى الأنبياء، ثم إلى <strong>سدرة المنتهى</strong>، وفُرضت عليه <strong>الصلوات الخمس</strong> — خمسون في الميزان خمس في العمل بعد مراجعة موسى عليه السلام.\n\nفلما أصبح أخبر قريشاً فكذّبوه واستهزؤوا، وارتدّ من ارتدّ. فجاؤوا إلى <strong>أبي بكر</strong> فقال: <strong>«إن كان قال ذلك فقد صدق، إني لأصدّقه في أبعد من ذلك، في خبر السماء غدوّ وروحة»</strong> — فسُمّي الصدّيق.\n\nوسألوه عن وصف بيت المقدس فوُصف له فوصفه، وأخبرهم عن عيرهم في الطريق فصدق.\n\n<em>ملاحظة:</em> أصل الإسراء والمعراج ثابت بالقرآن والسنة المتواترة، لكن <strong>تحديد ليلة السابع والعشرين من رجب لم يثبت</strong>، والخلاف في السنة والشهر واسع.",
  g:"sahih", src:"سورة الإسراء والنجم، صحيح البخاري ومسلم (حديث الإسراء).",
  ben:[
   {t:"جاءت التكرمة الإلهية العظمى عقب أشدّ سنوات الرفض. الله يعوّض عبده من حيث لا يحتسب.", tags:["ibtila","tawakkul"]},
   {t:"الصلاة فُرضت في السماء لا في الأرض — إشارة إلى مكانتها. هي أول ما يُحاسب عليه العبد وأول ما يُترك عند الفتور.", tags:["awlawiyat"]},
   {t:"الاختبار يُصفّي الصف. الحادثة كانت غربالاً أخرج المتردّدين قبل مرحلة الهجرة الحاسمة.", tags:["ibtila","tarbiya"]},
   {t:"تصديق أبي بكر لم يكن عاطفة بل استدلال: من صدّقته في خبر السماء لا أكذّبه في خبر الأرض. الثقة المبنية على منطق أثبت.", tags:["ukhuwa","sidq"]},
   {t:"ربط الأقصى بالحرام في رحلة واحدة أسّس ارتباطاً عقدياً دائماً بين المسجدين قبل أن يفتح المسلمون الشام بعقود.", tags:["takhtit"]}
  ], ppl:["abubakr"]},

 {id:"e40", t:"بيعة العقبة الأولى", d:"السنة 12 من البعثة",
  s:"بايعه اثنا عشر رجلاً من الأنصار على أصول الإسلام والأخلاق — بيعة النساء، لا قتال فيها.",
  n:"كان ﷺ قد لقي في الموسم السابق ستة نفر من <strong>الخزرج</strong> فأسلموا، وكانوا قد سمعوا من يهود يثرب بقرب مبعث نبيّ. فرجعوا فدعوا قومهم، حتى لم يبق دار من دور الأنصار إلا وفيها ذكر لرسول الله ﷺ.\n\nثم جاء في العام التالي <strong>اثنا عشر رجلاً</strong> — عشرة من الخزرج واثنان من الأوس — فبايعوه عند <strong>العقبة</strong> بمنى. وسُمّيت <strong>بيعة النساء</strong> لأنها كانت على مثل ما بايع عليه النساء لاحقاً، ولم يكن فيها ذكر قتال.\n\nبايعوه على: <strong>ألا يشركوا بالله شيئاً، ولا يسرقوا، ولا يزنوا، ولا يقتلوا أولادهم، ولا يأتوا ببهتان يفترونه، ولا يعصوه في معروف</strong>. فمن وفى فأجره على الله، ومن أصاب من ذلك شيئاً فعُوقب فهو كفارة، ومن ستره الله فأمره إلى الله.\n\nثم بعث معهم <strong>مصعب بن عمير</strong> معلّماً.",
  g:"sahih", src:"صحيح البخاري (مناقب الأنصار، الإيمان)، سيرة ابن هشام.",
  ben:[
   {t:"بدأ العقد بالأخلاق قبل السلاح. البيعة الأولى بلا قتال — البناء الداخلي أولاً والمواجهة لاحقاً.", tags:["tadarruj","tarbiya"]},
   {t:"«ومن ستره الله فأمره إلى الله» — منظومة لا تقوم على التجسس والتفتيش في النوايا. رحمة في صميم التشريع.", tags:["afw","adl"]},
   {t:"اثنا عشر رجلاً غيّروا مدينة كاملة. لا تنتظر الأعداد الكبيرة لتبدأ.", tags:["tarbiya","qiyada"]},
   {t:"كل بيعة تحتاج بنوداً واضحة مكتوبة الدلالة. الاتفاقات الغامضة تنهار عند أول أزمة.", tags:["siyasa","wafa"]}
  ], ppl:["musab"]},

 {id:"e41", t:"مصعب بن عمير: أول سفير", d:"بين البيعتين — السنة 12",
  s:"بعثه ﷺ إلى المدينة معلّماً وداعية، فأسلم على يديه سعد بن معاذ فأسلمت الأوس كلها.",
  n:"بعث ﷺ مع الوفد <strong>مصعب بن عمير</strong> — وكان فتى شاباً لم يبلغ الثلاثين — ليُقرئهم القرآن ويعلّمهم الإسلام. فكان يُسمّى <strong>«المُقرئ»</strong>.\n\nونزل على أسعد بن زرارة، فكان يدعو الناس. فبلغ ذلك <strong>سعد بن معاذ</strong> سيد الأوس فأرسل إليه <strong>أسيد بن حضير</strong> ينهاه شديداً. فقال مصعب بهدوء: <strong>«أوَ تجلس فتسمع؟ فإن رضيت أمراً قبلته، وإن كرهته كُففنا عنك»</strong>. قال: أنصفت. فجلس فقرأ عليه فأسلم.\n\nثم جاء سعد بن معاذ غاضباً، فقال له مصعب الكلمة نفسها، فجلس فأسلم. فقام سعد إلى قومه فقال: <strong>«يا بني عبد الأشهل، كيف تعلمون أمري فيكم؟»</strong> قالوا: سيدنا وأفضلنا. قال: <strong>«فإن كلام رجالكم ونسائكم عليّ حرام حتى تؤمنوا بالله ورسوله»</strong>. فما أمسى في دار بني عبد الأشهل رجل ولا امرأة إلا مسلماً.",
  g:"hasan", src:"سيرة ابن هشام، الطبقات، ورواه ابن إسحاق بإسناد جيد.",
  ben:[
   {t:"«أوَ تجلس فتسمع؟» — منهج حواري كامل في ست كلمات: عرض عادل، حرية اختيار، احترام النتيجة.", tags:["hiwar","ilam"]},
   {t:"استهداف رأس القبيلة وفّر جهد إقناع مئات الأفراد. حدّد نقاط التأثير في أي مجتمع تدخله.", tags:["takhtit","qiyada"]},
   {t:"اختيار شاب صغير سفيراً في مهمة استراتيجية. الكفاءة معيار الاختيار لا السنّ.", tags:["shabab","tarbiya"]},
   {t:"مصعب أمام غضب مسلّح ردّ بالهدوء لا بالمثل. من ملك أعصابه في الحوار ملك نتيجته.", tags:["hiwar","akhlaq"]},
   {t:"سعد استخدم مكانته لصالح الحق فوراً. النفوذ أمانة تُصرف في لحظة القرار لا يُدّخر.", tags:["qiyada","thabat"]}
  ], ppl:["musab","saadmuadh"]},

 {id:"e42", t:"بيعة العقبة الثانية", d:"ذو الحجة، السنة 13 من البعثة",
  s:"بايعه 73 رجلاً وامرأتان على المنع والحماية والحرب، واختار منهم اثني عشر نقيباً — الميلاد السياسي للدولة.",
  n:"قدم في الموسم <strong>ثلاثة وسبعون رجلاً وامرأتان</strong> من الأنصار، فواعدهم النبي ﷺ العقبة في ثلث الليل الأوسط سرّاً. وحضر معه عمّه <strong>العباس</strong> — وكان على دين قومه — ليستوثق لابن أخيه.\n\nفتكلّم العباس محذّراً: إن محمداً في منعة من قومه، فإن كنتم ترون أنكم وافون له بما دعوتموه إليه ومانعوه ممن خالفه فأنتم وذاك، وإلا فدعوه.\n\nفقال البراء بن معرور: <strong>نبايعك على ما نبايع عليه نساءنا وأبناءنا</strong>. وقام أبو الهيثم بن التيهان فقال: إن بيننا وبين الرجال — يعني يهود — حبالاً وإنا قاطعوها، فهل عسيت إن فعلنا ثم أظهرك الله أن ترجع إلى قومك؟ فتبسّم ﷺ وقال: <strong>«بل الدم الدم والهدم الهدم، أنا منكم وأنتم مني»</strong>.\n\nثم بايعوه، واختار منهم <strong>اثني عشر نقيباً</strong> — تسعة من الخزرج وثلاثة من الأوس — وقال: <strong>«أنتم على قومكم كفلاء»</strong>.",
  g:"hasan", src:"سيرة ابن هشام (إسناد ابن إسحاق)، مسند أحمد، البخاري في مواضع.",
  ben:[
   {t:"العباس عرض المخاطر بصراحة قبل التوقيع. الشراكة التي تُخفى مخاطرها تنهار عند أول اختبار.", tags:["siyasa","sidq"]},
   {t:"«أنا منكم وأنتم مني» — طمأنة القلق المشروع قبل نشوئه. القائد يجيب على الأسئلة الصعبة لا يتهرب منها.", tags:["qiyada","wafa"]},
   {t:"تعيين اثني عشر نقيباً: هيكل إداري وسيط قبل قيام الدولة بعام. التنظيم يسبق التمكين.", tags:["takhtit","qiyada"]},
   {t:"البيعة سرّاً في ثلث الليل، بأعداد محدودة، وبمواعيد محكمة. السرية التامة في المراحل الحساسة.", tags:["takhtit","siyasa"]},
   {t:"حضور امرأتين في أخطر اتفاق سياسي في تاريخ الدعوة. المشاركة النسائية أصيلة لا استثنائية.", tags:["maraa"]}
  ], ppl:["saadubada","saadmuadh"]}
]},

 {id:"e43", t:"مؤامرة دار الندوة", d:"صفر 1هـ",
  s:"اجتمعت قريش تتشاور في قتله أو حبسه أو نفيه، فاستقروا على القتل بأيدي شباب من كل قبيلة.",
  n:"لما علمت قريش ببيعة العقبة وخروج المسلمين إلى المدينة، أدركت الخطر فاجتمعت في <strong>دار الندوة</strong>، وحضرهم إبليس في صورة شيخ من نجد.\n\nطُرحت ثلاثة خيارات:\n<strong>الحبس:</strong> نحبسه في الحديد حتى يموت. فرُدّ: يخرج أمره إلى أصحابه فيقاتلونكم.\n<strong>النفي:</strong> نخرجه من بلادنا. فرُدّ: يستميل قلوب العرب بحلاوة منطقه ثم يعود عليكم.\n<strong>القتل:</strong> اقترح أبو جهل: <strong>نأخذ من كل قبيلة فتى شاباً جليداً، ونعطي كل واحد سيفاً، فيضربونه ضربة رجل واحد</strong>، فيتفرّق دمه في القبائل فلا يقوى بنو عبد مناف على حرب الجميع فيرضون بالدية.\n\nفأجمعوا عليه. فنزل جبريل يخبر النبيَّ ﷺ ويأذن له بالهجرة. ونزلت: {وَإِذْ يَمْكُرُ بِكَ الَّذِينَ كَفَرُوا لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ ۚ وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ ۖ وَاللَّهُ خَيْرُ الْمَاكِرِينَ}.",
  g:"sahih", src:"سورة الأنفال آية 30، سيرة ابن هشام، تفسير الطبري.",
  ben:[
   {t:"الخصم يخطط بجدية ويدرس البدائل. لا تستهن بخطط من يعاديك ولا تفترض غباءه.", tags:["siyasa","takhtit"]},
   {t:"القرآن سمّى تدبير الله «مكراً» مقابلةً لهم. حين يخطط الناس ضدك وأنت على حق، فالله يخطط لك.", tags:["tawakkul"]},
   {t:"فكرة توزيع المسؤولية لتمييع المحاسبة قديمة جداً. أسلوب معروف في التهرّب من العدالة.", tags:["adl","siyasa"]},
   {t:"وصلته المعلومة قبل التنفيذ. الاستخبارات والمعلومة المبكرة جزء من الأخذ بالأسباب.", tags:["takhtit"]}
  ], ppl:["abujahl","abusufyan"]},

 {id:"e44", t:"ليلة الهجرة وفراش عليّ", d:"ليلة 27 صفر 1هـ تقريباً",
  s:"نام عليّ في فراش النبي ﷺ، وخرج ﷺ من بين الحصار يذرّ التراب على رؤوسهم، وذهب إلى أبي بكر.",
  n:"أحاطوا بالبيت ينتظرون الصباح. فأمر ﷺ <strong>علي بن أبي طالب</strong> أن ينام في فراشه ويتغطّى ببُرده الحضرمي الأخضر، وأخبره أنه <strong>لن يخلص إليه شيء يكرهه</strong>، وأمره أن يبقى ليردّ <strong>الودائع</strong> التي كانت عند النبي ﷺ لأهل مكة.\n\n<em>وتأمّل هذه:</em> قريش تريد قتله، وودائعها محفوظة عنده — حتى في ذروة العداء بقي <strong>الأمين</strong>.\n\nثم خرج ﷺ عليهم وهو يقرأ {وَجَعَلْنَا مِن بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لَا يُبْصِرُونَ}، وأخذ حفنة من تراب فذرّها على رؤوسهم فلم يره أحد.\n\nثم أتى بيت <strong>أبي بكر</strong>، وكان أبو بكر قد جهّز راحلتين قبل ذلك بأربعة أشهر واستأذن في الصحبة، فأذن له، <strong>فبكى أبو بكر من الفرح</strong>. قالت عائشة: ما كنت أظن أن أحداً يبكي من الفرح حتى رأيت أبي يبكي يومئذ.",
  g:"sahih", src:"صحيح البخاري (مناقب الأنصار، باب الهجرة)، سيرة ابن هشام.",
  ben:[
   {t:"ردّ الأمانات لمن يريدون قتلك — أعلى قمة أخلاقية في التاريخ. الحق لا يُؤخذ بالباطل ولو مع عدو.", tags:["sidq","adl","akhlaq"]},
   {t:"علي قبل مهمة موت شبه محقق وهو شاب في نحو الثالثة والعشرين. الشباب يُختبرون بالمواقف لا بالكلام.", tags:["shabab","ukhuwa"]},
   {t:"أبو بكر جهّز الرواحل قبل أربعة أشهر. الاستعداد المسبق للفرصة هو ما يجعلك جاهزاً حين تُنادى.", tags:["takhtit"]},
   {t:"البكاء من الفرح لشرف الصحبة — مقياس لما كانت تعنيه هذه الرسالة عندهم. اسأل: ما الذي يُبكيني فرحاً؟", tags:["ukhuwa"]}
  ], ppl:["ali","abubakr","aisha"]},

 {id:"e45", t:"الغار: ثلاث ليالٍ في ثور", d:"ثلاث ليالٍ",
  s:"اختبآ في غار ثور جنوب مكة عكس اتجاه المدينة، بمنظومة دعم متكاملة من ثلاثة أشخاص.",
  n:"خرجا إلى <strong>غار ثور</strong> — <strong>جنوب مكة</strong>، أي في <strong>الاتجاه المعاكس</strong> تماماً للمدينة — فمكثا فيه ثلاث ليال.\n\nوتأمّل منظومة الدعم المحكمة:\n<strong>عبد الله بن أبي بكر:</strong> شاب لقن ثقف، يبيت عندهما ويدّلج قبل الفجر فيصبح مع قريش كأنه بات بمكة، ينقل الأخبار.\n<strong>عامر بن فُهيرة:</strong> راعي غنم، يرعى ثم يريحها عليهما فيشربان، ثم يسرح بها فيعفّي على آثار عبد الله.\n<strong>أسماء بنت أبي بكر:</strong> تحمل الطعام، وشقّت نطاقها نصفين لتربط به السفرة فسُمّيت <strong>ذات النطاقين</strong>.\n<strong>عبد الله بن أريقط:</strong> دليل خبير <strong>مشرك</strong>، استُؤجر لخبرته وأُمن على السرّ، ووُوعد بعد ثلاث عند الغار.\n\nوجاء المشركون حتى وقفوا على فم الغار، فقال أبو بكر: لو أن أحدهم نظر تحت قدميه لأبصرنا. فقال ﷺ: <strong>«ما ظنّك باثنين الله ثالثهما؟»</strong> ونزلت {ثَانِيَ اثْنَيْنِ إِذْ هُمَا فِي الْغَارِ}.",
  g:"sahih", src:"صحيح البخاري (باب هجرة النبي ﷺ)، سورة التوبة آية 40.",
  ben:[
   {t:"الاتجاه المعاكس أولاً: أذكى خدعة تكتيكية. فكّر عكس المتوقع حين يكون المتوقع مكشوفاً.", tags:["takhtit","siyasa"]},
   {t:"أربعة أدوار متكاملة: معلومات، تمويه، تموين، خبرة فنية. أي عملية ناجحة تحتاج فريقاً بأدوار محددة.", tags:["takhtit","qiyada"]},
   {t:"استئجار دليل مشرك في أخطر عملية — الكفاءة والأمانة معياران، والمعاملة الدنيوية تجوز مع المخالف.", tags:["mukhalif","siyasa"]},
   {t:"«ما ظنك باثنين الله ثالثهما؟» — أعلى درجات التوكل بعد استنفاد كل سبب ممكن. لا توكّل بلا سبب، ولا سبب بلا توكل.", tags:["tawakkul","takhtit"]},
   {t:"كل أفراد الفريق من عائلة واحدة تقريباً + شخص خارجي. الدائرة الصغيرة الموثوقة أأمن من الجمهور الواسع.", tags:["takhtit","ukhuwa"]}
  ], ppl:["abubakr","asmaa"]},

 {id:"e46", t:"سراقة بن مالك وسِوارا كسرى", d:"في طريق الهجرة",
  s:"لحق بهما طمعاً في جائزة قريش فساخت فرسه، فطلب الأمان ووعده ﷺ بسواري كسرى.",
  n:"جعلت قريش <strong>مئة ناقة</strong> لمن يردّ محمداً ﷺ أو أبا بكر. فبلغ <strong>سراقة بن مالك</strong> خبرهما فركب فرسه يطلبهما طمعاً في الجائزة، وكتم الخبر عن قومه ليفوز به وحده.\n\nفلما دنا منهما <strong>ساخت يدا فرسه في الأرض</strong> حتى بلغتا الركبتين، فخرّ عنها. ثم استقسم بالأزلام فخرج ما يكره، فركب فلحق ثانية فساخت، ثم ثالثة، فعلم أنه ممنوع، فناداهم بالأمان وسألهم أن يكتبوا له كتاب أمان.\n\nفقال له النبي ﷺ: <strong>«كيف بك إذا لُبّست سِوارَي كسرى؟»</strong> فقال سراقة مندهشاً: كسرى بن هرمز؟! قال: نعم.\n\nثم رجع سراقة <strong>يردّ الناس عنهما</strong> ويقول: قد كُفيتم ما ههنا. فكان أوّل النهار جاهداً عليهما وآخره حارساً لهما. وأسلم بعد ذلك، ولبس السوارين في خلافة <strong>عمر</strong> بعد فتح فارس.",
  g:"sahih", src:"صحيح البخاري (باب هجرة النبي ﷺ، حديث سراقة الطويل).",
  ben:[
   {t:"وعد بسواري كسرى وهو مطارد لا يملك شيئاً. من كان يقينه بالمستقبل صادقاً تحدّث عنه بثقة في أحلك لحظاته.", tags:["tawakkul","qiyada"]},
   {t:"الطمع أعمى سراقة عن مشاركة قومه فخسر، ثم كان الطمع نفسه سبب نجاته. تقلّب النوايا لا يفوت الله.", tags:["mal"]},
   {t:"لم ينتقم منه ﷺ ولم يهدّده، بل أعطاه أماناً ووعداً. صناعة الحليف من العدو المُقبل أذكى من كسره.", tags:["afw","siyasa"]},
   {t:"عمر نفّذ الوعد النبوي بعد عشرين سنة. الأمانة في المؤسسة تعني تنفيذ التزامات القيادة السابقة.", tags:["wafa","qiyada"]}
  ], ppl:["suraqa","umar","abubakr"]},

 {id:"e47", t:"قباء وأول مسجد في الإسلام", d:"الاثنين 12 ربيع الأول 1هـ",
  s:"نزل ﷺ بقباء فمكث أياماً وأسّس أول مسجد بُني على التقوى.",
  n:"وصل ﷺ <strong>قباء</strong> — على بعد أميال جنوب المدينة — يوم الاثنين، فنزل على كلثوم بن الهدم. وكان الأنصار يخرجون كل يوم إلى الحرّة ينتظرونه حتى يردّهم حرّ الظهيرة.\n\nفلما رآه رجل من يهود صاح بأعلى صوته: يا بني قيلة، هذا جدّكم الذي تنتظرون! فخرجوا بالسلاح فرحين. قال البراء بن عازب: <strong>ما رأيت أهل المدينة فرحوا بشيء فرحهم برسول الله ﷺ</strong>.\n\nوأقام بقباء أياماً — قيل أربعة عشر يوماً — فأسّس فيها <strong>مسجد قباء</strong>، وهو أول مسجد بُني في الإسلام، وفيه نزل {لَّمَسْجِدٌ أُسِّسَ عَلَى التَّقْوَىٰ مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَن تَقُومَ فِيهِ}. وكان ﷺ يأتيه كل سبت راكباً وماشياً.\n\nثم لحق به <strong>علي</strong> بعد أن ردّ الودائع، فخرجوا جميعاً إلى المدينة.",
  g:"sahih", src:"صحيح البخاري (مناقب الأنصار)، سورة التوبة آية 108.",
  ben:[
   {t:"أول عمل مؤسسي في الدولة الجديدة كان بناء مسجد. حدّد المركز الروحي قبل المركز الإداري.", tags:["awlawiyat","qiyada"]},
   {t:"لم ينتظر الوصول للعاصمة ليبدأ. ابدأ من أول محطة تصلها ولا تؤجّل لظروف مثالية.", tags:["takhtit"]},
   {t:"مواظبته ﷺ على زيارة قباء كل سبت — الوفاء للبدايات وتعاهد المشاريع الصغيرة بعد الكبر.", tags:["wafa","akhlaq"]}
  ], ppl:["ali"]},

 {id:"e48", t:"دخول المدينة ومبرك الناقة", d:"الجمعة، ربيع الأول 1هـ",
  s:"تنازع الأنصار شرف استضافته، فحكّم ناقته حتى بركت في موضع المسجد النبوي.",
  n:"دخل ﷺ المدينة فكان يوماً مشهوداً، خرج الناس والجواري ينشدن. وجعل <strong>لا يمرّ ببطن من الأنصار إلا أخذوا بخطام ناقته</strong>: هلمّ إلينا يا رسول الله، إلى العدد والعُدّة والمَنَعة.\n\nفكان يقول لهم: <strong>«خلّوا سبيلها فإنها مأمورة»</strong>. حتى وصلت إلى موضع في بني النجار — وهم أخواله — فبركت، ثم نهضت وسارت قليلاً ثم رجعت إلى مبركها الأول فبركت.\n\nفنزل ﷺ. وكان الموضع <strong>مِربداً</strong> — موضع تجفيف التمر — لغلامين يتيمين من بني النجار. فأراد أن يهبوه له فأبى إلا الشراء، فاشتراه ليبني فيه المسجد.\n\nونزل ﷺ في بيت <strong>أبي أيوب الأنصاري</strong> شهراً حتى بُني المسجد وبيوته. وسُمّيت المدينة بعدها <strong>«طيبة»</strong> و<strong>«المدينة»</strong> بعد أن كانت يثرب.",
  g:"sahih", src:"صحيح البخاري (مقدم النبي ﷺ المدينة)، سيرة ابن هشام.",
  ben:[
   {t:"حكّم الناقة ليحسم تنافساً كاد يفسد الودّ. أحياناً أفضل قرار هو ما لا يُنسب لأحد من الأطراف.", tags:["qiyada","siyasa"]},
   {t:"رفض أن يأخذ أرض اليتيمين هبةً وأصرّ على الشراء. لا تبنِ مشروعك على حق ضعيف حتى لو تنازل عنه طوعاً.", tags:["adl","mal"]},
   {t:"لم يستغل الحماس الجماهيري في تفضيل فريق على فريق. القائد يدخل حيادياً ليقود الجميع.", tags:["qiyada","adl"]},
   {t:"تغيير الاسم من يثرب إلى المدينة: إعادة تعريف الهوية جزء من بناء الكيان الجديد.", tags:["ilam","qiyada"]}
  ], ppl:["saadubada"]}
]},

{
id:"found", t:"تأسيس الدولة", era:"1 — 2 هـ", c:"#6FA98C",
d:"سنة واحدة بنى فيها ﷺ: مسجداً، ومجتمعاً، ووثيقة دستورية، واقتصاداً، وهوية مستقلة.",
ev:[
 {id:"e49", t:"بناء المسجد النبوي", d:"ربيع الأول 1هـ",
  s:"أول مشروع في الدولة: مسجد بسيط من اللبن والجريد، عمل فيه النبي ﷺ بيده مع أصحابه.",
  n:"اشترى ﷺ المِربد وبنى فيه المسجد. وكان بناؤه غاية في البساطة: <strong>جدرانه من اللبن، وسقفه من جريد النخل، وعمده جذوع النخل، وأرضه رمل وحصباء</strong>. وجعل قبلته إلى بيت المقدس أولاً، وله ثلاثة أبواب.\n\nوعمل ﷺ فيه بيده ينقل اللبن مع أصحابه، وهم يرتجزون: <strong>«اللهم لا عيش إلا عيش الآخرة، فاغفر للأنصار والمهاجرة»</strong>.\n\nولم يكن المسجد مكان صلاة فحسب، بل كان:\n<strong>البرلمان:</strong> فيه تُتّخذ القرارات وتُعقد الشورى.\n<strong>المدرسة:</strong> فيه <strong>الصُّفّة</strong> — مأوى وسكن لفقراء المهاجرين، وأول مدرسة داخلية في الإسلام.\n<strong>المحكمة والديوان:</strong> فيه يُقضى بين الناس وتُستقبل الوفود.\n<strong>مركز التعبئة:</strong> منه تنطلق السرايا.\n\nوبُنيت بجواره حجرات أزواجه ﷺ ملاصقة، بيوت صغيرة من طين وجريد.",
  g:"sahih", src:"صحيح البخاري (كتاب الصلاة، باب بنيان المسجد).",
  ben:[
   {t:"المؤسسة متعددة الوظائف أكفأ في مرحلة التأسيس. مركز واحد يخدم خمسة أدوار بدل خمسة مبانٍ فارغة.", tags:["qiyada","mal","takhtit"]},
   {t:"القائد ينقل اللبن مع الجميع. القيادة بالقدوة تصنع ولاءً لا تصنعه الأوامر.", tags:["qiyada","akhlaq"]},
   {t:"البساطة المتعمّدة: أعظم مسجد في التاريخ بُني من طين وجريد. لا تؤجّل الانطلاق انتظاراً لإمكانات فخمة.", tags:["mal","takhtit"]},
   {t:"«لا عيش إلا عيش الآخرة» يُردّد أثناء العمل. ربط العمل الدنيوي بالغاية الأخروية يجعل التعب عبادة.", tags:["ajal","tarbiya"]},
   {t:"أهل الصُّفّة: نظام رعاية اجتماعية وتعليم مجاني من اليوم الأول. الدولة تبدأ برعاية أضعف فئاتها.", tags:["adl","tarbiya"]}
  ], ppl:[]},

 {id:"e50", t:"المؤاخاة بين المهاجرين والأنصار", d:"السنة الأولى",
  s:"آخى ﷺ بين تسعين رجلاً — مهاجر وأنصاري — على المواساة والتوارث، فكان نموذجاً بلا نظير.",
  n:"آخى ﷺ بين المهاجرين والأنصار في دار أنس بن مالك، على <strong>المواساة والتوارث بعد الموت</strong> — وبقي التوارث حتى نُسخ بعد بدر بقوله {وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍ}.\n\nوكان الأنصار قد بلغوا في الإيثار مبلغاً عجيباً، حتى قالوا: يا رسول الله، اقسم بيننا وبين إخواننا النخيل. فقال: لا. فقالوا: تكفوننا المؤونة ونشرككم في الثمرة. قالوا: سمعنا وأطعنا. ونزل فيهم: {وَيُؤْثِرُونَ عَلَىٰ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ}.\n\nوآخى بين <strong>عبد الرحمن بن عوف</strong> و<strong>سعد بن الربيع</strong>، فقال سعد: أنا أكثر الأنصار مالاً، فانظر شطر مالي فخذه، ولي امرأتان فانظر أعجبهما إليك فأطلّقها حتى تتزوجها. فقال عبد الرحمن: <strong>«بارك الله لك في أهلك ومالك، دلّوني على السوق»</strong>. فذهب فتاجر حتى أثرى.",
  g:"sahih", src:"صحيح البخاري (مناقب الأنصار، البيوع)، صحيح مسلم.",
  ben:[
   {t:"حلّ ﷺ أزمة اللاجئين بأمرين: كرم المضيف وعزّة الوافد. أي حل يغفل أحدهما ينتج تبعية أو ضغينة.", tags:["ukhuwa","mal"]},
   {t:"«دلّوني على السوق» — أعظم درس اقتصادي في السيرة. الكرامة في الكسب لا في العطاء.", tags:["mal","akhlaq"]},
   {t:"رباط الإيمان تفوّق على رباط الدم حتى في الميراث مرحلياً. الأخوّة تُبنى بقرار وتنظيم لا بالشعارات.", tags:["ukhuwa","tarbiya"]},
   {t:"المؤاخاة كانت مقرونة بأسماء محددة لا نداءً عاماً. المسؤولية المشخّصة تُنفَّذ، والعامة تضيع.", tags:["qiyada","takhtit"]}
  ], ppl:["abduRahman","saadmuadh"]},

 {id:"e51", t:"صحيفة المدينة: أول وثيقة دستورية", d:"السنة الأولى",
  s:"كتب ﷺ وثيقة تنظّم علاقة المسلمين ببعضهم وباليهود وسائر السكان — نصّ سياسي مبكر بالغ التقدم.",
  n:"كتب ﷺ كتاباً بين المهاجرين والأنصار، ووادع فيه <strong>يهود المدينة</strong> وأقرّهم على دينهم وأموالهم. ومن أهم بنودها:\n\n• <strong>«إنهم أمة واحدة من دون الناس»</strong> — تأسيس هوية جامعة فوق القبيلة.\n• <strong>«وإن يهود ينفقون مع المؤمنين ما داموا محاربين»</strong> — تشارك في أعباء الدفاع.\n• <strong>«لليهود دينهم وللمسلمين دينهم»</strong> — حرية اعتقاد صريحة.\n• <strong>«وإن بينهم النصر على من حارب أهل هذه الصحيفة»</strong> — تحالف دفاعي.\n• <strong>«وإنه ما كان بين أهل هذه الصحيفة من حدث أو اشتجار يُخاف فساده، فإن مردّه إلى الله وإلى محمد رسول الله»</strong> — مرجعية قضائية عليا واحدة.\n• <strong>«ولا يأثم امرؤ بحليفه»</strong> — المسؤولية الجنائية فردية لا جماعية.\n\nفكانت هذه الوثيقة تأسيساً لمفهوم <strong>الدولة</strong> بحدود ومواطنة ومرجعية، في زمن لم تكن العرب تعرف فيه إلا القبيلة.",
  g:"hasan", src:"سيرة ابن هشام (نصّ الصحيفة كاملاً)، الأموال لأبي عبيد.",
  ben:[
   {t:"وثّق العلاقات كتابةً من أول يوم. الاتفاق الشفهي يُنسى ويُؤوَّل، والمكتوب يُحتكم إليه.", tags:["siyasa","wafa","takhtit"]},
   {t:"«لليهود دينهم وللمسلمين دينهم» في وثيقة رسمية قبل أربعة عشر قرناً. التعايش نصّ مُلزِم لا شعار.", tags:["mukhalif","adl"]},
   {t:"مرجعية واحدة لفضّ النزاع شرط بقاء أي كيان. تعدد المرجعيات يعني الحرب الأهلية.", tags:["qiyada","adl"]},
   {t:"«لا يأثم امرؤ بحليفه» — إلغاء المسؤولية الجماعية التي بُني عليها الثأر الجاهلي كله.", tags:["adl"]},
   {t:"الحقوق قُرنت بالواجبات (ينفقون مع المؤمنين). المواطنة عقد متبادل لا امتياز أحادي.", tags:["adl","siyasa"]}
  ], ppl:["ibnubayy"]},

 {id:"e52", t:"بناء السوق والاقتصاد المستقل", d:"السنة الأولى",
  s:"أنشأ ﷺ سوقاً للمسلمين مستقلاً عن سوق يهود، بلا ضرائب ولا احتكار للأماكن.",
  n:"كانت الأسواق في المدينة بيد <strong>يهود بني قينقاع</strong> وغيرهم، فيها الربا والاحتكار. فذهب ﷺ إلى موضع فخطّه وقال: <strong>«هذا سوقكم، فلا يُضيَّق فيه ولا يُضرب عليه خراج»</strong>.\n\nوطبّق فيه قواعد واضحة: <strong>لا خراج (ضريبة موقع)، ولا احتكار للأماكن</strong> — من سبق إلى مكان فهو له يومه، <strong>ومنع تلقّي الركبان</strong> (اعتراض البضائع قبل دخول السوق)، <strong>ومنع النجش</strong> (رفع السعر صورياً)، <strong>ومنع الغشّ</strong>: «من غشّ فليس منا» بعد أن أدخل يده في صُبرة طعام فوجد بللاً.\n\nوكان يمشي في السوق بنفسه يراقب. فهذا أول <strong>نظام رقابة على السوق</strong> — أصل ولاية الحسبة لاحقاً.\n\nوهكذا استقلّ اقتصاد المسلمين تدريجياً عن السيطرة الخارجية.",
  g:"sahih", src:"سنن ابن ماجه (الأسواق)، صحيح مسلم (حديث الغشّ)، الطبقات لابن سعد.",
  ben:[
   {t:"الاستقلال الاقتصادي شرط الاستقلال السياسي. من يشتري قوته من عدوّه لا يملك قراره.", tags:["mal","siyasa"]},
   {t:"إلغاء الضريبة على السوق في مرحلة التأسيس — تحفيز للتجارة قبل جبايتها. تنشيط أولاً ثم تحصيل.", tags:["mal","takhtit"]},
   {t:"الرقابة الميدانية المباشرة من أعلى سلطة. القائد الذي لا ينزل للسوق يُدار بالتقارير المزوّرة.", tags:["qiyada","adl"]},
   {t:"«من غشّ فليس منا» — الغشّ التجاري مسألة عقدية لا مخالفة إدارية. راجع مواصفات منتجك بهذا الميزان.", tags:["sidq","mal"]}
  ], ppl:[]},

 {id:"e53", t:"ظهور النفاق وأهل الكتاب", d:"من السنة الأولى فصاعداً",
  s:"ظهرت طائفة تُبطن الكفر وتُظهر الإسلام بقيادة ابن أُبيّ، وبدأ التوتر مع بعض يهود المدينة.",
  n:"لم يُعرف النفاق في مكة لأن المسلمين كانوا مستضعفين فلا مصلحة في التظاهر. فلما قامت الدولة ظهرت <strong>ظاهرة النفاق</strong>.\n\nوكان رأسهم <strong>عبد الله بن أبيّ بن سلول</strong>، وكان قومه قد اجتمعوا على أن يُتوّجوه ملكاً قبل الهجرة، فلما جاء الإسلام ذهب ملكه فأضمر الحقد.\n\nوأما اليهود، فقد كانوا ينتظرون نبياً ويستفتحون به على الأوس والخزرج، فلما جاء من غيرهم كفروا به حسداً: {فَلَمَّا جَاءَهُم مَّا عَرَفُوا كَفَرُوا بِهِ}. فبدؤوا حرباً فكرية: أسئلة تعجيزية، وتشكيك، ومحاولة تفريق بين الأوس والخزرج بتذكيرهم بحرب بُعاث — حتى تنادوا بالسلاح، فخرج ﷺ فذكّرهم فبكوا واعتنقوا.\n\nوصبر النبي ﷺ على المنافقين ولم يقتلهم، وقال: <strong>«لا يتحدث الناس أن محمداً يقتل أصحابه»</strong>.",
  g:"sahih", src:"صحيح البخاري ومسلم (قصة ابن أبيّ)، تفسير الطبري.",
  ben:[
   {t:"النفاق ظاهرة نجاح لا فشل — لا يُنافق إلا القوي. ظهور المتسلقين علامة أن مشروعك صار مؤثراً.", tags:["qiyada","siyasa"]},
   {t:"«لا يتحدث الناس أن محمداً يقتل أصحابه» — اعتبار السمعة والأثر الإعلامي في القرار. المكسب اللحظي قد يكلّف صورة المشروع.", tags:["siyasa","ilam","awlawiyat"]},
   {t:"من فقد امتيازاً بسبب مشروعك سيعاديه ولو تظاهر بالتأييد. اقرأ خريطة المصالح المتضررة.", tags:["siyasa","mukhalif"]},
   {t:"إثارة الخلافات القديمة سلاح دائم لتفتيت الصف. عالج الجراح القديمة قبل أن يستخدمها غيرك.", tags:["ukhuwa","qiyada"]}
  ], ppl:["ibnubayy","huyayy"]},

 {id:"e54", t:"تحويل القبلة وفرض الصيام", d:"شعبان 2هـ",
  s:"حُوّلت القبلة من بيت المقدس إلى الكعبة، وفُرض صيام رمضان والزكاة — استكمال الهوية.",
  n:"كان ﷺ يصلي نحو <strong>بيت المقدس</strong> ستة عشر أو سبعة عشر شهراً، وكان يحبّ أن يُوجّه إلى الكعبة، فجعل يقلّب وجهه في السماء. فنزلت: {قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ ۖ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَاهَا ۚ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ}.\n\nونزلت والناس في صلاة العصر في مسجد بني سلمة، فاستداروا في الصلاة نفسها — فسُمّي <strong>مسجد القبلتين</strong>.\n\nفضجّ السفهاء واليهود: {مَا وَلَّاهُمْ عَن قِبْلَتِهِمُ الَّتِي كَانُوا عَلَيْهَا}. فكان تمحيصاً: {وَمَا جَعَلْنَا الْقِبْلَةَ الَّتِي كُنتَ عَلَيْهَا إِلَّا لِنَعْلَمَ مَن يَتَّبِعُ الرَّسُولَ مِمَّن يَنقَلِبُ عَلَىٰ عَقِبَيْهِ}.\n\nوفي شعبان من السنة الثانية فُرض <strong>صيام رمضان</strong>، وشُرعت <strong>زكاة الفطر</strong> ثم زكاة الأموال. فاكتملت للأمة معالم هويتها المستقلة: قبلة، وصوم، ومال، وقانون.",
  g:"sahih", src:"صحيح البخاري (كتاب الصلاة، التفسير)، صحيح مسلم.",
  ben:[
   {t:"الهوية المستقلة تُبنى بالتدريج لا بالقطيعة المفاجئة. سنة ونصف من التوافق ثم التمايز.", tags:["tadarruj","takhtit"]},
   {t:"الاستدارة في وسط الصلاة نموذج للطاعة الفورية. سرعة التنفيذ عند وضوح الأمر علامة نضج الصف.", tags:["tarbiya","qiyada"]},
   {t:"كل قرار تغييري يُنتج معارضة صاخبة. توقّع الضجيج ولا تجعله معياراً لصواب القرار.", tags:["qiyada","ibtila"]},
   {t:"التغيير الكبير يكشف من يتبع الفكرة ومن يتبع الشكل. الأزمات غربال طبيعي للفرق والمؤسسات.", tags:["ibtila","tarbiya"]}
  ], ppl:[]}
]}
];
</script>

 {id:"e55", t:"السرايا الأولى والإذن بالقتال", d:"1 — 2 هـ",
  s:"نزل الإذن بالقتال بعد ثلاثة عشر عاماً من الكفّ، وبدأت سرايا استطلاعية على طريق تجارة قريش.",
  n:"بعد ثلاثة عشر عاماً من الأمر بكفّ اليد، نزل الإذن: {أُذِنَ لِلَّذِينَ يُقَاتَلُونَ بِأَنَّهُمْ ظُلِمُوا}. ولاحظ التعليل: <strong>«بأنهم ظُلموا»</strong> — القتال ردّ للظلم لا ابتداء عدوان.\n\nفبدأ ﷺ سرايا صغيرة استكشافية باتجاه <strong>الطريق التجاري لقريش</strong> بين مكة والشام. وأهدافها كانت متعددة:\n<strong>1. الضغط الاقتصادي:</strong> شريان قريش الرئيس هو التجارة، وقريش صادرت أموال المهاجرين في مكة.\n<strong>2. الاستطلاع:</strong> معرفة الطرق والقبائل.\n<strong>3. التحالفات:</strong> موادعة قبائل الطريق (بني ضمرة، بني مدلج).\n<strong>4. إعلان الوجود:</strong> إشعار العرب أن للمسلمين دولة قادرة.\n\nومن هذه السرايا: سيف البحر، ورابغ، والخرّار، وغزوات الأبواء وبواط والعشيرة. ولم يقع فيها قتال يُذكر إلا في <strong>سرية عبد الله بن جحش</strong> في نخلة، حيث وقع قتل في آخر رجب — وهو من الأشهر الحرم — فأرجف المشركون، فنزلت {يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيهِ ۖ قُلْ قِتَالٌ فِيهِ كَبِيرٌ ۖ وَصَدٌّ عَن سَبِيلِ اللَّهِ... أَكْبَرُ عِندَ اللَّهِ}.",
  g:"sahih", src:"سورة الحج 39، البقرة 217، سيرة ابن هشام، الرحيق المختوم.",
  ben:[
   {t:"ثلاثة عشر عاماً من الصبر قبل أول إذن بالمواجهة. الاستعجال في تغيير الوسيلة قبل نضج الظرف يقتل المشاريع.", tags:["tadarruj","sabr","awlawiyat"]},
   {t:"استهداف الشريان الاقتصادي للخصم أذكى وأقلّ تكلفة من مواجهة عسكرية مباشرة.", tags:["siyasa","mal","takhtit"]},
   {t:"الموازنة بين مفسدتين: القتل في الشهر الحرام كبير، لكن الصدّ عن سبيل الله والإخراج أكبر. فقه الموازنات.", tags:["awlawiyat","adl"]},
   {t:"عدة أهداف من عملية واحدة (استطلاع + ضغط + تحالف + إعلام). لا تصمّم خطوة لهدف واحد فقط.", tags:["takhtit","qiyada"]}
  ], ppl:[]},

 {id:"e56", t:"غزوة بدر الكبرى", d:"17 رمضان 2هـ",
  s:"313 مقابل نحو ألف، فكان النصر الفاصل: قُتل سبعون من صناديد قريش وأُسر سبعون.",
  n:"خرج ﷺ في <strong>ثلاثمئة وثلاثة عشر</strong> ومعهم فرسان وسبعون بعيراً يتعاقبونها، يعترضون قافلة <strong>أبي سفيان</strong>. فأفلتت القافلة وأقبل جيش قريش <strong>نحو ألف</strong> مقاتل بالسلاح والخيل.\n\nفاستشار ﷺ الناس، فتكلّم المهاجرون فأحسنوا، ثم قال: «أشيروا عليّ أيها الناس» — يريد الأنصار لأن بيعتهم على الدفاع لا الهجوم. فقام <strong>سعد بن معاذ</strong> فقال: <strong>«فوالذي بعثك بالحق، لو استعرضت بنا هذا البحر فخضته لخضناه معك... امض لما أردت فنحن معك»</strong>.\n\nوأشار <strong>الحُباب بن المنذر</strong> بتغيير موضع النزول إلى أدنى ماء من القوم وتغويره، ففعل ﷺ — نموذج على قبول الرأي الفني من صاحب الخبرة.\n\nوبات ﷺ يدعو حتى سقط رداؤه: <strong>«اللهم إن تهلك هذه العصابة لا تُعبد في الأرض»</strong>، فقال أبو بكر: بعض مناشدتك ربك.\n\nفكان النصر: <strong>قُتل سبعون</strong> منهم أبو جهل وأمية بن خلف وعتبة، <strong>وأُسر سبعون</strong>، واستُشهد <strong>أربعة عشر</strong> من المسلمين.",
  g:"sahih", src:"صحيح البخاري ومسلم (كتاب المغازي، غزوة بدر)، سورة الأنفال.",
  ben:[
   {t:"استشار الأنصار رغم أنه القائد المؤيَّد بالوحي، لأن بيعتهم لم تشمل هذا. احترام حدود الاتفاق أساس الثقة.", tags:["shura","wafa","qiyada"]},
   {t:"قبِل رأي الحُباب في الموقع وتراجع عن اجتهاده. القائد الذي لا يتراجع أمام الخبرة يخسر معركته.", tags:["shura","qiyada"]},
   {t:"دعا حتى سقط رداؤه بعد أن أعدّ كل ما يستطيع. الدعاء تتويج للأخذ بالأسباب لا بديل عنه.", tags:["tawakkul","takhtit"]},
   {t:"سبعون من ألف هم قادة الصف الأول لقريش. ضربة واحدة في العمق أنفع من عشر ضربات في الأطراف.", tags:["takhtit","siyasa"]},
   {t:"«لا تُعبد في الأرض» — همّه كان الرسالة لا شخصه ولا النصر ذاته. راجع: ما الذي أخاف عليه حقاً؟", tags:["thabat","ajal"]}
  ], ppl:["saadmuadh","abubakr","abujahl","hamza","ali","abusufyan","umayya","bilal","utba"]},

 {id:"e57", t:"مصير أسرى بدر", d:"عقب بدر",
  s:"استشار ﷺ في الأسرى فأشار أبو بكر بالفداء وعمر بالقتل، فأخذ برأي أبي بكر فعُوتب.",
  n:"استشار ﷺ أصحابه في <strong>سبعين أسيراً</strong>. فقال <strong>أبو بكر</strong>: قومك وأهلك، استبقهم واستأنِ بهم لعل الله يتوب عليهم، وخذ منهم فدية تكون قوة لنا. وقال <strong>عمر</strong>: كذّبوك وأخرجوك، قدّمهم فاضرب أعناقهم، ومكّن علياً من عقيل وحمزة من أخيه.\n\nفهوي ﷺ ما قال أبو بكر، فأخذ منهم الفداء. فنزل: {مَا كَانَ لِنَبِيٍّ أَن يَكُونَ لَهُ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِي الْأَرْضِ ۚ تُرِيدُونَ عَرَضَ الدُّنْيَا وَاللَّهُ يُرِيدُ الْآخِرَةَ}. فوجد ﷺ وأبو بكر يبكيان، فقال عمر: أخبرني فإن وجدت بكاءً بكيت وإلا تباكيت.\n\nوكان الفداء أربعة آلاف درهم للموسر، ومن لم يكن له مال ويحسن الكتابة <strong>يعلّم عشرة من صبيان الأنصار الكتابة</strong> فيكون ذلك فداءه.\n\nوأوصى ﷺ بالأسرى خيراً، حتى قال أبو عزيز: كانوا يقدّمون لنا الخبز ويأكلون التمر.",
  g:"sahih", src:"صحيح مسلم (الجهاد، أسرى بدر)، سورة الأنفال 67، سيرة ابن هشام.",
  ben:[
   {t:"فداء الأسير بتعليم عشرة أطفال — أعظم تسعير للعلم في التاريخ. حوّل خصمك إلى مورد نافع.", tags:["tarbiya","mal","ilam"]},
   {t:"عوتب النبي ﷺ نفسه في اجتهاد. القرآن يوثّق العتاب ولا يخفيه — أعظم دليل على صدق المصدر.", tags:["sidq","shura"]},
   {t:"الشورى قد تُفضي إلى اجتهاد مرجوح، وتبقى الشورى واجبة. لا تُلغِ نظاماً صحيحاً بسبب نتيجة واحدة.", tags:["shura","qiyada"]},
   {t:"الإحسان للأسرى في ذروة النصر. الأخلاق ليست ترفاً وقت القوة بل هي أشدّ ما تظهر فيه.", tags:["afw","akhlaq","adl"]}
  ], ppl:["abubakr","umar"]},

 {id:"e58", t:"إجلاء بني قينقاع", d:"شوال 2هـ",
  s:"نقضوا العهد وأهانوا امرأة مسلمة، فحاصرهم ﷺ خمسة عشر ليلة فأجلاهم عن المدينة.",
  n:"كان <strong>بنو قينقاع</strong> أشجع يهود المدينة وأصحاب صناعة وتجارة. فلما انتصر المسلمون في بدر حسدوا وأظهروا البغي، وقالوا: لا يغرّنك أنك قتلت نفراً من قريش أغماراً، لو قاتلتنا لعرفت أنّا نحن الناس.\n\nثم كانت الحادثة: جلست <strong>امرأة مسلمة</strong> إلى صائغ منهم في سوقهم، فأرادوها على كشف وجهها فأبت، فعقد أحدهم طرف ثوبها إلى ظهرها فلما قامت انكشفت فضحكوا. فصاحت، فوثب رجل مسلم على الصائغ فقتله، فاجتمع اليهود على المسلم فقتلوه، فاستصرخ أهله المسلمين.\n\nفحاصرهم ﷺ <strong>خمس عشرة ليلة</strong> حتى نزلوا على حكمه. فألحّ <strong>عبد الله بن أبيّ</strong> — وكانوا حلفاءه — في العفو عنهم، فتركهم النبي ﷺ لكن <strong>أجلاهم عن المدينة</strong> إلى أذرعات بالشام، وأخذ سلاحهم وأدوات صناعتهم.",
  g:"hasan", src:"سيرة ابن هشام، الطبقات، الدلائل للبيهقي.",
  ben:[
   {t:"انتهاك عرض امرأة واحدة كان كافياً لتحريك الدولة كلها. حماية الأعراض ليست شأناً فردياً.", tags:["maraa","adl"]},
   {t:"نقض العهد له ثمن حتمي وإلا صار العهد بلا قيمة. التسامح مع خرق الاتفاق يشجّع على تكراره.", tags:["wafa","siyasa"]},
   {t:"الإجلاء لا القتل، مع مصادرة السلاح. عقوبة تُنهي الخطر دون إسراف — تناسب العقوبة مع الجرم.", tags:["adl","afw"]},
   {t:"احتمل ﷺ إلحاح ابن أبيّ ولم يصطدم به في تلك اللحظة. القائد يختار توقيت معاركه الداخلية.", tags:["siyasa","awlawiyat"]}
  ], ppl:["ibnubayy"]},

 {id:"e59", t:"غزوة أُحد", d:"شوال 3هـ",
  s:"خرج ألف فرجع ثلثهم، وانتصر المسلمون أولاً ثم انقلب الحال بمخالفة الرماة، فاستُشهد سبعون.",
  n:"جاءت قريش في <strong>ثلاثة آلاف</strong> تطلب الثأر لبدر. فاستشار ﷺ فكان رأيه البقاء بالمدينة، ورأي الشباب المتحمّس الخروج، فنزل على رأي الأكثرية. فلما لبس لأمته ندموا، فقال: <strong>«ما ينبغي لنبي إذا لبس لأمته أن يضعها حتى يحكم الله»</strong>.\n\nخرج في ألف، فانخذل <strong>عبد الله بن أبيّ بثلث الجيش</strong> فبقي سبعمئة. فعسكر ﷺ وظهره إلى جبل أُحد، وأقام <strong>خمسين رامياً</strong> على الجبل بقيادة عبد الله بن جبير وقال: <strong>«لا تبرحوا وإن رأيتمونا تخطّفنا الطير»</strong>.\n\nفانتصر المسلمون أولاً وانهزمت قريش. فلما رأى الرماة الغنائم <strong>نزل أكثرهم مخالفين</strong>، فالتفّ <strong>خالد بن الوليد</strong> بالخيل من خلف الجبل، فانقلب النصر.\n\nوشيع أن النبي ﷺ قُتل، وشُجّ وجهه وكُسرت رباعيته، ووقاه <strong>طلحة</strong> بيده حتى شُلّت، واستُشهد <strong>حمزة</strong> و<strong>مصعب</strong> وسبعون. ونزل في ذلك ستون آية من آل عمران تحلّل الهزيمة تحليلاً كاملاً.",
  g:"sahih", src:"صحيح البخاري ومسلم (المغازي، أُحد)، سورة آل عمران 121-180.",
  ben:[
   {t:"نزل ﷺ على رأي الأغلبية وهو يخالفه. الشورى ملزمة أخلاقياً وإلا صارت استطلاعاً شكلياً.", tags:["shura","qiyada"]},
   {t:"مخالفة أمر واحد من خمسين رجلاً قلبت نصراً إلى هزيمة. الانضباط التنفيذي أهم من الحماس.", tags:["qiyada","tarbiya"]},
   {t:"الغنيمة أخطر من السيف. كثير من المشاريع تنهار في لحظة النجاح لا في لحظة الأزمة.", tags:["mal","ibtila"]},
   {t:"القرآن حلّل الهزيمة بصراحة ونسبها لأسبابها {قُلْ هُوَ مِنْ عِندِ أَنفُسِكُمْ}. المراجعة الصادقة شرط عدم التكرار.", tags:["qiyada","sidq"]},
   {t:"انسحاب ثلث الجيش قبل المعركة اختبار كشف المنافقين مبكراً. الأزمة تُنقّي الصف بلا تكلفة إضافية.", tags:["ibtila","tarbiya"]}
  ], ppl:["hamza","musab","khalid","ibnubayy","talha","saadwaqqas","abuubayda","hind","abusufyan"]},

 {id:"e60", t:"حمراء الأسد: الردّ النفسي", d:"اليوم التالي لأُحد",
  s:"خرج ﷺ بجرحى أُحد يطارد قريشاً لإظهار القوة، فأثنى القرآن على من استجاب رغم القرح.",
  n:"في صبيحة اليوم التالي لأُحد — والجراح لم تُضمّد بعد — نادى ﷺ في الناس بطلب العدو، و<strong>أذن ألا يخرج معه إلا من شهد أُحداً</strong>. فخرجوا على ما بهم من الألم والإرهاق والحزن حتى بلغوا <strong>حمراء الأسد</strong> على ثمانية أميال من المدينة.\n\nوأمر ﷺ بإيقاد <strong>خمسمئة نار</strong> ليلاً حتى تُرى من بعيد فيُظنّ الجيش كثيراً.\n\nوكان أبو سفيان قد همّ بالرجوع لاستئصال المسلمين، فبلغه الخبر ومرّ به معبد الخزاعي فهوّل عليه الأمر، فانصرف إلى مكة.\n\nفنزل: {الَّذِينَ اسْتَجَابُوا لِلَّهِ وَالرَّسُولِ مِن بَعْدِ مَا أَصَابَهُمُ الْقَرْحُ ۚ لِلَّذِينَ أَحْسَنُوا مِنْهُمْ وَاتَّقَوْا أَجْرٌ عَظِيمٌ}.",
  g:"sahih", src:"صحيح البخاري (المغازي)، سورة آل عمران 172، سيرة ابن هشام.",
  ben:[
   {t:"الردّ الفوري بعد النكسة يمنع الخصم من استثمار انتصاره. لا تترك فجوة زمنية بعد الفشل.", tags:["qiyada","siyasa"]},
   {t:"إيقاد خمسمئة نار: الحرب النفسية والإيحاء بالقوة سلاح مشروع وفعّال ورخيص.", tags:["takhtit","ilam","siyasa"]},
   {t:"اشتراط أن يخرج من شهد أُحد فقط: إعادة بناء ثقة المهزوم بنفسه فوراً. لا تستبدل فريقك بعد فشل واحد.", tags:["qiyada","tarbiya"]},
   {t:"الخروج بالجراح النازفة درس في أن أخطر ما بعد الهزيمة هو الاستسلام النفسي لا الخسارة المادية.", tags:["sabr","ibtila"]}
  ], ppl:["abusufyan"]},

 {id:"e61", t:"الرجيع وبئر معونة", d:"صفر 4هـ",
  s:"غُدر بستة من القرّاء في الرجيع، ثم قُتل سبعون من خيار الصحابة غدراً في بئر معونة.",
  n:"جاء نفر من عضل والقارة يطلبون من يعلّمهم الإسلام، فبعث ﷺ ستة — وقيل عشرة — فلما بلغوا <strong>الرجيع</strong> غدروا بهم واستصرخوا هذيلاً، فقُتل أكثرهم، وأُسر <strong>خبيب بن عدي</strong> و<strong>زيد بن الدثنة</strong> فبيعا بمكة وصُلبا. وحين سُئل خبيب: أتحبّ أن محمداً مكانك؟ قال: <strong>والله ما أحبّ أن محمداً في مكانه الذي هو فيه تصيبه شوكة وأنا جالس في أهلي</strong>. وهو أول من سنّ الركعتين عند القتل.\n\nوفي الشهر نفسه، جاء <strong>أبو براء</strong> عامر بن مالك يطلب من يدعو أهل نجد وأعطى الجوار. فبعث ﷺ <strong>سبعين</strong> من خيار أصحابه من أهل الصُّفّة والقرّاء. فلما نزلوا <strong>بئر معونة</strong> غدر بهم <strong>عامر بن الطفيل</strong> واستنفر بني سليم، فقُتلوا جميعاً إلا كعب بن زيد.\n\nفقنت ﷺ شهراً يدعو على قاتليهم. قال أنس: <strong>ما رأيت رسول الله ﷺ وجد على شيء ما وجد عليهم</strong>.",
  g:"sahih", src:"صحيح البخاري (المغازي، الجهاد)، صحيح مسلم.",
  ben:[
   {t:"أشدّ الضربات جاءت من طلب تعليم لا من ساحة قتال. حسن الظن المفرط في التعامل الأمني مكلف جداً.", tags:["takhtit","siyasa"]},
   {t:"كلمة خبيب على خشبة الصلب أعلى تعبير عن الحب في التاريخ. الولاء الحقيقي يظهر حين لا يبقى ما يُكسب.", tags:["thabat","ukhuwa","ajal"]},
   {t:"حزن النبي ﷺ الشديد وقنوته شهراً: القائد ينبغي أن يظهر ألمه على من فقد لا أن يتصنّع الجلد.", tags:["qiyada","akhlaq"]},
   {t:"سبعون من حَمَلة القرآن في يوم. الخسارة البشرية في الكفاءات أفدح من أي خسارة مادية.", tags:["tarbiya","ibtila"]}
  ], ppl:[]},

 {id:"e62", t:"إجلاء بني النضير", d:"ربيع الأول 4هـ",
  s:"همّوا بقتل النبي ﷺ غدراً بإلقاء رحى عليه، فحاصرهم فأجلاهم، ونزلت فيهم سورة الحشر.",
  n:"خرج ﷺ إلى <strong>بني النضير</strong> يستعينهم في دية قتيلين. فقالوا: نعم، اجلس هنا حتى نعطيك. ثم خلا بعضهم ببعض وقالوا: من يعلو على هذا البيت <strong>فيلقي عليه صخرة</strong> فيريحنا منه؟ فانتدب عمرو بن جحّاش.\n\nفأتاه الخبر من السماء، فقام ﷺ مسرعاً كأنه يريد حاجة ورجع إلى المدينة، ثم أمر بحربهم.\n\nفتحصّنوا، وحاصرهم <strong>ستّ ليال</strong> — وقيل خمس عشرة — وأمر بقطع بعض نخلهم وتحريقه للضغط، فقالوا: يا محمد، قد كنت تنهى عن الفساد! فنزلت: {مَا قَطَعْتُم مِّن لِّينَةٍ أَوْ تَرَكْتُمُوهَا قَائِمَةً عَلَىٰ أُصُولِهَا فَبِإِذْنِ اللَّهِ}.\n\nوقد وعدهم <strong>ابن أبيّ</strong> بالنصرة فخذلهم. فنزلوا على الجلاء بشرط أن يحملوا ما استقلّت به الإبل إلا السلاح، فخرجوا إلى <strong>خيبر</strong> وأذرعات. ونزلت فيهم <strong>سورة الحشر</strong> كاملة.",
  g:"sahih", src:"صحيح البخاري ومسلم، سورة الحشر، سيرة ابن هشام.",
  ben:[
   {t:"محاولة الاغتيال الغادرة بعد قبول المساعدة ظاهرياً. احذر من يوافق بسرعة مبالغة ويطلب منك الانتظار.", tags:["siyasa","takhtit"]},
   {t:"الضغط بقطع النخل خطوة محسوبة لتقصير الحصار وتقليل الدماء. أخفّ الضررين في الحسابات العسكرية.", tags:["awlawiyat","adl"]},
   {t:"وعد المنافقون بالنصرة وخذلوا: {كَمَثَلِ الشَّيْطَانِ إِذْ قَالَ لِلْإِنسَانِ اكْفُرْ}. من يحرّضك على الصدام غالباً لن يقف معك فيه.", tags:["mukhalif","siyasa"]},
   {t:"سمح لهم بحمل أموالهم. حتى في لحظة الحسم بقيت العقوبة محدودة الهدف — إنهاء التهديد لا الانتقام.", tags:["afw","adl"]}
  ], ppl:["ibnubayy","huyayy"]},

 {id:"e63", t:"غزوة الخندق (الأحزاب)", d:"شوال 5هـ",
  s:"تحالف عشرة آلاف لاستئصال المدينة، فحفر المسلمون خندقاً غير مسبوق، وحاصروا شهراً حتى فرّج الله بريح.",
  n:"ذهب <strong>حيي بن أخطب</strong> وزعماء بني النضير إلى قريش وغطفان يحرّضونهم، فاجتمع <strong>عشرة آلاف</strong> — أكبر حشد عرفته العرب — لاستئصال المسلمين نهائياً.\n\nفاستشار ﷺ، فأشار <strong>سلمان الفارسي</strong> بـ<strong>حفر خندق</strong> — أسلوب فارسي لم تعرفه العرب. فحفروا خندقاً حول الجهة المكشوفة من المدينة في نحو ستة أيام، والنبي ﷺ يحفر معهم ويحمل التراب حتى وارى التراب بياض بطنه، وهم جوعى قد ربطوا الحجر على بطونهم وربط ﷺ حجرين.\n\nثم اشتدّ البلاء بـ<strong>نقض بني قريظة العهد</strong> من الداخل، فصار المسلمون بين فكّي كمّاشة: {إِذْ جَاءُوكُم مِّن فَوْقِكُمْ وَمِنْ أَسْفَلَ مِنكُمْ وَإِذْ زَاغَتِ الْأَبْصَارُ وَبَلَغَتِ الْقُلُوبُ الْحَنَاجِرَ}.\n\nفاستخدم ﷺ سلاحاً آخر: بعث <strong>نُعيم بن مسعود</strong> — وقد أسلم سرّاً — <strong>ليفرّق بين الأحزاب</strong> بالإشاعة، فنجح في زرع الشك بين قريظة وقريش وغطفان.\n\nثم أرسل الله <strong>ريحاً</strong> قلعت خيامهم، فرحلوا. فقال ﷺ: <strong>«الآن نغزوهم ولا يغزوننا»</strong>.",
  g:"sahih", src:"صحيح البخاري ومسلم (غزوة الخندق)، سورة الأحزاب 9-27.",
  ben:[
   {t:"أخذ ﷺ بفكرة أجنبية عن ثقافة العرب. الحكمة ضالة المؤمن — استورد الحلول الناجعة أينما وُجدت.", tags:["shura","takhtit","mukhalif"]},
   {t:"سلمان كان مولى عجمياً وصاحب الفكرة التي أنقذت الدولة. لا تحصر الاستشارة في دائرة النخبة الاجتماعية.", tags:["shura","ukhuwa"]},
   {t:"الحلّ الدفاعي (الخندق) وفّر مواجهة انتحارية مع فارق عددي 1:3. أحياناً أفضل هجوم دفاع مبتكر.", tags:["takhtit","awlawiyat"]},
   {t:"«الحرب خدعة»: تفكيك التحالف بالمعلومة أرخص وأسرع من كسره بالسلاح. اضرب اللحمة لا الجسد.", tags:["siyasa","takhtit"]},
   {t:"جاع القائد كما جاع الجندي وربط حجرين لا حجراً. المشاركة في الحرمان تصنع طاعة لا يشتريها راتب.", tags:["qiyada","akhlaq"]},
   {t:"«الآن نغزوهم ولا يغزوننا» — قراءة صحيحة لتحوّل ميزان القوى. اعرف متى تنتقل من الدفاع للمبادرة.", tags:["siyasa","qiyada"]}
  ], ppl:["salman","huyayy","abusufyan","saadmuadh","saadubada"]},

 {id:"e64", t:"بنو قريظة وحكم سعد بن معاذ", d:"ذو القعدة 5هـ",
  s:"نقضوا العهد في أحرج لحظة، فحاصرهم ﷺ فنزلوا على حكم سعد بن معاذ فحكم بقتل المقاتلة.",
  n:"لما انصرف الأحزاب، جاء جبريل يأمر بالتوجّه إلى <strong>بني قريظة</strong> الذين نقضوا العهد في أحلك لحظة. فحاصرهم ﷺ <strong>خمساً وعشرين ليلة</strong> حتى نزلوا على حكم <strong>سعد بن معاذ</strong> — وكانوا حلفاء الأوس وسعد سيّد الأوس، فرجوا أن يحابيهم.\n\nفجيء بسعد وهو جريح، فقال: <strong>«لقد آن لي أن لا أخاف في الله لومة لائم»</strong>. ثم حكم: <strong>أن تُقتل مقاتلتهم، وتُسبى ذراريهم ونساؤهم، وتُقسم أموالهم</strong>. فقال ﷺ: «لقد حكمت فيهم بحكم الله من فوق سبعة أرقعة».\n\nوهذا الحكم موافق لما في <strong>التوراة نفسها</strong> (سفر التثنية 20) في شأن المدينة الناقضة — أي حُوكموا بشريعتهم.\n\nوعدد من قُتل مختلف فيه، والروايات بين أربعمئة وسبعمئة، وأكثرها في كتب السير لا في الصحيحين. ثم دعا سعد ربه أن يبقيه إن بقي من حرب قريش شيء، فانفجر جرحه فمات.",
  g:"sahih", src:"صحيح البخاري ومسلم (غزوة بني قريظة، حديث حكم سعد).",
  ben:[
   {t:"الخيانة في لحظة الخطر الوجودي أشدّ من العداء المعلن. الغدر من الداخل يُعامل معاملة مختلفة.", tags:["wafa","adl"]},
   {t:"حُكّم فيهم من ظنّوا أنه سيحابيهم، فحكم بالعدل. القاضي النزيه لا تحرّكه القرابة ولا الحلف.", tags:["adl","thabat"]},
   {t:"«آن لي ألّا أخاف في الله لومة لائم» — لحظة اختيار بين رضا العشيرة ورضا الله. اللحظة التي تُصنع فيها الرجال.", tags:["thabat","adl"]},
   {t:"تفويض الحكم لطرف مقبول من الخصم نفسه: ذكاء في إغلاق باب الاعتراض على النتيجة.", tags:["qiyada","siyasa"]}
  ], ppl:["saadmuadh","huyayy"]},

 {id:"e65", t:"حديث الإفك", d:"شعبان 5 أو 6هـ",
  s:"اتُّهمت عائشة زوراً فمكث الوحي شهراً، ثم نزلت براءتها في عشر آيات من سورة النور.",
  n:"في مرجع النبي ﷺ من غزوة بني المصطلق، تخلّفت <strong>عائشة</strong> عن الركب تبحث عن عقد لها، فوجدها <strong>صفوان بن المعطّل</strong> فأركبها ناقته وقادها حتى لحقوا بالجيش.\n\nفتلقّفها <strong>عبد الله بن أُبيّ</strong> فأشاعها وتولّى كِبرها، وخاض معه ناس من المسلمين منهم <strong>حسّان بن ثابت</strong> و<strong>مسطح بن أثاثة</strong> و<strong>حمنة بنت جحش</strong>.\n\nفمرضت عائشة شهراً لا تعلم بشيء، ثم علمت فبكت ليلتين ويوماً لا يرقأ لها دمع. واحتُبس الوحي نحو شهر — وهي مدة قاسية على الجميع.\n\nثم قالت كلمتها: <strong>«والله لا أجد لي ولكم مثلاً إلا أبا يوسف حين قال: فصبر جميل والله المستعان على ما تصفون»</strong>.\n\nفنزلت عشر آيات من <strong>سورة النور</strong> ببراءتها. وحُدّ من خاض بحدّ القذف. وحلف أبو بكر ألا ينفق على مسطح — وكان قريبه وفقيراً — فنزل: {وَلْيَعْفُوا وَلْيَصْفَحُوا ۗ أَلَا تُحِبُّونَ أَن يَغْفِرَ اللَّهُ لَكُمْ}، فقال أبو بكر: بلى والله، وأعاد عليه النفقة.",
  g:"sahih", src:"صحيح البخاري ومسلم (حديث الإفك المطوّل)، سورة النور 11-20.",
  ben:[
   {t:"شهر كامل من الصمت الإلهي رغم قدرة الله على البراءة الفورية. الابتلاء له مدة مقصودة تُستخرج فيها الدروس.", tags:["ibtila","sabr"]},
   {t:"الشائعة سلاح فتّاك يخترق أحصن البيوت. تشريع حدّ القذف وأدب {لَوْلَا إِذْ سَمِعْتُمُوهُ ظَنَّ الْمُؤْمِنُونَ} علاج جذري.", tags:["ilam","adl","akhlaq"]},
   {t:"أبو بكر أعاد النفقة لمن آذى ابنته لأجل آية واحدة. العفو عن المسيء أعلى مقامات الإيمان العملي.", tags:["afw","akhlaq"]},
   {t:"شارك في الإشاعة مسلمون صادقون. حسن النية لا يعفي من مسؤولية النقل بلا تثبّت.", tags:["ilam","sidq"]},
   {t:"عائشة لجأت للصبر الجميل ولم تدافع بانفعال. حين تُتّهم ظلماً ولا دليل بيدك، اصمت واصبر ودع الحق يتكلم.", tags:["sabr","maraa"]}
  ], ppl:["aisha","abubakr","ibnubayy"]}
]},

{
id:"expand", t:"التمكين والانتشار", era:"6 — 8 هـ", c:"#D8A93F",
d:"من صلح ظنّه الناس هزيمة إلى فتح مكة: ثلاث سنوات غيّرت خريطة الجزيرة العربية كلها.",
ev:[
 {id:"e66", t:"صلح الحديبية", d:"ذو القعدة 6هـ",
  s:"خرج ﷺ معتمراً فصدّته قريش، فعقد صلحاً بدت شروطه مجحفة، فسمّاه القرآن فتحاً مبيناً.",
  n:"رأى ﷺ في المنام أنه يدخل المسجد الحرام، فخرج في <strong>ألف وأربعمئة</strong> معتمرين لا محاربين، ساقوا الهدي وأحرموا ليعلم الناس أنهم لا يريدون قتالاً.\n\nفصدّتهم قريش. فتفاوض <strong>سهيل بن عمرو</strong> واتُّفق على صلح بنود ظاهرها مجحف:\n<strong>1.</strong> يرجعون هذا العام ويعتمرون في القابل ثلاثة أيام.\n<strong>2.</strong> <strong>هدنة عشر سنين</strong>.\n<strong>3.</strong> <strong>من أتى محمداً من قريش بغير إذن وليّه ردّه، ومن أتى قريشاً من المسلمين لم يُردّ</strong>.\n<strong>4.</strong> من أحبّ أن يدخل في عهد محمد دخل، ومن أحبّ عهد قريش دخل.\n\nواعترض <strong>سهيل</strong> على كتابة «بسم الله الرحمن الرحيم» فكُتب «باسمك اللهم»، وعلى «محمد رسول الله» فمحاها النبي ﷺ بيده وكتب «محمد بن عبد الله».\n\nفكرب الصحابة كرباً شديداً، وراجع <strong>عمر</strong> النبيَّ ﷺ بشدة. ولما أمرهم بالنحر والحلق لم يقم أحد ثلاثاً، فأشارت <strong>أم سلمة</strong>: اخرج ثم لا تكلّم أحداً حتى تنحر وتحلق. ففعل، فقاموا يتبعونه.\n\nثم نزلت: {إِنَّا فَتَحْنَا لَكَ فَتْحًا مُّبِينًا}. ودخل في الإسلام في السنتين التاليتين أكثر ممن دخل في العشرين سنة السابقة.",
  g:"sahih", src:"صحيح البخاري ومسلم (كتاب الشروط، غزوة الحديبية)، سورة الفتح.",
  ben:[
   {t:"البند الذي بدا أشدّ إجحافاً (ردّ من أسلم) صار سبب انتشار الإسلام في مكة نفسها. لا تحكم على بند بمعزل عن الصورة الكاملة.", tags:["siyasa","awlawiyat"]},
   {t:"تنازل عن الشكليات (البسملة، وصف الرسالة) وتمسّك بالجوهر (الهدنة والاعتراف). فرّق بين الرمز والمكسب.", tags:["awlawiyat","siyasa","thabat"]},
   {t:"مشورة أم سلمة أنقذت الموقف كله. حين يستعصي أمرك على منطقك، اسأل من هو خارج ضغط اللحظة.", tags:["shura","maraa"]},
   {t:"غيّر ﷺ الأسلوب من الأمر إلى القدوة الصامتة حين لم يستجب الناس. القائد يبدّل أدواته لا مبادئه.", tags:["qiyada","tarbiya"]},
   {t:"الهدنة حرّرت الجبهة الجنوبية فتفرّغ لخيبر والشمال. الصلح مع طرف يعني تركيز القوة على آخر.", tags:["siyasa","takhtit"]},
   {t:"عمر راجع بشدة ثم ندم وكفّر عن ذلك. الاعتراض المخلص ليس عيباً، والإصرار عليه بعد التبيّن هو العيب.", tags:["shura","sidq"]}
  ], ppl:["suhayl","umar","umsalama","uthman","abubakr"]},

 {id:"e67", t:"بيعة الرضوان", d:"ذو القعدة 6هـ — قبل الصلح",
  s:"شاع مقتل عثمان في مكة فبايع النبيُّ ﷺ أصحابَه تحت الشجرة على الموت، فنزل رضا الله عنهم.",
  n:"بعث ﷺ <strong>عثمان بن عفان</strong> إلى مكة يخبر قريشاً أنهم جاؤوا معتمرين، فاحتبسته قريش. <strong>فشاع أنه قُتل</strong>.\n\nفدعا ﷺ الناس إلى البيعة تحت <strong>شجرة سَمُرة</strong>، فبايعوه على ألا يفرّوا — وقال جابر: بايعناه على الموت. فبايعهم جميعاً، ثم <strong>ضرب بإحدى يديه على الأخرى</strong> وقال: «هذه عن عثمان».\n\nفبلغ قريشاً الخبر <strong>فرعبوا</strong>، وأرسلوا عثمان سالماً وسارعوا إلى الصلح.\n\nفنزلت: {لَّقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ فَعَلِمَ مَا فِي قُلُوبِهِمْ فَأَنزَلَ السَّكِينَةَ عَلَيْهِمْ}. وقال ﷺ: <strong>«لا يدخل النار أحد ممن بايع تحت الشجرة»</strong>. وكانوا نحو ألف وأربعمئة.\n\nولاحظ: قُطعت الشجرة بعد ذلك في عهد عمر لما رأى الناس يتبرّكون بها — سدّاً لذريعة الشرك.",
  g:"sahih", src:"صحيح البخاري ومسلم (المغازي، فضائل أصحاب الشجرة)، سورة الفتح 18.",
  ben:[
   {t:"استثمار لحظة الغضب الجماعي في بيعة منظمة بدل انفجار عشوائي. القائد يوجّه الطاقة لا يكبتها.", tags:["qiyada","siyasa"]},
   {t:"البيعة نفسها كانت رسالة ردع فحقّقت الهدف دون قتال. أحياناً إظهار الاستعداد يُغني عن الاستخدام.", tags:["siyasa","ilam"]},
   {t:"«هذه عن عثمان» — القائد يمثّل الغائب ولا ينساه. الوفاء لمن يُضحّي في مهمة بعيدة.", tags:["wafa","ukhuwa"]},
   {t:"قطع عمر للشجرة: إغلاق باب الغلوّ ولو في رمز مقدّس. حماية التوحيد أولى من حفظ الأثر.", tags:["awlawiyat","thabat"]}
  ], ppl:["uthman"]},

 {id:"e68", t:"الرسائل إلى الملوك", d:"محرم 7هـ",
  s:"أرسل ﷺ كتباً إلى هرقل وكسرى والمقوقس والنجاشي وغيرهم يدعوهم للإسلام — نقلة في التفكير الاستراتيجي.",
  n:"بعد أن أمّن الجبهة الداخلية بالحديبية، أرسل ﷺ <strong>ستة أو ثمانية رسل</strong> في يوم واحد إلى ملوك الأرض. واتُّخذ <strong>خاتم من فضة</strong> نقشه «محمد رسول الله» لأنهم لا يقرؤون كتاباً غير مختوم.\n\nومن أشهرها كتابه إلى <strong>هرقل</strong> عظيم الروم: «بسم الله الرحمن الرحيم، من محمد عبد الله ورسوله إلى هرقل عظيم الروم، سلام على من اتّبع الهدى... أسلم تسلم، يؤتك الله أجرك مرتين...» وفيه: {يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَىٰ كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ}.\n\nوقد سأل هرقل <strong>أبا سفيان</strong> — وكان تاجراً بالشام حينها — أسئلة دقيقة عن النبي ﷺ، فشهد أبو سفيان بالحق وهو عدوّ، فقال هرقل: <strong>إن كان ما تقول حقاً فسيملك موضع قدميّ هاتين</strong>.\n\nأما <strong>كسرى</strong> فمزّق الكتاب، فقال ﷺ: «مزّق الله ملكه». والمقوقس ردّ رداً حسناً وأهدى، والنجاشي أسلم.",
  g:"sahih", src:"صحيح البخاري (بدء الوحي، حديث هرقل وأبي سفيان)، صحيح مسلم.",
  ben:[
   {t:"الانتقال من الدفاع المحلي إلى الخطاب العالمي في اللحظة المناسبة. وسّع أفقك حين تستقرّ قاعدتك.", tags:["ilam","takhtit","siyasa"]},
   {t:"«أسلم تسلم» — رسالة قصيرة محدّدة بلا حشو. الخطاب الرسمي الموجز أوقع من الطويل.", tags:["ilam"]},
   {t:"صنع خاتماً لأن العرف الدولي يقتضيه. احترام أعراف من تخاطبه شرط لوصول رسالتك.", tags:["ilam","mukhalif"]},
   {t:"أبو سفيان شهد بالحق وهو عدوّ خوفاً من وصمة الكذب. المروءة تُلجم أحياناً حتى الخصم.", tags:["sidq","mukhalif"]},
   {t:"وجّه الدعوة لأصحاب القرار مباشرة. رأس الهرم إن استجاب اختصر عليك سنوات.", tags:["takhtit","qiyada"]}
  ], ppl:["abusufyan","najashi"]},

 {id:"e69", t:"غزوة خيبر", d:"محرم 7هـ",
  s:"فتح ﷺ حصون خيبر معقل التآمر اليهودي، وأقرّ أهلها على العمل في الأرض بنصف الثمر.",
  n:"كانت <strong>خيبر</strong> — على نحو مئة ميل شمال المدينة — مركز التآمر بعد إجلاء بني النضير إليها، وفيها حصون منيعة وسلاح ومال.\n\nخرج ﷺ في <strong>ألف وأربعمئة</strong> — من شهد الحديبية فقط، وفاءً بوعد الله لهم بالمغانم. وسار ليلاً <strong>ليحول بين خيبر وحلفائهم من غطفان</strong>. وصل فجراً فوجدهم خارجين بمساحيهم إلى مزارعهم.\n\nوقال يوم الحصار: <strong>«لأعطينّ الراية غداً رجلاً يحب الله ورسوله ويحبه الله ورسوله»</strong>، فبات الناس يدوكون أيهم يُعطاها، فأعطاها <strong>علي بن أبي طالب</strong> وكان أرمد فبصق في عينه فبرأ. وفُتح على يديه حصن القموص.\n\nثم سأل يهود خيبر أن يُقرّهم على الأرض <strong>يعملون فيها بنصف الثمر</strong> فقبل — وهي أصل <strong>المزارعة</strong>.\n\nوفيها حاولت <strong>امرأة</strong> تسميمه ﷺ في شاة مصلية، فأخبره الذراع، وقد أثّر السمّ فيه حتى قال في مرض موته: «ما زلت أجد ألم الطعام الذي أكلت بخيبر».",
  g:"sahih", src:"صحيح البخاري ومسلم (غزوة خيبر، فضائل علي، المزارعة).",
  ben:[
   {t:"العزل الاستراتيجي: قطع الطريق بين خيبر وغطفان قبل الهجوم. افصل خصمك عن حلفائه أولاً.", tags:["takhtit","siyasa"]},
   {t:"«يحبّ الله ورسوله ويحبّه الله ورسوله» — المعيار في الاختيار للمنصب هو الصلة بالله لا الحماس وحده.", tags:["qiyada","tarbiya"]},
   {t:"الإبقاء على أهل الأرض عاملين فيها بنصف الثمر: حل اقتصادي عملي يحفظ الإنتاج ولا يفرّغ الأرض.", tags:["mal","adl","mukhalif"]},
   {t:"أثر السم بقي في جسده الشريف سنوات. أثقال المسؤولية تترك آثاراً لا تراها العيون.", tags:["ajal","sabr"]}
  ], ppl:["ali","abubakr","umar"]},

 {id:"e70", t:"عمرة القضاء", d:"ذو القعدة 7هـ",
  s:"دخل ﷺ مكة معتمراً بموجب صلح الحديبية، فرأت قريش قوة المسلمين وانضباطهم بأعينها.",
  n:"لما حلّ الأجل خرج ﷺ في <strong>ألفين</strong> يقضون عمرتهم بموجب بنود الحديبية. فخلت مكة منهم — صعدوا الجبال ينظرون — وكانوا قد قالوا: يقدم عليكم قوم قد وهنتهم حُمّى يثرب.\n\nفأمر ﷺ أصحابه أن <strong>يرملوا</strong> — أي يسرعوا في المشي مع تقارب الخطى مظهرين الجَلَد — في الأشواط الثلاثة الأولى، وأن يضطبعوا بأرديتهم كاشفين المناكب الأيمن. فقالت قريش: <strong>هؤلاء الذين زعمتم أن الحمّى وهنتهم؟ هؤلاء أجلد من كذا وكذا</strong>.\n\nوأقام ثلاثة أيام. وتزوّج فيها <strong>ميمونة بنت الحارث</strong>. وأمر بلالاً فأذّن فوق الكعبة.\n\nوكان لهذه العمرة أثر نفسي هائل: رأت قريش <strong>الانضباط والقوة والوقار</strong>. وأسلم بعدها بأشهر <strong>خالد بن الوليد وعمرو بن العاص وعثمان بن طلحة</strong> — ثلاثة من أهم قادة قريش.",
  g:"sahih", src:"صحيح البخاري ومسلم (كتاب الحج، باب الرمل، عمرة القضاء).",
  ben:[
   {t:"إظهار القوة بلا استفزاز أو دماء: رسالة كاملة أوصلها الرمل في الطواف. الصورة أبلغ من الخطبة.", tags:["ilam","siyasa"]},
   {t:"الالتزام الحرفي بالاتفاق (ثلاثة أيام ثم الخروج) بنى ثقة أثمرت لاحقاً. الوفاء استثمار طويل الأجل.", tags:["wafa","siyasa"]},
   {t:"ثلاثة من أعظم قادة قريش أسلموا بعد أن رأوا لا بعد أن سمعوا. المشاهدة تُقنع ما لا يُقنعه الجدل.", tags:["ilam","hiwar"]},
   {t:"الرد على الحرب النفسية بحرب نفسية مضادة — لا بالغضب ولا بالتبرير.", tags:["ilam","siyasa"]}
  ], ppl:["bilal","khalid","amr"]},

 {id:"e71", t:"غزوة مؤتة", d:"جمادى الأولى 8هـ",
  s:"ثلاثة آلاف في مواجهة جيش رومي هائل، استُشهد الأمراء الثلاثة فأنقذ خالد الجيش بانسحاب بارع.",
  n:"قُتل رسول النبي ﷺ إلى بُصرى — <strong>الحارث بن عمير</strong> — على يد عامل الغساسنة، وقتل الرسل من أفظع نقض الأعراف. فبعث ﷺ <strong>ثلاثة آلاف</strong> إلى <strong>مؤتة</strong> بأرض الشام.\n\nوأمّر عليهم <strong>زيد بن حارثة</strong>، وقال: <strong>«فإن أُصيب زيد فجعفر، فإن أُصيب جعفر فعبد الله بن رواحة»</strong> — تخطيط للتعاقب القيادي غير مسبوق.\n\nفلما بلغوا الشام علموا أن الروم وحلفاءهم من العرب في جيش عظيم تذكر الروايات أنه بلغ عشرات الألوف (وبعض الأرقام المذكورة مبالغ فيها عند المحققين). فتشاوروا، فحمّسهم ابن رواحة: <strong>«ما نقاتل الناس بعدد ولا قوة، إنما نقاتلهم بهذا الدين... فإما ظهور وإما شهادة»</strong>.\n\nفاستُشهد <strong>زيد</strong> ثم <strong>جعفر</strong> — وقُطعت يداه فسُمّي ذا الجناحين — ثم <strong>ابن رواحة</strong>. فاصطلح الناس على <strong>خالد بن الوليد</strong>، فغيّر ترتيب الجيش ليوهم العدو بمدد جديد، ثم انسحب بالجيش سالماً. فسمّاه ﷺ <strong>سيف الله</strong>.\n\nوأخبر ﷺ أصحابه بالمدينة بالخبر قبل أن يصل الرسول، وعيناه تذرفان.",
  g:"sahih", src:"صحيح البخاري (غزوة مؤتة، مناقب خالد)، سيرة ابن هشام.",
  ben:[
   {t:"تحديد ثلاثة قادة بالتسلسل قبل المعركة — خطة تعاقب (Succession Plan) قبل أربعة عشر قرناً. من يخلفك في مشروعك؟", tags:["takhtit","qiyada"]},
   {t:"الانسحاب المنظّم بجيش كامل نصر لا هزيمة. حفظ الأرواح والموارد قرار شجاع يحتاج ثقة أكبر من الاندفاع.", tags:["qiyada","awlawiyat"]},
   {t:"«إنما نقاتلهم بهذا الدين» — الفارق العددي 1:20 لم يمنع الإقدام لأن الميزان مختلف. لا تُقاس المشاريع بالموارد وحدها.", tags:["tawakkul","thabat"]},
   {t:"خالد ابتكر تكتيك تبديل الميمنة والميسرة لإيهام العدو بالمدد. الابتكار الميداني يعوّض النقص العددي.", tags:["takhtit"]},
   {t:"قتل الرسول والسفير خرق لكل الأعراف — والدولة التي لا تحمي مبعوثيها تفقد هيبتها.", tags:["siyasa","adl"]}
  ], ppl:["zayd","jafar","khalid"]},

 {id:"e72", t:"فتح مكة", d:"20 رمضان 8هـ",
  s:"نقضت قريش الصلح فزحف ﷺ بعشرة آلاف، ودخل مكة بلا قتال يُذكر، وقال: اذهبوا فأنتم الطلقاء.",
  n:"أعانت قريش حلفاءها <strong>بني بكر</strong> على <strong>خزاعة</strong> حلفاء النبي ﷺ فقتلوهم في الحرم — نقضاً صريحاً للصلح. فاستصرخ عمرو بن سالم الخزاعي النبيَّ ﷺ فقال: <strong>«نُصرت يا عمرو بن سالم»</strong>.\n\nفتجهّز في <strong>سرّية تامة</strong> ودعا: «اللهم خذ العيون والأخبار عن قريش». وحين كتب <strong>حاطب بن أبي بلتعة</strong> كتاباً ينذرهم، أُدرك الكتاب مع امرأة في ظعينتها، فاعتذر حاطب بأنه أراد يداً عند القوم يحمي بها أهله، فصدّقه ﷺ لأنه شهد بدراً.\n\nخرج في <strong>عشرة آلاف</strong>، ونزل بمرّ الظهران فأمر بإيقاد <strong>عشرة آلاف نار</strong>. فجاء <strong>أبو سفيان</strong> فأسلم، فقال ﷺ: <strong>«من دخل دار أبي سفيان فهو آمن، ومن أغلق بابه فهو آمن، ومن دخل المسجد فهو آمن»</strong>.\n\nودخل مكة <strong>مطأطئاً رأسه تواضعاً</strong> حتى كادت لحيته تمسّ رحله، يقرأ سورة الفتح. وطاف وكسر الأصنام وهو يقول {جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ}.\n\nثم قال لقريش: <strong>«ما تظنّون أني فاعل بكم؟»</strong> قالوا: أخ كريم وابن أخ كريم. قال: <strong>«اذهبوا فأنتم الطلقاء»</strong>.",
  g:"sahih", src:"صحيح البخاري ومسلم (كتاب المغازي، فتح مكة).",
  ben:[
   {t:"«اذهبوا فأنتم الطلقاء» — أعظم عفو عام في التاريخ عن من قتلوا وعذّبوا وحاصروا عشرين سنة. العفو عند القدرة قمة القوة.", tags:["afw","qiyada","akhlaq"]},
   {t:"نصرة الحليف فوراً وبلا تردد. من لا ينصر حلفاءه يفقدهم ويفقد كل حليف محتمل.", tags:["wafa","siyasa"]},
   {t:"عفا عن حاطب ونظر إلى سجلّه كله لا إلى زلّته. حاسب الناس بمجموع تاريخهم لا بلحظة واحدة.", tags:["afw","qiyada"]},
   {t:"دخل مطأطئاً في أعظم لحظات نصره. النصر أخطر اختبار للتواضع من الهزيمة.", tags:["akhlaq","qiyada"]},
   {t:"«من أغلق بابه فهو آمن» — تخفيض التصعيد بمنح مخارج آمنة للجميع. لا تحاصر خصمك بلا باب خروج.", tags:["siyasa","afw"]},
   {t:"السرية التامة وعشرة آلاف نار: خدعة عسكرية وحرب نفسية حقّقتا الفتح بأقل الدماء.", tags:["takhtit","ilam"]}
  ], ppl:["abusufyan","khalid","bilal","ali","hind","suhayl"]},

 {id:"e73", t:"غزوة حنين وحصار الطائف", d:"شوال 8هـ",
  s:"أعجب المسلمون بكثرتهم فانهزموا أول الأمر، ثم ثبت النبي ﷺ فردّ الله النصر.",
  n:"بعد الفتح جمعت <strong>هوازن وثقيف</strong> نحو عشرين ألفاً بقيادة <strong>مالك بن عوف</strong>، وأخرجوا معهم الأموال والنساء والذراري ليقاتل كل عن أهله.\n\nخرج ﷺ في <strong>اثني عشر ألفاً</strong> — أكبر جيش للمسلمين حتى ذلك اليوم — فقال بعضهم: <strong>لن نُغلب اليوم من قلّة</strong>. فساءت الكلمة.\n\nوكمنت هوازن في وادي <strong>حنين</strong>، فلما انحدر المسلمون في الغَلَس رشقوهم بالنبل فجأة، فانهزم الناس هزيمة منكرة. وثبت النبي ﷺ على بغلته يقول: <strong>«أنا النبي لا كذب، أنا ابن عبد المطلب»</strong>، ومعه نفر قليل، والعباس آخذ بلجامه.\n\nفأمر العباس أن ينادي: يا أصحاب السمرة! فرجعوا وكرّوا، فأنزل الله سكينته ونصره: {وَيَوْمَ حُنَيْنٍ إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ فَلَمْ تُغْنِ عَنكُمْ شَيْئًا}.\n\nثم حاصر <strong>الطائف</strong> بضعة عشر يوماً ولم تُفتح، فرفع الحصار ودعا لثقيف بالهداية — <strong>فأسلمت بعد عام طوعاً</strong>.",
  g:"sahih", src:"صحيح البخاري ومسلم (غزوة حنين)، سورة التوبة 25-26.",
  ben:[
   {t:"الإعجاب بالعدد والقوة سبب مباشر للهزيمة — والقرآن نصّ على ذلك. الغرور بالموارد أخطر من قلّتها.", tags:["ibtila","tawakkul"]},
   {t:"ثبات القائد وحده أعاد الجيش المنهزم. حين ينهار الجميع، وجود شخص واحد ثابت يكفي لإعادة البناء.", tags:["qiyada","thabat"]},
   {t:"«يا أصحاب السمرة» — النداء بالذكرى المشتركة أسرع من الأمر العسكري. ذكّر فريقك بلحظة التزامهم الأولى.", tags:["qiyada","ukhuwa"]},
   {t:"رفع الحصار عن الطائف ثم أسلمت طوعاً بعد عام. الانسحاب من معركة متعثّرة قد يكون طريق الفوز بها.", tags:["awlawiyat","siyasa","sabr"]}
  ], ppl:["khalid","abubakr"]},

 {id:"e74", t:"قسمة غنائم حنين وعتاب الأنصار", d:"عقب حنين",
  s:"أعطى ﷺ المؤلفة قلوبهم عطايا ضخمة فوجد بعض الأنصار، فخطب فيهم خطبة أبكتهم.",
  n:"قسم ﷺ الغنائم فأعطى <strong>المؤلفة قلوبهم</strong> من طلقاء قريش عطايا ضخمة: أعطى أبا سفيان مئة من الإبل، وصفوان بن أمية وادياً مملوءاً نعماً، ولم يُعطِ <strong>الأنصار</strong> شيئاً.\n\nفوجد في أنفس بعض شبابهم وقالوا: يغفر الله لرسول الله، يعطي قريشاً ويتركنا وسيوفنا تقطر من دمائهم!\n\nفجمعهم ﷺ وخطب فيهم: <strong>«يا معشر الأنصار، ما قالة بلغتني عنكم؟ ألم آتكم ضلّالاً فهداكم الله، وعالة فأغناكم الله، وأعداء فألّف الله بين قلوبكم؟»</strong> قالوا: بل الله ورسوله أمنّ وأفضل.\n\nثم قال: <strong>«أما ترضون أن يذهب الناس بالشاة والبعير وترجعون برسول الله إلى رحالكم؟ فوالذي نفسي بيده لولا الهجرة لكنت امرأً من الأنصار... اللهم ارحم الأنصار وأبناء الأنصار وأبناء أبناء الأنصار»</strong>.\n\nفبكوا حتى أخضلوا لحاهم وقالوا: رضينا برسول الله قَسْماً وحظاً.",
  g:"sahih", src:"صحيح البخاري ومسلم (غزوة حنين، مناقب الأنصار).",
  ben:[
   {t:"وزّع المال على من يحتاج ترغيباً، وأعطى أهل الإيمان ما هو أثمن منه. العدل ليس التساوي بل وضع كل شيء موضعه.", tags:["adl","mal","qiyada"]},
   {t:"واجه الشائعة الداخلية مباشرة ولم يتجاهلها. الامتعاض المكتوم يتحوّل انشقاقاً إن أُهمل.", tags:["qiyada","ilam"]},
   {t:"بدأ بالتذكير بالفضل قبل العتاب، ثم انتهى بالدعاء لهم. هندسة كاملة لخطاب معالجة الأزمة الداخلية.", tags:["hiwar","qiyada"]},
   {t:"استخدام المال في كسب القلوب أثمر: صار كثير من المؤلَّفة من خيار المسلمين. الاستثمار في الإنسان أعلى عائداً.", tags:["mal","siyasa","afw"]}
  ], ppl:["abusufyan","saadubada"]}
]},

{
id:"complete", t:"اكتمال الدين والرحيل", era:"9 — 11 هـ", c:"#8FA8C4",
d:"عامان من التمكين الكامل، ثم خطبة وداع تختصر الرسالة، ثم رحيل هادئ في بيت عائشة.",
ev:[
 {id:"e75", t:"غزوة تبوك: جيش العسرة", d:"رجب 9هـ",
  s:"خرج ﷺ في ثلاثين ألفاً في قيظ شديد وعسرة إلى تخوم الروم، فلم يلقَ قتالاً وعاد بمكاسب سياسية.",
  n:"بلغه ﷺ أن الروم تجمع لغزو المدينة. فدعا الناس للخروج وهو <strong>وقت قيظ شديد وعسرة ومجاعة وطيب الثمار</strong>. وخلافاً لعادته صرّح بالوجهة لبُعد المسافة وشدّة الأمر.\n\nفحثّ على النفقة، فجهّز <strong>عثمان</strong> ثلث الجيش وقيل أكثر، وجاء <strong>أبو بكر</strong> بماله كله فقال ﷺ: ما أبقيت لأهلك؟ قال: أبقيت لهم الله ورسوله. وجاء <strong>عمر</strong> بنصف ماله. وجاء الفقراء يبكون ألا يجدوا ما يحملهم فنزل فيهم {تَوَلَّوا وَّأَعْيُنُهُمْ تَفِيضُ مِنَ الدَّمْعِ}.\n\nخرج في <strong>ثلاثين ألفاً</strong> وتخلّف المنافقون واعتذروا بالأعذار الكاذبة، وبُني <strong>مسجد الضرار</strong> فأمر بهدمه عند الرجوع.\n\nفلما بلغ تبوك لم يجد جمعاً، فأقام نحو عشرين ليلة. وجاءه <strong>يُحنّة بن رؤبة</strong> صاحب أيلة فصالحه على الجزية، وكذلك أهل جَرْباء وأذرح ودومة الجندل.\n\nفكانت النتيجة: <strong>هيبة سياسية على حدود الروم دون قتال</strong>، وبها انتهى عصر الغزوات.",
  g:"sahih", src:"صحيح البخاري ومسلم (غزوة تبوك، حديث كعب بن مالك)، سورة التوبة.",
  ben:[
   {t:"أشدّ اختبار كان في أصعب الظروف لا أيسرها. الاستنفار وقت الرخاء لا يكشف شيئاً.", tags:["ibtila","tarbiya"]},
   {t:"«أبقيت لهم الله ورسوله» — سقف البذل ليس له حدّ عند من عرف حقيقة الملك. راجع سقف عطائك.", tags:["mal","thabat"]},
   {t:"بكاء من عجز عن المشاركة: الحماس للمشروع يُقاس بحزنك حين تُمنع منه لا بفرحك حين تُدعى إليه.", tags:["ukhuwa","ibtila"]},
   {t:"تحقيق الهدف الاستراتيجي (الهيبة والمعاهدات) دون معركة واحدة. النصر ليس بالضرورة قتالاً.", tags:["siyasa","takhtit"]},
   {t:"هدم مسجد الضرار: المبنى الذي يُتّخذ أداةً للتفريق لا حرمة له مهما كان اسمه.", tags:["qiyada","mukhalif"]}
  ], ppl:["uthman","abubakr","umar","kaabmalik"]},

 {id:"e76", t:"الثلاثة الذين خُلِّفوا", d:"عقب تبوك — 9هـ",
  s:"صدق ثلاثة فلم يعتذروا بكذب، فهُجروا خمسين ليلة حتى نزلت توبتهم في القرآن.",
  n:"لما رجع ﷺ جاء المنافقون يعتذرون ويحلفون، فقبل ﷺ علانيتهم ووكل سرائرهم إلى الله. وتخلّف ثلاثة من المؤمنين الصادقين بلا عذر: <strong>كعب بن مالك، ومرارة بن الربيع، وهلال بن أمية</strong>.\n\nفقال كعب: <strong>«والله ما كان لي عذر، والله ما كنت قط أقوى ولا أيسر مني حين تخلّفت عنه»</strong>. ثم قال: <strong>«والله لئن حدّثته اليوم حديث كذب يرضى به عني ليوشكنّ الله أن يُسخطك عليّ»</strong>.\n\nفأمر ﷺ المسلمين <strong>بمقاطعتهم خمسين ليلة</strong>: لا يكلّمهم أحد. حتى تنكّرت لهم الأرض، وسلّم كعب على النبي ﷺ فلم يردّ. وبعد أربعين أُمروا باعتزال نسائهم. وجاءه كتاب من ملك غسّان يستميله، فأحرقه في التنور.\n\nحتى <strong>ضاقت عليهم الأرض بما رحبت</strong>، ثم نزلت توبتهم: {وَعَلَى الثَّلَاثَةِ الَّذِينَ خُلِّفُوا حَتَّىٰ إِذَا ضَاقَتْ عَلَيْهِمُ الْأَرْضُ بِمَا رَحُبَتْ...}.\n\nفقال كعب: <strong>«ما أنعم الله عليّ نعمة قط بعد أن هداني للإسلام أعظم في نفسي من صدقي لرسول الله ﷺ»</strong>.",
  g:"sahih", src:"صحيح البخاري ومسلم (حديث كعب بن مالك الطويل)، سورة التوبة 118.",
  ben:[
   {t:"العقوبة نالت الصادق ونجا منها الكاذب مؤقتاً — ثم كانت العاقبة عكسية تماماً. الصدق مُرّ عاجلاً حلوٌ آجلاً.", tags:["sidq","ibtila"]},
   {t:"رفض عرض ملك غسّان في أضعف لحظاته. من ثبت وقت الطرد من الجماعة فهو صادق الانتماء حقاً.", tags:["thabat","wafa"]},
   {t:"المقاطعة كأداة تربوية مؤقتة لا انتقامية، وانتهت بالعفو الكامل والاحتفاء. العقوبة وسيلة لا غاية.", tags:["tarbiya","qiyada","afw"]},
   {t:"كعب اعتبر صدقه أعظم نعمة بعد الإسلام. قيّم قراراتك بمعيار: ماذا سيبقى منها بعد عشرين سنة؟", tags:["sidq","ajal"]}
  ], ppl:["kaabmalik"]},

 {id:"e77", t:"عام الوفود", d:"9 — 10 هـ",
  s:"بعد الفتح تدفّقت وفود القبائل من كل الجزيرة معلنة إسلامها، فدخل الناس في دين الله أفواجاً.",

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ============================================================
   منطق التطبيق
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GRADES = {
  sahih:{n:"ثابت في الصحيحين أو ما في حكمهما", i:"✓"},
  hasan:{n:"إسناده حسن أو جيّد",               i:"✓"},
  mash: {n:"مشهور في كتب السير — لا يصحّ إسناده تماماً", i:"~"},
  daif: {n:"ضعيف — يُذكر للعلم لا للاستدلال",   i:"!"}
};

/* ---------- فهارس ---------- */
const EV = {}, EV_PERIOD = {}, PER = {}, TAG = {};
PERIODS.forEach(p => p.ev.forEach(e => { EV[e.id]=e; EV_PERIOD[e.id]=p; }));
PEOPLE.forEach(p => PER[p.id]=p);
TAGS.forEach(t => TAG[t.id]=t);

/* كل الفوائد مسطّحة مع مصدرها (تشمل تعديلات وإضافات المستخدم على مستوى الحدث) */
function allBenefits(){
  const out=[];
  PERIODS.forEach(p=>p.ev.forEach(e=>{
    const merged = getEv ? getEv(e.id) : e;
    (merged.ben||[]).forEach((b,i)=>{
      out.push({...b, ev:e.id, evT:e.t, per:p.id, perC:p.c, key:e.id+'-'+i});
    });
  }));
  (USER.ben||[]).forEach((b,i)=>out.push({...b, ev:b.ev||null, evT:b.ev?(EV[b.ev]?.t||''):'إضافة شخصية', mine:true, key:'u'+i}));
  return out;
}

/* ---------- التخزين ---------- */
const KEY='seerah_v1';
let mem={};
const store={
  get(){
    try{ return JSON.parse(localStorage.getItem(KEY)||'null') || mem; }
    catch(e){ return mem; }
  },
  set(o){
    mem=o;
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
  }
};
let USER = Object.assign({notes:{}, marks:[], ben:[], theme:'light', fb:null, code:''}, store.get());
const save = () => { store.set(USER); cloudPush(); };

/* ---------- أدوات ---------- */
let tmr;
function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tmr); tmr=setTimeout(()=>t.classList.remove('on'),2400);
}
const nf = n => n.toLocaleString('ar-EG');

/* ============================================================
   التنقّل
   ============================================================ */
const VIEWS=[
  {id:'timeline', n:'الخط الزمني'},
  {id:'benefits', n:'الفوائد'},
  {id:'people',   n:'الشخصيات'},
  {id:'mine',     n:'ملاحظاتي'},
  {id:'search',   n:'بحث'}
];
function go(id){
  $$('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+id));
  $$('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===id));
  window.scrollTo({top:0,behavior:'smooth'});
  if(id==='benefits') renderBenefits();
  if(id==='people')   renderPeople();
  if(id==='mine')     renderMine();
  if(id==='search')   setTimeout(()=>$('#q')?.focus(),120);
}
$('#nav').innerHTML = VIEWS.map((v,i)=>
  `<button class="tab${i?'':' on'}" data-v="${v.id}">${v.n}</button>`).join('');
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));

/* ============================================================
   الخط الزمني
   ============================================================ */
function renderTimeline(){
  const totalEv = PERIODS.reduce((a,p)=>a+p.ev.length,0);
  const totalBen = allBenefits().length;
  $('#v-timeline').innerHTML = `
  <div class="vhead">
    <div class="eyebrow">من عام الفيل إلى سنة إحدى عشرة</div>
    <h2>الخط الزمني للسيرة</h2>
    <p>عشر فترات مرتّبة، وداخل كل فترة أحداثها. اضغط على أي حدث لتقرأ سرده وفوائده والشخصيات المرتبطة به.</p>
  </div>
  <div class="stat">
    <div><b>${nf(PERIODS.length)}</b><span>فترة</span></div>
    <div><b>${nf(totalEv)}</b><span>حدثاً</span></div>
    <div><b>${nf(totalBen)}</b><span>فائدة</span></div>
    <div><b>${nf(TAGS.length)}</b><span>محوراً</span></div>
    <div><b>${nf(PEOPLE.length)}</b><span>شخصية</span></div>
  </div>
  <div class="spine">${PERIODS.map((p,pi)=>`
    <div class="stratum" style="--pcol:${p.c}" data-p="${p.id}">
      <div class="pcard">
        <button class="phead" data-toggle="${p.id}">
          <span class="pnum">${nf(pi+1)}</span>
          <span class="pmeta">
            <h3>${esc(p.t)}</h3>
            <div class="pera">${esc(p.era)}</div>
            <div class="pdesc">${esc(p.d)}</div>
          </span>
          <span class="pcount">${nf(p.ev.length)} أحداث</span>
          <span class="chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="pbody">
          ${p.ev.map((e0,ei)=>{ const e=getEv(e0.id);
            const edited = (USER.edits||{})[e0.id]?.n!=null || (USER.benAdd||{})[e0.id]?.length || Object.keys((USER.benEdit||{})[e0.id]||{}).length;
            return `
            <button class="ev" data-e="${e0.id}">
              <span class="evno">${nf(ei+1)}</span>
              <span class="evmeta">
                <h4>${esc(e.t)}</h4>
                <div class="evdate">${esc(e.d)}</div>
                <div class="evsum">${esc(e.s)}</div>
                <div class="evbadges">
                  <span class="mini g">${nf((e.ben||[]).length)} فوائد</span>
                  ${(e.ppl||[]).length?`<span class="mini">${nf(e.ppl.length)} شخصيات</span>`:''}
                  <span class="mini${e.g==='sahih'||e.g==='hasan'?' s':''}">${GRADES[e.g].i} ${e.g==='sahih'?'صحيح':e.g==='hasan'?'حسن':e.g==='mash'?'مشهور':'ضعيف'}</span>
                  ${edited?'<span class="mini" style="color:var(--amber);border-color:var(--amber)">معدَّل</span>':''}
                </div>
              </span>
              ${USER.notes[e0.id]?'<span class="dot-note" title="لك ملاحظة"></span>':''}
            </button>`;}).join('')}
        </div>
      </div>
    </div>`).join('')}
  </div>`;
  $$('[data-toggle]').forEach(b=>b.onclick=()=>b.closest('.stratum').classList.toggle('open'));
  $$('.ev').forEach(b=>b.onclick=()=>openEvent(b.dataset.e));
}

/* ============================================================
   نافذة الحدث
   ============================================================ */
/* دمج تعديلات المستخدم فوق البيانات الأصلية (overwrite للسرد، دمج للفوائد) */
function getEv(id){
  const base=EV[id]; if(!base) return null;
  const ed=(USER.edits||{})[id]||{};
  const extraBen=(USER.benAdd||{})[id]||[];
  const overrides=(USER.benEdit||{})[id]||{};
  const mergedBen=(base.ben||[]).map((b,i)=> overrides[i] ? {...b, ...overrides[i]} : b).concat(extraBen);
  return { ...base, n: ed.n!=null ? ed.n : base.n, ben: mergedBen };
}

function openEvent(id){
  const e=getEv(id); if(!e) return;
  const p=EV_PERIOD[id];
  const gr=GRADES[e.g];
  const editingNarr = window.__editNarr===id;
  $('#sheet').style.setProperty('--pcol', p.c);
  $('#sheet').innerHTML=`
  <div class="shead">

/* ---------- تعديل السرد ---------- */
function startEditNarr(id){ window.__editNarr=id; openEvent(id); setTimeout(()=>$('#narrEdit')?.focus(),50); }
function cancelEditNarr(id){ window.__editNarr=null; openEvent(id); }
function saveNarr(id){
  const v=$('#narrEdit').value.trim(); if(!v){ toast('السرد لا يمكن أن يكون فارغاً'); return; }
  USER.edits=USER.edits||{}; USER.edits[id]=USER.edits[id]||{};
  USER.edits[id].n=v;
  window.__editNarr=null;
  save(); toast('حُفظ السرد المعدَّل'); openEvent(id);
}
function resetNarr(id){
  if(USER.edits?.[id]) delete USER.edits[id].n;
  window.__editNarr=null;
  save(); toast('رجع السرد الأصلي'); openEvent(id);
}

/* ---------- تعديل فائدة موجودة أو مضافة ---------- */
function startBenEdit(id,i){ window.__editBen=id+':'+i; window.__addBen=null; openEvent(id); }
function cancelBenEdit(id){ window.__editBen=null; openEvent(id); }
function saveBenEdit(id,i){
  const t=$('#benEditT').value.trim(); if(!t){ toast('نص الفائدة مطلوب'); return; }
  const tags=[...$('#benEditTag').selectedOptions].map(o=>o.value);
  const origLen=(EV[id].ben||[]).length;
  if(i<origLen){
    USER.benEdit=USER.benEdit||{}; USER.benEdit[id]=USER.benEdit[id]||{};
    USER.benEdit[id][i]={t,tags};
  } else {
    USER.benAdd=USER.benAdd||{}; USER.benAdd[id]=USER.benAdd[id]||[];
    USER.benAdd[id][i-origLen]={t,tags};
  }
  window.__editBen=null;
  save(); toast('حُفظت الفائدة'); openEvent(id); if($('#v-benefits').classList.contains('on')) renderBenefits();
}

/* ---------- إضافة فائدة تندمج بلا تمييز ---------- */
function startAddBen(id){ window.__addBen=id; window.__editBen=null; openEvent(id); setTimeout(()=>$('#benNewT')?.focus(),50); }
function cancelAddBen(id){ window.__addBen=null; openEvent(id); }
function addBenTo(id){
  const t=$('#benNewT').value.trim(); if(!t){ toast('اكتب نص الفائدة'); return; }
  const tags=[...$('#benNewTag').selectedOptions].map(o=>o.value);
  USER.benAdd=USER.benAdd||{}; USER.benAdd[id]=USER.benAdd[id]||[];
  USER.benAdd[id].push({t,tags});
  window.__addBen=null;
  save(); toast('أُضيفت الفائدة'); openEvent(id); if($('#v-benefits').classList.contains('on')) renderBenefits();
}
function saveNote(id){
  const v=$('#nt').value.trim();
  if(v) USER.notes[id]=v; else delete USER.notes[id];
  save(); toast('حُفظت الملاحظة'); renderTimeline();
}
function delNote(id){ delete USER.notes[id]; save(); toast('حُذفت الملاحظة'); openEvent(id); renderTimeline(); }
function toggleMark(id){
  const i=USER.marks.indexOf(id);
  if(i<0){USER.marks.push(id); toast('أُضيف للمختارات');} else {USER.marks.splice(i,1); toast('أُزيل من المختارات');}
  save(); openEvent(id);
}
function closeOvl(){ $('#ovl').classList.remove('on'); document.body.style.overflow=''; }
$('#ovl').onclick=e=>{ if(e.target.id==='ovl') closeOvl(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOvl(); });

function exportEditsJSON(){
  const data={edits:USER.edits||{}, benEdit:USER.benEdit||{}, benAdd:USER.benAdd||{}};

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='seerah-content-edits-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); toast('نُزّل ملف التعديلات');
}
function addBen(){
  const t=$('#ubT').value.trim(); if(!t){ toast('اكتب نصّ الفائدة أولاً'); return; }

  USER.ben.push({t, tags:[$('#ubTag').value], ev:$('#ubEv').value||null});
  save(); toast('أُضيفت الفائدة'); renderMine();

function delBen(i){ USER.ben.splice(i,1); save(); toast('حُذفت الفائدة'); renderMine(); }

function hl(txt,q){
  if(!q) return esc(txt);
  const i=txt.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length));
}
