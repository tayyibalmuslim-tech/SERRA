<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سِفْر السيرة — دراسة السيرة النبوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --lapis-900:#0B1428;
  --lapis-850:#101B33;
  --lapis-800:#16243F;
  --lapis-700:#1D2F51;
  --lapis-600:#2A4270;
  --line:#24365C;
  --gold:#D8A93F;
  --gold-dim:#9A7A2E;
  --ivory:#EFE9DC;
  --ivory-dim:#B9B3A6;
  --muted:#7C8AA6;
  --sage:#6FA98C;
  --rose:#C4697F;
  --azure:#5B9BD5;
  --amber:#E0A458;
  --radius:14px;
  --sp:clamp(16px,3vw,28px);
}
html[data-theme="light"]{
  --lapis-900:#F1EEE6;
  --lapis-850:#E9E5DA;
  --lapis-800:#FFFFFF;
  --lapis-700:#E2DCCC;
  --lapis-600:#CFC6AF;
  --line:#DAD3C2;
  --gold:#8A6A16;
  --gold-dim:#B39B5E;
  --ivory:#1A1F2B;
  --ivory-dim:#4C5464;
  --muted:#6C7486;
  --sage:#2F7A5A;
  --rose:#A63E56;
  --azure:#28598C;
  --amber:#8A5B12;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--lapis-900);
  color:var(--ivory);
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  font-size:16px;line-height:1.85;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
html[data-theme="dark"] body{
  background-image:
    radial-gradient(ellipse 900px 500px at 85% -5%, rgba(42,66,112,.5), transparent 65%),
    radial-gradient(ellipse 700px 400px at 5% 100%, rgba(216,169,63,.07), transparent 60%);
  background-attachment:fixed;
}
::selection{background:var(--gold);color:var(--lapis-900)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--gold);text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

/* ====== الترويسة ====== */
header{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--lapis-900) 88%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1180px;margin:0 auto;padding:12px var(--sp);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-left:auto}
.brand .mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:9px;
  border:1px solid var(--gold-dim);
  display:grid;place-items:center;
  font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:20px;line-height:1;
  background:linear-gradient(160deg,rgba(216,169,63,.16),transparent);
}
.brand h1{font-family:'Aref Ruqaa',serif;font-size:23px;font-weight:700;letter-spacing:.5px;line-height:1.3}
.brand small{display:block;font-family:'Noto Kufi Arabic',sans-serif;font-size:10px;color:var(--muted);letter-spacing:2px;font-weight:400;margin-top:-2px}

nav{display:flex;gap:2px;flex-wrap:wrap}
.tab{
  padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;
  color:var(--muted);border:1px solid transparent;transition:.18s;
}
.tab:hover{color:var(--ivory);background:var(--lapis-800)}
.tab.on{color:var(--gold);border-color:var(--gold-dim);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.icons{display:flex;gap:6px;margin-right:auto}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.18s}
.ibtn:hover{color:var(--gold);border-color:var(--gold-dim)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

main{max-width:1180px;margin:0 auto;padding:var(--sp) var(--sp) 90px}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ====== عناوين الأقسام ====== */
.eyebrow{font-family:'Noto Kufi Arabic',sans-serif;font-size:10px;letter-spacing:3px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:6px}
.vhead{margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.vhead h2{font-family:'Aref Ruqaa',serif;font-size:clamp(26px,4.5vw,38px);font-weight:700;line-height:1.4}
.vhead p{color:var(--muted);font-size:14.5px;margin-top:6px;max-width:62ch}

/* ====== العمود الزمني ====== */
.spine{position:relative;padding-right:38px}
.spine::before{
  content:'';position:absolute;top:14px;bottom:14px;right:13px;width:1px;
  background:linear-gradient(180deg,transparent,var(--line) 6%,var(--line) 94%,transparent);
}
.stratum{position:relative;margin-bottom:14px}
.stratum::before{
  content:'';position:absolute;top:26px;right:-31px;width:15px;height:15px;border-radius:50%;
  background:var(--lapis-900);border:2px solid var(--pcol,var(--gold));z-index:2;
}
.stratum::after{
  content:'';position:absolute;top:33px;right:-16px;width:16px;height:1px;background:var(--pcol,var(--gold));opacity:.5;
}
.pcard{
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--lapis-850);transition:.2s;
}
.pcard:hover{border-color:color-mix(in srgb,var(--pcol,var(--gold)) 45%,var(--line))}
.phead{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;width:100%;text-align:right}
.pnum{
  font-family:'Aref Ruqaa',serif;font-size:26px;color:var(--pcol,var(--gold));
  line-height:1;min-width:34px;opacity:.85;padding-top:2px;
}
.pmeta{flex:1;min-width:0}
.pmeta h3{font-family:'Aref Ruqaa',serif;font-size:21px;font-weight:700;line-height:1.5}
.pera{font-family:'Noto Kufi Arabic',sans-serif;font-size:10.5px;letter-spacing:1.5px;color:var(--pcol,var(--gold));opacity:.85;margin-top:2px}
.pdesc{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.75}
.pcount{
  font-family:'Noto Kufi Arabic',sans-serif;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap;flex:0 0 auto;
}
.chev{color:var(--muted);transition:.25s;flex:0 0 auto;margin-top:4px}
.chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stratum.open .chev{transform:rotate(-180deg);color:var(--pcol,var(--gold))}
.pbody{display:none;border-top:1px solid var(--line);padding:8px}
.stratum.open .pbody{display:block}

.ev{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;
  padding:12px 14px;border-radius:10px;transition:.15s;position:relative;
}
.ev:hover{background:var(--lapis-800)}
.ev + .ev{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.evno{font-family:'Noto Kufi Arabic',sans-serif;font-size:10px;color:var(--pcol,var(--gold));opacity:.7;min-width:26px;padding-top:5px}
.evmeta{flex:1;min-width:0}
.evmeta h4{font-size:16px;font-weight:600;line-height:1.6}
.evdate{font-size:11.5px;color:var(--pcol,var(--gold));opacity:.8;font-family:'Noto Kufi Arabic',sans-serif;margin-top:1px}
.evsum{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mini{
  font-size:10.5px;font-family:'Noto Kufi Arabic',sans-serif;
  padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted);
}
.mini.g{color:var(--gold);border-color:var(--gold-dim)}
.mini.s{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 45%,transparent)}
.dot-note{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:0 0 auto;margin-top:9px}

/* ====== شبكات عامة ====== */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(275px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}

/* ====== الفوائد / الهاشتاجات ====== */
.tagbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tagchip{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--lapis-850);font-size:13.5px;color:var(--ivory-dim);transition:.18s;
}
.tagchip:hover{border-color:var(--gold-dim);color:var(--ivory)}
.tagchip.on{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:var(--gold);color:var(--gold)}
.tagchip b{font-family:'Noto Kufi Arabic',sans-serif;font-size:10px;font-weight:600;opacity:.65}
.hash{color:var(--gold-dim);font-weight:700}

.bcard{
  border:1px solid var(--line);border-right:2px solid var(--gold);
  border-radius:10px;background:var(--lapis-850);padding:16px 18px;
}
.bcard p{font-size:15px;line-height:1.9}
.bsrc{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);font-family:'Noto Kufi Arabic',sans-serif;
}
.bsrc a{font-size:12px}
.btags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.btag{font-size:11px;color:var(--gold-dim);border:1px solid var(--line);border-radius:5px;padding:1px 7px;transition:.15s}
.btag:hover{color:var(--gold);border-color:var(--gold-dim)}

/* ====== الشخصيات ====== */
.pers{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--lapis-850);
  padding:16px;text-align:right;width:100%;transition:.2s;position:relative;overflow:hidden;
}
.pers:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.pers .init{
  font-family:'Aref Ruqaa',serif;font-size:19px;color:var(--kcol,var(--gold));
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  border:1px solid color-mix(in srgb,var(--kcol,var(--gold)) 40%,transparent);
  background:color-mix(in srgb,var(--kcol,var(--gold)) 9%,transparent);margin-bottom:11px;
}
.pers h4{font-size:16.5px;font-weight:600;line-height:1.5}
.pers .role{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.pers .kind{
  position:absolute;top:14px;left:14px;font-size:10px;font-family:'Noto Kufi Arabic',sans-serif;
  padding:2px 8px;border-radius:5px;border:1px solid currentColor;color:var(--kcol,var(--muted));opacity:.8;
}

/* ====== النافذة ====== */
.ovl{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(4,8,18,.72);backdrop-filter:blur(6px);
  padding:20px;overflow-y:auto;
}
.ovl.on{display:block;animation:fade .22s ease}
.sheet{
  max-width:840px;margin:0 auto;background:var(--lapis-850);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
}
.shead{
  padding:24px 26px 20px;border-bottom:1px solid var(--line);position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pcol,var(--gold)) 8%,transparent),transparent);
}
.shead .eyebrow{color:var(--pcol,var(--gold-dim))}
.shead h3{font-family:'Aref Ruqaa',serif;font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.45;padding-left:44px}
.xbtn{position:absolute;top:20px;left:22px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.xbtn:hover{color:var(--rose);border-color:var(--rose)}
.xbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sbody{padding:22px 26px 28px}
.sec{margin-bottom:26px}
.sec:last-child{margin-bottom:0}
.sec > h5{
  font-family:'Noto Kufi Arabic',sans-serif;font-size:11px;letter-spacing:2.5px;
  color:var(--gold-dim);margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.sec > h5::after{content:'';flex:1;height:1px;background:var(--line)}
.narr{font-size:15.5px;line-height:2.05;color:var(--ivory-dim)}
.narr strong{color:var(--ivory);font-weight:600}
.quote{
  border-right:2px solid var(--gold);padding:10px 16px;margin:14px 0;
  background:color-mix(in srgb,var(--gold) 6%,transparent);border-radius:0 8px 8px 0;
  font-family:'Aref Ruqaa',serif;font-size:17px;line-height:2.1;color:var(--ivory);
}
.grade{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-family:'Noto Kufi Arabic',sans-serif;
  padding:4px 11px;border-radius:6px;border:1px solid currentColor;
}
.grade.sahih{color:var(--sage)}
.grade.hasan{color:var(--azure)}
.grade.mash{color:var(--amber)}
.grade.daif{color:var(--rose)}
.srcbox{font-size:12.5px;color:var(--muted);line-height:1.8;font-family:'Noto Kufi Arabic',sans-serif}

.ben{
  display:flex;gap:12px;padding:14px;border-radius:10px;border:1px solid var(--line);
  background:var(--lapis-800);margin-bottom:9px;
}
.ben .bn{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:16px;line-height:1.6;flex:0 0 auto;opacity:.75}
.ben .bt{flex:1;min-width:0;font-size:14.5px;line-height:1.9}
.chipline{display:flex;gap:6px;flex-wrap:wrap}
.plink{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--lapis-800);font-size:13.5px;transition:.15s;color:var(--ivory-dim)
}
.plink:hover{border-color:var(--gold-dim);color:var(--gold)}
.plink i{width:5px;height:5px;border-radius:50%;background:var(--kcol,var(--gold));font-style:normal}

textarea.note{
  width:100%;min-height:110px;resize:vertical;padding:14px;border-radius:10px;
  border:1px solid var(--line);background:var(--lapis-900);color:var(--ivory);
  font-size:14.5px;line-height:1.9;
}
textarea.note:focus{border-color:var(--gold-dim);outline:none}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:11px}
.btn{
  padding:8px 17px;border-radius:9px;border:1px solid var(--line);
  font-size:13.5px;font-weight:500;color:var(--ivory-dim);transition:.15s;
}
.btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.btn.pri{background:var(--gold);color:#0B1428;border-color:var(--gold);font-weight:600}
.btn.pri:hover{filter:brightness(1.12);color:#0B1428}
.btn.dgr:hover{border-color:var(--rose);color:var(--rose)}

input.fld,select.fld{
  width:100%;padding:10px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--lapis-900);color:var(--ivory);font-size:14px;
}
input.fld:focus,select.fld:focus{border-color:var(--gold-dim);outline:none}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-family:'Noto Kufi Arabic',sans-serif}

/* ====== البحث ====== */
.searchwrap{position:relative;margin-bottom:20px}
.searchwrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8}
#q{width:100%;padding:12px 42px 12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--lapis-850);color:var(--ivory);font-size:15px}
#q:focus{border-color:var(--gold-dim);outline:none}
.sres{border:1px solid var(--line);border-radius:10px;background:var(--lapis-850);padding:13px 16px;margin-bottom:8px;width:100%;text-align:right;transition:.15s}
.sres:hover{border-color:var(--gold-dim)}
.sres .k{font-size:10.5px;font-family:'Noto Kufi Arabic',sans-serif;color:var(--gold-dim);letter-spacing:1.5px}
.sres h4{font-size:15.5px;font-weight:600;margin-top:3px}
.sres p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.7}
mark{background:color-mix(in srgb,var(--gold) 30%,transparent);color:var(--ivory);border-radius:3px;padding:0 2px}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-family:'Aref Ruqaa',serif;font-size:34px;color:var(--gold-dim);opacity:.5;margin-bottom:10px}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.stat > div{border:1px solid var(--line);border-radius:11px;padding:12px 18px;background:var(--lapis-850);min-width:96px}
.stat b{font-family:'Aref Ruqaa',serif;font-size:25px;color:var(--gold);display:block;line-height:1.3}
.stat span{font-size:11px;color:var(--muted);font-family:'Noto Kufi Arabic',sans-serif;letter-spacing:1px}

.toast{
  position:fixed;bottom:24px;right:50%;transform:translateX(50%) translateY(80px);
  background:var(--lapis-700);border:1px solid var(--gold-dim);color:var(--ivory);
  padding:11px 22px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;
}
.toast.on{transform:translateX(50%) translateY(0);opacity:1}

details.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--lapis-850);overflow:hidden}
details.acc summary{padding:13px 16px;cursor:pointer;font-size:14.5px;font-weight:500;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:'▸';color:var(--gold);margin-left:9px;display:inline-block;transition:.2s}
details.acc[open] summary::before{transform:rotate(-90deg)}
details.acc .inner{padding:0 16px 16px;font-size:13.5px;color:var(--muted);line-height:1.9}

@media(max-width:640px){
  .hwrap{padding:10px 14px;gap:9px}
  .brand h1{font-size:19px}
  .tab{padding:6px 11px;font-size:13px}
  main{padding:16px 14px 80px}
  .spine{padding-right:26px}
  .spine::before{right:8px}
  .stratum::before{right:-24px;width:13px;height:13px}
  .stratum::after{right:-12px;width:12px}
  .phead{padding:14px 14px;gap:10px}
  .sbody{padding:18px}
  .shead{padding:20px 18px 16px}
  .ovl{padding:10px}
  .sheet{border-radius:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div style="background:#FFF3CD;border-bottom:2px solid #E0A800;color:#664D03;padding:10px 16px;font-family:'IBM Plex Sans Arabic','Tahoma',sans-serif;font-size:13.5px;line-height:1.7;text-align:center;direction:rtl" role="note">
⚠️ <strong>تنبيه:</strong> هذا المحتوى تم إعداده بمساعدة الذكاء الاصطناعي وقد يحتوي على أخطاء في الشرح والتحليل، يُرجى المراجعة والتحقق خاصة في المسائل الشرعية.
</div>

<header>
  <div class="hwrap">
    <div class="brand">
      <div class="mark">س</div>
      <div>
        <h1>سِفْر السيرة</h1>
        <small>الفترات · الفوائد · الرجال</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="icons">
      <button class="ibtn" id="themeBtn" title="تبديل المظهر"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button class="ibtn" id="syncBtn" title="المزامنة والنسخ"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9 9 9 0 01-7.6-4.2M3 12a9 9 0 019-9 9 9 0 017.6 4.2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="view on" id="v-timeline"></section>
  <section class="view" id="v-benefits"></section>
  <section class="view" id="v-people"></section>
  <section class="view" id="v-mine"></section>
  <section class="view" id="v-search"></section>
</main>

<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

   b:"ملك نصراني عادل، لجأ إليه المسلمون في الهجرتين. ردّ وفد قريش (عمرو بن العاص وعبد الله بن أبي ربيعة) وأبى أن يسلّمهم، بعد أن سمع كلمة جعفر بن أبي طالب وقراءته من سورة مريم فبكى حتى أخضل لحيته. أسلم سراً، ولما مات صلّى عليه النبي ﷺ صلاة الغائب."},
  {id:"jafar",n:"جعفر بن أبي طالب",k:"bayt",r:"ذو الجناحين، خطيب المسلمين عند النجاشي",
   b:"ابن عم النبي ﷺ وأخو علي، أشبه الناس بالنبي ﷺ خَلقاً وخُلقاً. هاجر إلى الحبشة وكان خطيب المهاجرين أمام النجاشي في أشهر خطبة مقارنة بين الجاهلية والإسلام. رجع يوم فتح خيبر. استُشهد قائداً في مؤتة بعد أن قُطعت يداه، فسمّاه النبي ﷺ ذا الجناحين."},
  {id:"zayd",n:"زيد بن حارثة",k:"sahabi",r:"حِبّ رسول الله ﷺ، الوحيد المسمّى في القرآن",
   b:"سُبي صغيراً فاشتراه حكيم بن حزام لخديجة فوهبته للنبي ﷺ. لما وجده أبوه خيّره النبي ﷺ فاختار البقاء معه على أبيه وعمه، فأعتقه وتبنّاه، حتى نزل {ادْعُوهُمْ لِآبَائِهِمْ}. من أوائل المسلمين، وصاحبه في رحلة الطائف. قائد مؤتة الأول واستُشهد فيها."},
  {id:"usama",n:"أسامة بن زيد",k:"sahabi",r:"الحِبّ ابن الحِبّ، أُمّر وهو ابن ثمانية عشر",
   b:"ابن زيد بن حارثة وأم أيمن. أحبّه النبي ﷺ حباً شديداً. أمّره على جيش فيه كبار المهاجرين والأنصار وهو شاب صغير في آخر حياته ﷺ، فطعن بعض الناس في إمارته فخطب النبي ﷺ مدافعاً عنه. نُفّذ بعثه في خلافة أبي بكر."},
  {id:"musab",n:"مصعب بن عمير",k:"sahabi",r:"أول سفير في الإسلام ومعلّم أهل المدينة",
   b:"فتى مكة المدلَّل وأنعمها عيشاً، لبس الخشن بعد إسلامه. هاجر إلى الحبشة، ثم بعثه النبي ﷺ إلى المدينة بعد بيعة العقبة الأولى ليعلّم الناس القرآن، فأسلم على يديه سعد بن معاذ وأسيد بن حضير فأسلمت دور الأنصار كلها. استُشهد يوم أُحد حاملاً اللواء ولم يوجد ما يُكفّن به إلا نمرة."},
  {id:"saadmuadh",n:"سعد بن معاذ",k:"ansar",r:"سيد الأوس، الذي اهتزّ لموته عرش الرحمن",
   b:"سيد الأوس، أسلم على يد مصعب بن عمير فقال لقومه: كلام رجالكم ونسائكم عليّ حرام حتى تسلموا، فأسلموا جميعاً في يوم. ثبت مع النبي ﷺ في مشورة بدر بكلمته المشهورة عن استعداد الأنصار. أصيب في الخندق، وحكم في بني قريظة، ثم انفجر جرحه فمات."},
  {id:"saadubada",n:"سعد بن عبادة",k:"ansar",r:"سيد الخزرج وصاحب الجود",
   b:"سيد الخزرج ومن نقباء العقبة الثانية. اشتهر بالكرم حتى كانت جفنته تدور مع النبي ﷺ. شارك في مشورة بدر وأحد والخندق، وهو الذي أراد النبي ﷺ أن يعطي غطفان ثلث ثمار المدينة فأبى هو وسعد بن معاذ بشدة."},
  {id:"ibnubayy",n:"عبد الله بن أُبيّ بن سلول",k:"khasm",r:"رأس المنافقين بالمدينة",
   b:"كان قومه قد أوشكوا أن يتوّجوه ملكاً على المدينة قبل الهجرة، فجاء الإسلام فذهب ملكه، فأضمر العداوة. أظهر الإسلام وأبطن الكفر. انسحب بثلث الجيش يوم أُحد، وقاد حديث الإفك، وقال في بني المصطلق {لَيُخْرِجَنَّ الْأَعَزُّ مِنْهَا الْأَذَلَّ}. صبر النبي ﷺ عليه سياسةً لئلا يُقال: محمد يقتل أصحابه."},
  {id:"suraqa",n:"سراقة بن مالك",k:"sahabi",r:"طالب الجائزة الذي وُعد بسواري كسرى",
   b:"من بني مدلج، خرج يطلب النبيَّ ﷺ وأبا بكر في الهجرة طمعاً في جائزة قريش (مئة ناقة)، فساخت قدما فرسه في الأرض ثلاث مرات، فطلب الأمان وعاد يردّ الناس عنهما. وعده النبي ﷺ بسواري كسرى، فلبسهما في خلافة عمر بعد فتح فارس."},
  {id:"adas",n:"عدّاس",k:"aam",r:"الغلام النصراني الذي آمن في بستان الطائف",
   b:"غلام نصراني من نينوى، مملوك لعتبة وشيبة ابني ربيعة. أرسلاه بعنب للنبي ﷺ بعد أن أُدمي في الطائف استهزاءً به. فلما ذكر النبي ﷺ اسم يونس بن متّى وأنه أخوه، أكبّ عدّاس يقبّل رأسه ويديه وقدميه وآمن. ثمرة يوم الطائف الوحيدة."},
  {id:"abusufyan",n:"أبو سفيان صخر بن حرب",k:"khasm",r:"قائد قريش في أحد والخندق، ثم أسلم يوم الفتح",
   b:"سيد بني أمية وزعيم قريش بعد بدر. قاد أُحد والخندق. صاحب القافلة التي كانت سبب بدر. أسلم ليلة فتح مكة على يد العباس بعد أن رأى جيش المسلمين، فجعل النبي ﷺ داره أماناً. حسن إسلامه بعد ذلك وشهد حنيناً والطائف وفقد عينه في اليرموك."},
  {id:"hind",n:"هند بنت عتبة",k:"sahabia",r:"محرّضة قريش في أحد، ثم أسلمت وحسن إسلامها",
   b:"زوج أبي سفيان وابنة عتبة بن ربيعة. فقدت أباها وأخاها وعمها في بدر، فحرّضت وحشياً على قتل حمزة ومثّلت بجسده. أسلمت يوم الفتح وبايعت النبيَّ ﷺ، وهي صاحبة السؤال المشهور عن نفقة الزوج الشحيح. نموذج على أن أشدّ الخصومة قد تنقلب."},
  {id:"khalid",n:"خالد بن الوليد",k:"sahabi",r:"سيف الله المسلول، صانع الكرّة يوم أُحد ثم قائد الفتوح",
   b:"من بني مخزوم، فارس قريش. هو الذي التفّ من خلف الرماة يوم أُحد فحوّل النصر إلى نكسة. أسلم في السنة الثامنة قبل الفتح مع عمرو بن العاص وعثمان بن طلحة. قاد في مؤتة بعد استشهاد الأمراء الثلاثة فأنقذ الجيش، فسماه النبي ﷺ سيف الله. قاد فتوح العراق والشام."},
  {id:"amr",n:"عمرو بن العاص",k:"sahabi",r:"داهية العرب، مبعوث قريش للحبشة ثم فاتح مصر",
   b:"من بني سهم، رجل سياسة ودهاء. أرسلته قريش إلى النجاشي ليردّ المهاجرين فرُدّ خائباً. أسلم قبل الفتح بأشهر. أمّره النبي ﷺ على غزوة ذات السلاسل وفيها كبار الصحابة. فتح مصر في خلافة عمر."},
  {id:"salman",n:"سلمان الفارسي",k:"sahabi",r:"الباحث عن الحق، صاحب فكرة الخندق",
   b:"فارسي من أصبهان، ترك المجوسية وطاف على النصارى يبحث عن الدين حتى دُلّ على نبي يُبعث بأرض بها نخل، فبيع عبداً حتى وصل المدينة. كاتب سيده على النخل والمال فأعانه النبي ﷺ والصحابة. أشار بحفر الخندق وهو أسلوب فارسي لم تعرفه العرب. قال فيه ﷺ: سلمان منّا أهل البيت."},
  {id:"suhayl",n:"سهيل بن عمرو",k:"khasm",r:"مفاوض قريش في الحديبية، أسلم يوم الفتح",
   b:"خطيب قريش. فاوض النبيَّ ﷺ في الحديبية وشدّد في الشروط حتى في كتابة البسملة واسم رسول الله. أُسر يوم بدر وفُدي. أسلم يوم الفتح، وثبّت أهل مكة بخطبته يوم وفاة النبي ﷺ حين ارتجّ الناس."},
  {id:"aisha",n:"عائشة بنت أبي بكر",k:"sahabia",r:"أم المؤمنين وفقيهة الأمة",
   b:"بنت الصديق، أحبّ نساء النبي ﷺ إليه. حملت عن النبي ﷺ علماً غزيراً في الفقه والتفسير وأحكام البيت وروت أكثر من ألفي حديث. ابتُليت بحديث الإفك فنزلت براءتها من فوق سبع سماوات في سورة النور. تُوفي النبي ﷺ في بيتها ودُفن فيه."},
  {id:"umsalama",n:"أم سلمة هند بنت أبي أمية",k:"sahabia",r:"أم المؤمنين، صاحبة المشورة يوم الحديبية",
   b:"هاجرت إلى الحبشة ثم إلى المدينة، وقصة هجرتها من أشدّ ما يُروى إذ فُرّق بينها وبين زوجها وابنها سنة كاملة. تزوّجها النبي ﷺ بعد استشهاد أبي سلمة. أشارت عليه ﷺ يوم الحديبية حين تلكّأ الصحابة في التحلل أن يخرج فينحر ويحلق دون أن يكلّم أحداً، ففعل فقاموا يتبعونه — من أعظم مواقف مشورة المرأة."},
  {id:"asmaa",n:"أسماء بنت أبي بكر",k:"sahabia",r:"ذات النطاقين، مموّنة الهجرة",
   b:"بنت أبي بكر وأخت عائشة. كانت تحمل الطعام إلى الغار سراً، وشقّت نطاقها نصفين لتربط به السفرة فسمّاها النبي ﷺ ذات النطاقين. ثبتت أمام أبي جهل حين صفعها ولم تدلّه على أبيها. ماتت وقد جاوزت المئة."},
  {id:"abduRahman",n:"عبد الرحمن بن عوف",k:"sahabi",r:"التاجر الذي رفض العطية وطلب السوق",
   b:"من العشرة المبشّرين. لما آخى النبي ﷺ بينه وبين سعد بن الربيع عرض عليه سعد نصف ماله وأن ينزل له عن إحدى امرأتيه، فقال كلمته الخالدة: بارك الله لك في أهلك ومالك، دلّوني على السوق. فما لبث أن أثرى. نموذج في العزّة الاقتصادية."},
  {id:"abuubayda",n:"أبو عبيدة بن الجراح",k:"sahabi",r:"أمين هذه الأمة",
   b:"من السابقين الأولين. هاجر إلى الحبشة. قال فيه النبي ﷺ: لكل أمة أمين وأمين هذه الأمة أبو عبيدة. نزع الحلقتين من وجنتي النبي ﷺ يوم أُحد فسقطت ثنيتاه. قاد فتوح الشام ومات في طاعون عمواس."},
  {id:"zubayr",n:"الزبير بن العوّام",k:"sahabi",r:"حواريّ رسول الله ﷺ",
   b:"ابن عمة النبي ﷺ صفية. أسلم صغيراً وهو ابن نحو ست عشرة سنة. أول من سلّ سيفاً في الإسلام حين شاع أن النبيَّ ﷺ قُتل. هاجر الهجرتين. قال فيه ﷺ: إن لكل نبي حواريّاً وحواريّ الزبير."},
  {id:"saadwaqqas",n:"سعد بن أبي وقاص",k:"sahabi",r:"أول من رمى بسهم في سبيل الله",
   b:"من السابقين وهو ابن نحو سبع عشرة سنة. أبلت أمه في منعه فامتنعت عن الطعام لتردّه عن دينه فثبت، فنزل {وَإِن جَاهَدَاكَ عَلَى أَن تُشْرِكَ بِي}. أول من رمى بسهم في سبيل الله. فدّاه النبي ﷺ بأبويه يوم أُحد. قاد القادسية وفتح فارس."},
  {id:"talha",n:"طلحة بن عبيد الله",k:"sahabi",r:"طلحة الخير، وقى النبيَّ ﷺ بيده يوم أُحد",
   b:"من العشرة المبشّرين، أسلم على يد أبي بكر. وقى النبيَّ ﷺ بنفسه يوم أُحد حتى شُلّت يده، وقال ﷺ يومئذ: من سرّه أن ينظر إلى شهيد يمشي على وجه الأرض فلينظر إلى طلحة."},
  {id:"abudharr",n:"أبو ذرّ الغفاري",k:"sahabi",r:"رابع أو خامس من أسلم، وأول من حيّا بتحية الإسلام",
   b:"من غفار، وكانت قبيلته تقطع الطريق. جاء يبحث عن النبي ﷺ فأسلم مبكراً، ثم جهر بالشهادة عند الكعبة فضُرب حتى أُغمي عليه ففعلها مرتين. أمره النبي ﷺ بالرجوع لقومه فأسلم على يديه نصف غفار. اشتهر بالزهد والصدع بالحق."},
  {id:"huyayy",n:"حيي بن أخطب",k:"khasm",r:"زعيم بني النضير ومحرّك حلف الأحزاب",
   b:"سيد بني النضير. بعد إجلائهم إلى خيبر ذهب إلى قريش وغطفان يحرّضهم ويجمعهم على المدينة فكانت غزوة الخندق. ثم دخل حصن بني قريظة فأقنع كعب بن أسد بنقض العهد مع النبي ﷺ. قُتل مع بني قريظة."},
  {id:"kaabmalik",n:"كعب بن مالك",k:"ansar",r:"أحد الثلاثة الذين خُلّفوا وشاعر النبي ﷺ",
   b:"شاعر من الأنصار. تخلّف عن تبوك بلا عذر ولم يعتذر بكذب كما فعل المنافقون، فهُجر خمسين ليلة هو وصاحباه مرارة بن الربيع وهلال بن أمية، حتى ضاقت عليهم الأرض بما رحبت، ثم نزلت توبتهم في سورة التوبة. قصته أعظم درس في الصدق."}
];

 {id:"e3", t:"حال العرب قبل الإسلام", d:"القرن السادس الميلادي",
  s:"وثنية متجذّرة، ووأد للبنات، وربا فاحش، وثأر لا ينقطع، مع بقايا من كرم وشجاعة ووفاء.",
  n:"كان العرب على <strong>وثنية</strong> عمياء تحيط بالكعبة بثلاثمئة وستين صنماً، مع بقايا من الحنيفية يعرفون بها الله ولكن يزعمون أن الأصنام تقرّبهم إليه زلفى. وكان فيهم يهود بيثرب وخيبر، ونصارى بنجران والغساسنة، ومجوس متأثرون بفارس، وقلّة من الحنفاء كزيد بن عمرو بن نفيل.\n\nأما اجتماعياً فالمرأة سلعة تُورث ولا ترث، والبنت تُوأد أحياناً خشية العار أو الفقر. والاقتصاد قائم على <strong>الربا</strong> والقمار وتجارة تحكمها القوة. والقبيلة هي المرجع، والثأر قد يستمر أربعين سنة (كحرب البسوس وداحس والغبراء).\n\nومع ذلك كان فيهم خصال أصيلة: الكرم، والوفاء بالجوار، والشجاعة، وقوة الحفظ، وفصاحة اللسان — وهذه هي المادة الخام التي صقلها الإسلام لاحقاً فصنع منها أعظم جيل.",
  g:"mash", src:"سيرة ابن هشام، الرحيق المختوم (فصل: المجتمع العربي)، محاضرات في تاريخ العرب.",
  ben:[
   {t:"معرفة الداء شرط لفهم الدواء: من لم يتصور جاهلية العرب لن يقدّر حجم الانقلاب الذي أحدثه الإسلام في عشرين سنة.", tags:["tadarruj"]},
   {t:"لا يوجد مجتمع شرّ محض؛ في أسوأ البيئات مواهب صالحة للاستثمار. القائد الناجح يبحث عن المادة الخام لا عن الكمال.", tags:["tarbiya","qiyada"]},
   {t:"الفساد الاقتصادي (الربا) والاجتماعي (وأد البنات) والسياسي (القبلية) يأتون معاً — والإصلاح لا بد أن يكون شاملاً.", tags:["mal","adl"]}
  ], ppl:[]},

 {id:"e4", t:"عبد المطلب وحفر زمزم", d:"قبل المولد بسنوات",
  s:"إعادة اكتشاف بئر زمزم بعد أن طمرتها جرهم قروناً، وعودة سقاية الحاج لبني هاشم.",
  n:"كانت جرهم قد دفنت زمزم عند خروجها من مكة، فاندثر موضعها قروناً. فرأى <strong>عبد المطلب</strong> في المنام من يأمره بحفرها ويصفها له، فقام يحفر ومعه ابنه الحارث — وكان يومئذ ولده الوحيد — فنازعته قريش وقالوا: هي بئر أبينا إسماعيل ولنا فيها حق. فاحتكموا إلى كاهنة بالشام، فلما ضلّوا في الطريق وأشرفوا على الهلاك عطشاً، انفجرت تحت راحلة عبد المطلب عين ماء، فقالوا: قد قضى الله لك علينا، والله لا نخاصمك فيها أبداً.\n\nومن هنا نذر عبد المطلب: <strong>لئن وُلد له عشرة أبناء يبلغون معه المنع ليذبحنّ أحدهم عند الكعبة</strong>.",
  g:"mash", src:"سيرة ابن هشام، الطبقات لابن سعد. القصة مشهورة في كتب السير وليست في الصحيحين.",
  ben:[
   {t:"العزم على أمر مع قلة الناصر: بدأ الحفر وليس معه إلا ولد واحد. المشاريع الكبيرة تبدأ صغيرة ووحيدة.", tags:["takhtit","tawakkul"]},
   {t:"الله يحسم الخلاف بالبرهان لا بالجدل. حين استعصت الخصومة جاء الحل من حيث لا يحتسبون.", tags:["tawakkul"]},
   {t:"النذر بما لا يملك الإنسان الوفاء به سهلٌ في لحظة الحماس، وثقيلٌ عند التنفيذ — تنبيه على التروّي في الالتزامات.", tags:["wafa"]}
  ], ppl:["abdulmuttalib"]},

 {id:"e5", t:"النذر وفداء عبد الله", d:"قبل المولد",
  s:"وقعت قرعة النذر على أحبّ أبناء عبد المطلب إليه، ففُدي بمئة من الإبل — وهو أبو النبي ﷺ.",
  n:"لما اكتمل لعبد المطلب عشرة من الولد، أخبرهم بنذره فأطاعوه. فأقرع بينهم فخرجت القرعة على <strong>عبد الله</strong> وكان أحبّهم إليه. فأخذه ليذبحه، فمنعته قريش وأخواله من بني مخزوم، وأشارت عليه امرأة عارفة أن يقارع بين عبد الله وبين عشر من الإبل، فإن خرجت القرعة على عبد الله زاد عشراً حتى يرضى الله.\n\nفما زال يزيد حتى بلغت <strong>مئة من الإبل</strong> فخرجت القرعة عليها، فنُحرت وتُرك عبد الله. ومن هنا استقرّت دية النفس في العرب بمئة من الإبل، فأقرّها الإسلام. ولهذا قال بعض السلف: النبي ﷺ ابن الذبيحين — يعني إسماعيل وعبد الله.",
  g:"mash", src:"سيرة ابن هشام، الطبقات. وحديث «أنا ابن الذبيحين» ضعيف الإسناد وإن اشتهر.",
  ben:[
   {t:"العناية الإلهية تحفظ سلسلة النبوة قبل وجودها. ما نراه صدفة هو ترتيب دقيق.", tags:["tawakkul"]},
   {t:"استشارة أهل الخبرة عند الحيرة — حتى من امرأة — أنقذت نفساً. لا تحتقر مصدر النصيحة.", tags:["shura","maraa"]},
   {t:"سنّة حسنة استقرّت في المجتمع فأقرّها الشرع لاحقاً (دية المئة). العُرف الصالح يُبنى عليه.", tags:["adl"]}
  ], ppl:["abdulmuttalib","abdullah"]},

 {id:"e6", t:"عام الفيل", d:"571م تقريباً — قبل المولد بأشهر",
  s:"أبرهة الحبشي يقصد هدم الكعبة بجيش فيه فيل، فيهلكه الله بطير أبابيل، ونزلت فيه سورة الفيل.",
  n:"بنى <strong>أبرهة الأشرم</strong> — نائب النجاشي على اليمن — كنيسة عظيمة بصنعاء سمّاها القُلَّيس ليصرف إليها حجّ العرب، فلما لم تُجدِ، خرج بجيش فيه فيل ضخم قاصداً هدم الكعبة. فأخذ في طريقه مئتي بعير لعبد المطلب.\n\nفجاءه عبد المطلب فطلب إبله فقط، فتعجّب أبرهة: أتكلّمني في مئتي بعير وأترك بيتاً هو دينك ودين آبائك؟ فقال كلمته المشهورة: <strong>«أنا ربّ الإبل، وإنّ للبيت ربّاً سيمنعه»</strong>.\n\nفلما توجّه الجيش برك الفيل ولم يقم، وأرسل الله عليهم <strong>طيراً أبابيل ترميهم بحجارة من سجيل</strong> فجعلهم كعصف مأكول. ونزلت فيها سورة الفيل تصديقاً وتخليداً. وكان ذلك قبل مولد النبي ﷺ بنحو خمسين يوماً على المشهور.",
  g:"sahih", src:"سورة الفيل، سيرة ابن هشام، البخاري (طرف منه).",
  ben:[
   {t:"الله يحمي دينه ولو تخلّى عنه أهله. عبد المطلب لم يكن قادراً على الدفاع فوكّل الأمر لربّ البيت — وهذا عين التوكل بعد استفراغ الوسع.", tags:["tawakkul","thabat"]},
   {t:"توقيت الحادثة قبل المولد بأشهر: تهيئة نفسية لأمة كاملة أن هذا البيت محروس وأن أمراً عظيماً قادم.", tags:["takhtit","tadarruj"]},
   {t:"القوة العسكرية الجبّارة تُهزم بأضعف الخلق حين يشاء الله. لا تقس موازين القوى بعينك وحدها.", tags:["tawakkul","ibtila"]},
   {t:"عبد المطلب طالب بحقه المشروع ولم يخلط بين ملكه الخاص وملك الله. وضوح الحدود في التفاوض.", tags:["siyasa"]}
  ], ppl:["abdulmuttalib"]},

 {id:"e7", t:"زواج عبد الله وآمنة ووفاة عبد الله", d:"قبل المولد بشهور",
  s:"زواج والدَي النبي ﷺ، ثم وفاة عبد الله في المدينة والنبي ﷺ في بطن أمه، فوُلد يتيماً.",
  n:"زوّج عبد المطلب ابنه عبد الله من <strong>آمنة بنت وهب</strong> سيدة نساء قريش نسباً وموضعاً. فلما حملت به، خرج عبد الله في تجارة إلى الشام، فلما رجع نزل بالمدينة عند أخواله <strong>بني عدي بن النجار</strong> مريضاً فمات عندهم ودُفن هناك، وعمره نحو خمس وعشرين سنة.\n\nوترك ميراثاً يسيراً جداً: <strong>خمسة من الإبل، وقطيع غنم، وجارية حبشية هي أم أيمن</strong> التي صارت حاضنة النبي ﷺ. فوُلد النبي ﷺ يتيماً فقيراً في بيت شريف — جمعٌ بين شرف النسب وضيق ذات اليد.",
  g:"mash", src:"سيرة ابن هشام، الطبقات لابن سعد.",
  ben:[
   {t:"اليُتم المبكر لم يكن نقصاً بل تربية: صنع في النبي ﷺ رقّة على الضعفاء واستغناءً عن الناس واتصالاً مباشراً بالله.", tags:["tarbiya","ibtila"]},
   {t:"لا تعتذر بظروف نشأتك عن مشروعك. أعظم رجل في التاريخ بدأ يتيماً بلا مال ولا أب.", tags:["ibtila","shabab"]},
   {t:"الموت يأتي في أوج الشباب والسفر والتجارة. عبد الله مات وهو في الخامسة والعشرين — تذكير أن الأجل لا ينتظر اكتمال الخطط.", tags:["ajal"]}
  ], ppl:["abdullah","amina"]}
]},

{
id:"birth", t:"المولد والنشأة", era:"571م — 610م", c:"#6FA98C",
d:"أربعون سنة من الإعداد الصامت: يُتْمٌ يصنع الاستقلال، ورعيٌ يصنع الصبر، وتجارةٌ تصنع السمعة، وخلوةٌ تصنع القلب.",
ev:[
 {id:"e8", t:"المولد الشريف", d:"عام الفيل، الاثنين من ربيع الأول",
  s:"وُلد ﷺ يوم الاثنين في مكة، وأرضعته ثويبة مولاة أبي لهب أياماً.",
  n:"وُلد ﷺ بمكة في شِعب بني هاشم يوم <strong>الاثنين</strong> — وهذا ثابت في صحيح مسلم من قوله ﷺ حين سُئل عن صوم الاثنين: «ذاك يومٌ وُلدت فيه». أما تحديد اليوم من الشهر ففيه خلاف واسع: قيل الثاني عشر من ربيع الأول وهو المشهور، وقيل التاسع وهو ما رجّحه بعض المحققين بالحساب الفلكي، وقيل غير ذلك.\n\nأرسلت آمنة إلى عبد المطلب تبشّره، فجاء مستبشراً وطاف به الكعبة وسمّاه <strong>محمداً</strong> — وكان اسماً غريباً في العرب — رجاء أن يُحمد في الأرض والسماء. وأرضعته أول أمره <strong>ثُويبة</strong> مولاة أبي لهب أياماً.\n\n<em>تنبيه:</em> كثير مما يُروى من خوارق ليلة المولد (انشقاق إيوان كسرى، خمود نار فارس) لم يثبت بإسناد صحيح، والثابت في فضله ﷺ يُغني عن الضعيف.",
  g:"sahih", src:"صحيح مسلم (صوم الاثنين)، سيرة ابن هشام. وتحديد اليوم مختلف فيه.",
  ben:[
   {t:"أعظم حدث في التاريخ مرّ بلا ضجيج إعلامي. الحق يبدأ هادئاً ثم يعلو — لا تستعجل الضجّة لمشروعك.", tags:["tadarruj"]},
   {t:"التمييز بين الثابت والمشهور في السيرة منهج لازم؛ محبة النبي ﷺ لا تُبنى على روايات واهية.", tags:["sidq"]},
   {t:"الاسم أثر: اختار عبد المطلب اسماً نادراً بنيّة عالية. الأسماء والعلامات تحمل رسائل.", tags:["ilam"]}
  ], ppl:["amina","abdulmuttalib","abulahab"]},

 {id:"e9", t:"الرضاعة في بني سعد", d:"من أيام إلى نحو 4 سنوات",
  s:"خرج ﷺ إلى بادية بني سعد مع حليمة السعدية، فتعلّم فصاحة العرب وخشونة الصحراء.",
  n:"كانت عادة أشراف مكة أن يسترضعوا أبناءهم في البادية طلباً لصحة الأبدان وفصاحة الألسنة. فجاءت مراضع بني سعد في <strong>سنة جدباء</strong>، فكل امرأة عُرض عليها اليتيم أعرضت لأنه لا أب له يُرجى عطاؤه.\n\nفلم تجد <strong>حليمة بنت أبي ذؤيب</strong> شيئاً، فكرهت أن ترجع فارغة فأخذته. فما إن أخذته حتى دَرّ ثديها وشبع صاحبه، وامتلأ ضرع شارفهم، وأسرعت أتانهم الضعيفة حتى عجب الناس. وكان القوم يقولون: اضربوا في مراح حليمة فإن غنمها تروح شباعاً وغنمنا جياع.\n\nمكث فيهم نحو أربع سنوات، فنشأ على <strong>لسان عربي فصيح</strong> وبدن قوي وعينٍ ترى السماء المفتوحة لا جدران مكة. وهي تربية قصدها الله لمن سيخاطب العرب كافة بلسانهم.",
  g:"hasan", src:"سيرة ابن هشام، الطبقات، دلائل النبوة للبيهقي.",
  ben:[
   {t:"البركة تأتي مع من ظنّه الناس عبئاً. أعرض الناس عن اليتيم فكان هو مفتاح الرزق.", tags:["tawakkul","akhlaq"]},
   {t:"البيئة تصنع الأداة: من سيخاطب العرب بلسانهم أُرسل ليتعلم لسانهم في منبعه. جهّز أدواتك قبل مهمتك.", tags:["tarbiya","takhtit"]},
   {t:"حليمة أخذته كارهةً فكان فيه خيرها كله. كم من أمر تكرهه هو باب رزقك: {وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ}.", tags:["tawakkul","ibtila"]},
   {t:"تكليف الطفل بشيء من خشونة العيش ليس قسوة بل استثمار. جيل بلا احتكاك ببعض الشدة جيل هشّ.", tags:["tarbiya","shabab"]}
  ], ppl:["halima"]},

 {id:"e10", t:"حادثة شقّ الصدر", d:"نحو السنة الرابعة",
  s:"أتاه ملكان فشقّا صدره واستخرجا علقة، فردّاه مطهَّراً — ثابت في صحيح مسلم.",
  n:"روى مسلم عن أنس أن رسول الله ﷺ أتاه <strong>جبريل</strong> وهو يلعب مع الغلمان، فأخذه فصرعه فشقّ عن قلبه فاستخرج القلب، فاستخرج منه <strong>علقة</strong> فقال: هذا حظّ الشيطان منك. ثم غسله في طست من ذهب بماء زمزم ثم لأمه وأعاده مكانه. وجاء الغلمان يسعون إلى أمه — يعني ظئره — فقالوا: إن محمداً قد قُتل. فاستقبلوه وهو منتقع اللون.\n\nقال أنس: وكنت أرى أثر ذلك المخيط في صدره. وقد ردّت حليمة الغلام إلى أمه بعد ذلك خوفاً عليه.\n\nوقد تكرّر شقّ الصدر مرة أخرى <strong>ليلة الإسراء</strong>، وهو أيضاً ثابت في الصحيحين.",
  g:"sahih", src:"صحيح مسلم (كتاب الإيمان، حديث أنس).",
  ben:[
   {t:"التطهير الباطني سابق على التكليف. من يريد حمل رسالة يبدأ بتصفية قلبه لا بترتيب خطته.", tags:["tarbiya"]},
   {t:"العصمة صناعة إلهية سابقة، لا نتيجة مجاهدة بشرية فقط — وهذا فارق بين النبي وبين المصلح.", tags:["tarbiya"]},
   {t:"وقع الحادث والنبي ﷺ يلعب مع الغلمان: أمر عظيم في سياق يومي عادي. عظائم الأمور قد تدخل حياتك في لحظة مألوفة.", tags:["ajal"]}
  ], ppl:["halima"]},

 {id:"e11", t:"وفاة آمنة بالأبواء", d:"وعمره ﷺ ست سنين",
  s:"خرجت به أمه لزيارة أخواله وقبر أبيه بالمدينة، فماتت في الطريق فصار يتيم الأبوين.",
  n:"لما بلغ <strong>ست سنين</strong>، خرجت به أمه آمنة إلى المدينة لتزور أخواله بني عدي بن النجار وقبر أبيه، ومعهما أم أيمن حاضنته. فأقاموا هناك شهراً، ثم رجعوا، فلما بلغوا <strong>الأبواء</strong> — بين مكة والمدينة — ماتت آمنة ودُفنت هناك.\n\nفرجعت به أم أيمن إلى مكة. وقد بقي في نفسه ﷺ أثر هذا، فلما مرّ بقبر أمه في عمرة الحديبية استأذن ربه في زيارته فأُذن له وبكى وأبكى من حوله، كما في صحيح مسلم.\n\nفصار ﷺ في السادسة <strong>يتيم الأب والأم</strong> — ورأى الفقد مرتين قبل أن يبلغ سن التمييز الكامل.",
  g:"sahih", src:"صحيح مسلم (زيارة القبور)، سيرة ابن هشام.",
  ben:[
   {t:"النبي ﷺ بكى على أمه بعد أكثر من خمسين سنة. الرحمة والوفاء لا تسقط بالتقادم، والبكاء رحمةً ليس ضعفاً.", tags:["akhlaq","afw"]},
   {t:"سلسلة الفقد المتكررة (الأب، الأم، الجد) صنعت رجلاً لا يتعلّق قلبه بأحد سوى الله. المِحن مدرسة تعلّق.", tags:["ibtila","tawakkul"]},
   {t:"الموت يقطع الرحلة في منتصف الطريق حرفياً — خرجت للزيارة فماتت في الأبواء. لا تؤجّل خيراً إلى «حين نعود».", tags:["ajal"]}
  ], ppl:["amina"]},

 {id:"e12", t:"كفالة عبد المطلب ثم وفاته", d:"من 6 إلى 8 سنين",
  s:"كفله جدّه وقرّبه وأجلسه على فراشه الذي لا يجلس عليه أحد، ثم مات فحزن عليه.",
  n:"كفله جدّه <strong>عبد المطلب</strong> وأحبّه حباً شديداً، حتى كان يُوضع له فراش في ظل الكعبة فيجلس عليه ولا يجلس عليه أحد من بنيه هيبةً له، فكان محمد ﷺ يأتي فيجلس عليه، فيدفعه أعمامه فيقول عبد المطلب: <strong>«دعوا ابني، فوالله إن له لشأناً»</strong>، ويجلسه معه ويمسح ظهره.\n\nفلما بلغ ﷺ <strong>ثماني سنين</strong> مات عبد المطلب، فحزن عليه حزناً شديداً وشيّعه باكياً. وأوصى قبل موته بكفالته إلى ابنه <strong>أبي طالب</strong> شقيق عبد الله لأبيه وأمه.",
  g:"mash", src:"سيرة ابن هشام، الطبقات لابن سعد.",
  ben:[
   {t:"تقدير الصغير أمام الكبار يصنع ثقةً لا تُشترى. عبد المطلب رفع مقام حفيده على أعمامه، فنشأ الطفل واثقاً.", tags:["tarbiya","shabab"]},
   {t:"الفراسة في اكتشاف المواهب المبكرة: «إن له لشأناً». من أدوار المربّي أن يرى ما لا يراه الناس.", tags:["tarbiya","qiyada"]},
   {t:"ثالث فقد قبل التاسعة. الله يهيّئ من يريد له مهمة عظيمة بسلسلة من الانقطاعات لا بسلسلة من التسهيلات.", tags:["ibtila"]}
  ], ppl:["abdulmuttalib","abutalib"]},

 {id:"e13", t:"كفالة أبي طالب ورعي الغنم", d:"من 8 سنين فصاعداً",
  s:"تولّاه عمّه أبو طالب فحماه ونصره، وعمل ﷺ برعي الغنم على قراريط لأهل مكة.",
  n:"كفله <strong>أبو طالب</strong> فأحسن كفالته وقدّمه على ولده، وحماه بعد ذلك أربعين سنة. وكان أبو طالب فقيراً كثير العيال، فلم يقعد النبي ﷺ عالة عليه، بل عمل.\n\nروى البخاري عن جابر أن النبي ﷺ قال: <strong>«ما بعث الله نبياً إلا رعى الغنم»</strong>. فقال أصحابه: وأنت؟ قال: «نعم، كنت أرعاها على قراريط لأهل مكة».\n\nوالرعي مدرسة قيادة كاملة: <strong>الصبر</strong> على مخلوق ضعيف متفرّق، و<strong>الرفق</strong> في السوق، و<strong>اليقظة</strong> من الذئب، و<strong>التفرّغ للتأمل</strong> في السماء والصحراء، و<strong>التواضع</strong> بمهنة يزدريها الأشراف.",
  g:"sahih", src:"صحيح البخاري (الإجارة)، سيرة ابن هشام.",
  ben:[
   {t:"لا عيب في مهنة صغيرة تكفّ وجهك عن السؤال. أعظم الخلق رعى الغنم بأجر زهيد وهو ابن سادة مكة.", tags:["mal","akhlaq"]},
   {t:"الرعي تدريب عملي على قيادة البشر: من صبر على غنم متفرقة صبر على أمة مختلفة.", tags:["qiyada","tarbiya"]},
   {t:"العمل المبكر يبني الشخصية. الشاب الذي لم يذق تعب كسب درهم لن يقدّر مسؤولية بناء أمة.", tags:["shabab","tarbiya"]}
  ], ppl:["abutalib"]},

 {id:"e14", t:"رحلة الشام الأولى وبَحِيرا", d:"وعمره ﷺ نحو 12 سنة",
  s:"خرج مع عمه في تجارة إلى الشام، فرآه راهب فعرف علامات النبوة ونصح أبا طالب بردّه.",
  n:"خرج أبو طالب في تجارة إلى الشام فتعلّق به النبي ﷺ ولم يطق فراقه فأخرجه معه. فلما نزلوا <strong>بُصرى</strong> بأرض الشام، رآه راهب يقال له <strong>بَحِيرا</strong>، فصنع لهم طعاماً ودعاهم — ولم يكن يفعل ذلك قبل. ثم جعل يتأمّل الغلام ويسأله، ونظر إلى ما بين كتفيه فرأى خاتم النبوة، فقال لأبي طالب: <strong>ارجع به ولا تقدم به الشام، فإني أخشى عليه من اليهود</strong>. فردّه أبو طالب مع نفر.\n\n<em>ملاحظة إسنادية مهمة:</em> القصة رواها الترمذي وحسّنها بعضهم، ونقدها آخرون من أهل الحديث لعلل في إسنادها ولمخالفة بعض ألفاظها للمعروف (كذكر أبي بكر وبلال وكانا صغيرين). فالأولى ذكرها بتحفّظ وعدم بناء أصل عليها.",
  g:"daif", src:"سنن الترمذي (المناقب)، وفي إسنادها مقال. ذكرها ابن إسحاق مطولاً.",
  ben:[
   {t:"أهل الكتاب كانوا يعرفون صفته ﷺ في كتبهم: {يَعْرِفُونَهُ كَمَا يَعْرِفُونَ أَبْنَاءَهُمْ}. المعرفة وحدها لا تُنجي بلا اتّباع.", tags:["mukhalif"]},
   {t:"منهج نقد الروايات: نحن ننقل السيرة لا لنمجّد فقط بل لنتعلّم، والتعلّم من خبر ضعيف يُورث خللاً.", tags:["sidq"]},
   {t:"اصطحاب الصغير في العمل والسفر تربية عملية. أبو طالب أخذه معه فرأى الدنيا وهو ابن اثنتي عشرة.", tags:["tarbiya","shabab"]}
  ], ppl:["abutalib"]},

 {id:"e15", t:"حرب الفِجار وحِلف الفُضول", d:"وعمره ﷺ نحو 15 و20 سنة",
  s:"شهد حرباً بين قريش وهوازن يناول أعمامه النبل، ثم شهد حلفاً لنصرة المظلوم أثنى عليه بعد الإسلام.",
  n:"شهد ﷺ <strong>حرب الفِجار</strong> بين قريش وكنانة من جهة وقيس عيلان من جهة، وسُمّيت فجاراً لأنها وقعت في الأشهر الحرم. وكان دوره محدوداً: يناول أعمامه النبل ويردّ عنهم، ولم يقتل أحداً.\n\nثم كان <strong>حلف الفضول</strong> في دار عبد الله بن جدعان، بعد أن ظُلم رجل من زبيد باع سلعة للعاص بن وائل فمنعه ثمنها ولم يجد ناصراً. فتعاقدت بطون من قريش على أن <strong>يكونوا مع المظلوم حتى يُردّ إليه حقه</strong> ما بلّ بحر صوفة.\n\nقال النبي ﷺ بعد الإسلام: «لقد شهدت في دار عبد الله بن جدعان حلفاً ما أحب أن لي به حمر النعم، ولو أُدعى به في الإسلام لأجبت».",
  g:"hasan", src:"سيرة ابن هشام، مسند أحمد. وحديث حلف الفضول حسّنه جماعة.",
  ben:[
   {t:"الإسلام يُقرّ كل عمل خيّر ولو صدر من غير المسلمين. التعاون على البرّ لا يشترط اتفاق العقيدة.", tags:["mukhalif","adl"]},
   {t:"نصرة المظلوم قيمة عابرة للأديان والأزمنة. مشروع خيري عادل يبقى محموداً بعد قرون.", tags:["adl","akhlaq"]},
   {t:"شارك النبي ﷺ في حرب بدور محدود ولم يقتل فيها. المشاركة لا تعني الذوبان في كل تفاصيل ما يفعله القوم.", tags:["thabat","awlawiyat"]}
  ], ppl:[]},

 {id:"e16", t:"الزواج من خديجة رضي الله عنها", d:"وعمره ﷺ 25 سنة",
  s:"عمل في تجارة خديجة فأعجبها أمانته، فعرضت عليه الزواج فتزوجها وبقي معها 25 سنة وفيّاً.",
  n:"كانت <strong>خديجة بنت خويلد</strong> امرأة تاجرة ذات شرف ومال، تستأجر الرجال في تجارتها. فبلغها عن النبي ﷺ صدق حديثه وعظم أمانته وكرم أخلاقه، فعرضت عليه أن يخرج بمالها إلى الشام. فخرج ومعه غلامها <strong>ميسرة</strong>، فربحت التجارة ربحاً لم تربح مثله.\n\nفلما حدّثها ميسرة بما رأى من أمانته، رغبت فيه وعرضت عليه نفسها — بواسطة صديقتها نفيسة بنت منية — فتزوجها. وكان عمره ﷺ خمساً وعشرين. أما عمرها فالمشهور أنها كانت <strong>أربعين</strong>، وقيل ثمانياً وعشرين، والخلاف قديم.\n\nبقي معها <strong>خمساً وعشرين سنة لم يتزوّج عليها</strong>، ووُلد له منها كل أولاده إلا إبراهيم. وظلّ يذكرها بعد موتها ويكرم صديقاتها حتى غارت عائشة.",
  g:"hasan", src:"سيرة ابن هشام، الطبقات، وأحاديث فضلها في الصحيحين.",
  ben:[
   {t:"السمعة رأس مال. لم يعرض عليه أحد شراكة لأنه ابن فلان، بل لأنه «الصادق الأمين». ابنِ سمعتك قبل أن تبني مشروعك.", tags:["sidq","mal"]},
   {t:"شراكة العمل قد تتحول إلى شراكة عمر، إذا قامت على تقدير الخلق لا على المظهر.", tags:["akhlaq","maraa"]},
   {t:"وفاؤه ﷺ لها بعد موتها بسنوات درس في أن العلاقة الحقيقية لا تنتهي بانتهاء المنفعة.", tags:["wafa","akhlaq"]},
   {t:"خديجة ملكت مالاً وأدارت تجارة وبادرت بالخطبة. المرأة في السيرة صاحبة قرار ومبادرة لا تابعة صامتة.", tags:["maraa","mal"]}
  ], ppl:["khadija"]},

 {id:"e17", t:"تجديد بناء الكعبة وحكم الحجر الأسود", d:"وعمره ﷺ 35 سنة",
  s:"اختلفت قريش من يضع الحجر الأسود حتى كادوا يقتتلون، فحكّموا أول داخل فكان النبي ﷺ ففصل بحكمة.",
  n:"تصدّعت الكعبة من سيل، فأجمعت قريش على هدمها وبنائها، واشترطوا ألا يدخلوا فيها إلا مالاً طيباً — فقصر بهم المال فتركوا جزءاً من الأساس خارجها وهو <strong>الحِجر</strong>.\n\nفلما بلغ البناء موضع <strong>الحجر الأسود</strong>، اختلفوا أيّ القبائل تنال شرف وضعه، واشتدّ الخلاف أربع أو خمس ليال حتى تحالفوا وأعدّوا للقتال. ثم اتفقوا أن يحكّموا أول داخل من باب المسجد، فكان <strong>محمداً ﷺ</strong>، فقالوا: هذا الأمين، رضينا.\n\nفدعا بثوب وبسطه ووضع الحجر في وسطه، ثم قال: <strong>لتأخذ كل قبيلة بناحية من الثوب ثم ارفعوه جميعاً</strong>. فلما بلغوا موضعه أخذه بيده فوضعه. فحُقنت الدماء وأخذ كل واحد نصيبه من الشرف.",
  g:"hasan", src:"سيرة ابن هشام، مسند أحمد، وذكره ابن حجر في الفتح.",
  ben:[
   {t:"الحلّ الوسط الذكي يُنهي أزمة استعصت على القوة. لا تختر بين الأطراف، اخترع طريقاً يشملهم جميعاً.", tags:["qiyada","siyasa"]},
   {t:"لقب «الأمين» كان مقبولاً عند كل الأطراف. الحياد النزيه هو رأس مال الوسيط.", tags:["sidq","adl"]},
   {t:"إشراك كل الأطراف في التنفيذ (كل قبيلة بناحية) يُذهب الشعور بالإقصاء — قاعدة إدارية ذهبية.", tags:["qiyada","shura"]},
   {t:"قريش تركت جزءاً من البيت لعدم كفاية المال الطيّب. حتى في الجاهلية كان للمصدر الحلال اعتبار.", tags:["mal"]}
  ], ppl:[]},

 {id:"e18", t:"التحنّث في غار حراء", d:"قبيل الأربعين",
  s:"حُبّب إليه الخلاء فكان يخلو بغار حراء الليالي ذوات العدد يتعبّد قبل نزول الوحي.",
  n:"روى البخاري عن عائشة أن أول ما بُدئ به رسول الله ﷺ من الوحي <strong>الرؤيا الصادقة</strong>، فكان لا يرى رؤيا إلا جاءت مثل فلق الصبح. ثم <strong>حُبّب إليه الخلاء</strong>، فكان يخلو بغار حراء فيتحنّث فيه — أي يتعبّد — <strong>الليالي ذوات العدد</strong> قبل أن ينزع إلى أهله، ويتزوّد لذلك، ثم يرجع إلى خديجة فيتزوّد لمثلها.\n\nوغار حراء في جبل النور شمال شرق مكة، صغير ضيق، يستقبل الكعبة. وكان اختياره ﷺ للخلوة استعداداً فطرياً هيّأه الله له لمفارقة ضجيج المجتمع الوثني وتصفية القلب.\n\nوهذا كان في نحو <strong>السنة الأربعين</strong> من عمره، أي بعد خمسة عشر عاماً من الاستقرار الأسري والمهني.",
  g:"sahih", src:"صحيح البخاري (بدء الوحي)، صحيح مسلم.",
  ben:[
   {t:"لا بد لكل مشروع كبير من فترة خلوة وتأمّل. الضجيج يُنتج ردود أفعال، والخلوة تُنتج رؤية.", tags:["takhtit","tarbiya"]},
   {t:"تزوّد للخلوة وخطّط لها ولم يتركها للصدفة. حتى العزلة الروحية تحتاج تنظيماً.", tags:["takhtit"]},
   {t:"خديجة كانت تجهّز له الزاد وتتحمّل غيابه. خلف كل مشروع عظيم بيت يحتضنه.", tags:["maraa","ukhuwa"]},
   {t:"جاء الوحي في الأربعين بعد نضج تام. لا تستعجل الثمرة قبل اكتمال الإعداد.", tags:["tadarruj","ajal"]}
  ], ppl:["khadija"]}
]},

{
id:"secret", t:"الدعوة السرية", era:"السنة 1 — 3 من البعثة", c:"#5B9BD5",
d:"ثلاث سنوات من البناء الصامت: لا لافتات ولا مواجهة، بل انتقاء دقيق للأفراد وتكوين نواة تحتمل ما هو قادم.",
ev:[
 {id:"e19", t:"بدء الوحي: اقرأ", d:"رمضان، السنة الأولى من البعثة",
  s:"جاءه جبريل في الغار فقال: اقرأ. فقال: ما أنا بقارئ. ثلاثاً، ثم نزلت أول خمس آيات من العلق.",
  n:"بينما هو في غار حراء جاءه <strong>جبريل</strong> فقال: اقرأ. قال: ما أنا بقارئ. قال ﷺ: <strong>فأخذني فغطّني حتى بلغ مني الجهد</strong>، ثم أرسلني فقال: اقرأ. قلت: ما أنا بقارئ. فغطّني الثانية والثالثة، ثم قال: {اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ. خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ. اقْرَأْ وَرَبُّكَ الْأَكْرَمُ. الَّذِي عَلَّمَ بِالْقَلَمِ. عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ}.\n\nفرجع بها ﷺ <strong>يرجف فؤاده</strong> حتى دخل على خديجة فقال: زمّلوني زمّلوني، فزمّلوه حتى ذهب عنه الروع، ثم أخبرها الخبر وقال: <strong>لقد خشيت على نفسي</strong>.",
  g:"sahih", src:"صحيح البخاري (بدء الوحي)، صحيح مسلم.",
  ben:[
   {t:"أول كلمة في الإسلام «اقرأ»، وأول ما ذُكر من الأدوات «القلم». أمة الرسالة أمة علم وتوثيق لا أمة انفعال.", tags:["tarbiya","ilam"]},
   {t:"القراءة مقترنة بـ«باسم ربك» — العلم بلا مرجعية أخلاقية سلاح خطر. اقرن كل تعلّم بغايته.", tags:["awlawiyat"]},
   {t:"خوفه ﷺ وارتجافه دليل صدق: لو كان متكلّفاً لادّعى الثبات. الصادق يعترف بضعفه.", tags:["sidq"]},
   {t:"الرسالة نزلت ثقيلة من أول لحظة (الغطّ ثلاثاً). التكليف العظيم لا يأتي في صورة مريحة.", tags:["ibtila"]}
  ], ppl:["khadija"]},

 {id:"e20", t:"موقف خديجة وورقة بن نوفل", d:"عقب نزول الوحي مباشرة",
  s:"ثبّتته خديجة بأعظم كلمة في تاريخ الدعم الأسري، ثم بشّره ورقة وحذّره من عداء قومه.",
  n:"لما قال ﷺ: لقد خشيت على نفسي، قالت خديجة: <strong>«كلا والله ما يخزيك الله أبداً، إنك لتصل الرحم، وتحمل الكَلّ، وتكسب المعدوم، وتقري الضيف، وتعين على نوائب الحق»</strong>.\n\nلاحظ منهجها: لم تناقشه في الرؤيا، بل <strong>ذكّرته بسجلّه الأخلاقي</strong> واستدلّت به على أن الله لن يخذله. ثم لم تكتف بالعاطفة بل <strong>أخذته إلى أهل الخبرة</strong>: ابن عمها <strong>ورقة بن نوفل</strong> الذي تنصّر وقرأ الكتب.\n\nفقال ورقة: <strong>هذا الناموس الذي نزّل الله على موسى</strong>، يا ليتني فيها جذعاً، ليتني أكون حياً إذ يخرجك قومك. فقال ﷺ مستنكراً: أوَمُخرجيّ هم؟ قال: نعم، <strong>لم يأت رجل قط بمثل ما جئت به إلا عُودي</strong>. ثم لم ينشب ورقة أن تُوفي.",
  g:"sahih", src:"صحيح البخاري (بدء الوحي)، صحيح مسلم.",
  ben:[
   {t:"أعظم دعم نفسي ليس «لا تقلق» بل تذكير الإنسان بحقيقته وسجلّه. خديجة استخدمت البرهان لا التهدئة.", tags:["maraa","akhlaq"]},
   {t:"الجمع بين الاحتواء العاطفي والحل العملي: طمأنته ثم أخذته لمن يفهم. لا تكتفِ بأحدهما.", tags:["shura","maraa"]},
   {t:"سنّة ثابتة: كل حامل حق يُعادى. توقّع العداء من أول يوم يوفّر عليك صدمة لاحقة.", tags:["sabr","ibtila"]},
   {t:"ورقة تمنّى القوة وقت النصرة ثم مات قبلها. لا تؤجّل نصرة الحق إلى وقت تظنّه أنسب — قد لا تدركه.", tags:["ajal"]}
  ], ppl:["khadija","waraqa"]},

 {id:"e21", t:"فترة الوحي ثم استئنافه", d:"بعد اقرأ بمدة",
  s:"انقطع الوحي مدة حتى حزن ﷺ، ثم نزل جبريل بسورة المدثر فبدأ عهد التكليف بالإنذار.",
  n:"ثم <strong>فتر الوحي</strong> مدة اختُلف في طولها. وقد ذكر أهل السير أنه ﷺ حزن حزناً شديداً في هذه الفترة. والغرض من الفتور — كما ذكر المحققون — أن <strong>يذهب الروع</strong> ويشتاق القلب فيستقبل الوحي الثاني بشوق لا بفزع.\n\nثم بينا هو يمشي إذ سمع صوتاً من السماء، فرفع بصره فإذا <strong>الملك الذي جاءه بحراء</strong> جالس على كرسي بين السماء والأرض، فرُعب منه ورجع فقال: زمّلوني زمّلوني. فأنزل الله: {يَا أَيُّهَا الْمُدَّثِّرُ. قُمْ فَأَنذِرْ. وَرَبَّكَ فَكَبِّرْ. وَثِيَابَكَ فَطَهِّرْ. وَالرُّجْزَ فَاهْجُرْ}.\n\nفهنا انتقل من <strong>«اقرأ»</strong> — وهو التلقّي — إلى <strong>«قم فأنذر»</strong> — وهو التبليغ. وقال ﷺ: «ثم حمي الوحي وتتابع».",
  g:"sahih", src:"صحيح البخاري (بدء الوحي، تفسير سورة المدثر)، صحيح مسلم.",
  ben:[
   {t:"فترات الجفاف الروحي أو الفتور في المشروع سنّة لا استثناء. لا تحكم على فشلك من انقطاع مؤقت.", tags:["sabr","ibtila"]},
   {t:"ترتيب المهام: تلقٍّ («اقرأ») ثم تكليف («قم فأنذر»). من يبلّغ قبل أن يتعلّم يُفسد أكثر مما يُصلح.", tags:["awlawiyat","tarbiya"]},
   {t:"«وثيابك فطهّر» جاءت مع أول أمر بالدعوة: المظهر والنظافة والطهارة جزء من رسالة الداعية لا شكليات.", tags:["akhlaq","ilam"]}
  ], ppl:[]},

 {id:"e22", t:"السابقون الأولون إلى الإسلام", d:"السنوات 1—3 من البعثة",
  s:"بدأ ﷺ بمن يثق بهم: زوجه وصاحبه ومولاه وابن عمه، ثم دائرة أوسع بالانتقاء لا بالعموم.",
  n:"بدأ ﷺ الدعوة بـ<strong>الدائرة الأقرب</strong>: <strong>خديجة</strong> أول من آمن مطلقاً، و<strong>علي بن أبي طالب</strong> أول من أسلم من الصبيان وهو ابن نحو عشر، و<strong>زيد بن حارثة</strong> أول من أسلم من الموالي، و<strong>أبو بكر</strong> أول من أسلم من الرجال الأحرار.\n\nثم كان أبو بكر مفتاحاً: أسلم على يديه <strong>عثمان بن عفان، والزبير بن العوام، وعبد الرحمن بن عوف، وسعد بن أبي وقاص، وطلحة بن عبيد الله</strong> — وهم من العشرة المبشّرين. ثم أسلم <strong>أبو عبيدة، وأبو ذر، وابن مسعود، وبلال، وصهيب، وخبّاب، وآل ياسر</strong> وغيرهم.\n\nولاحظ التنوّع المقصود: <strong>أشراف وموالٍ، أغنياء وفقراء، شيوخ وشباب</strong>، حتى لا تُختزل الدعوة في طبقة. وأكثرهم شباب دون الأربعين، بل كان أكثرهم في العشرينات.",
  g:"sahih", src:"سيرة ابن هشام، الطبقات لابن سعد، وأصول ذلك في الصحيحين.",
  ben:[
   {t:"ابدأ بمن يعرفك ويثق بك. الدائرة القريبة أقلّ تكلفةً في الإقناع وأعلى عائداً في الولاء.", tags:["tadarruj","takhtit"]},
   {t:"استثمر «العُقد الشبكية»: أبو بكر وحده أدخل ستة من العشرة. ابحث عن الشخص المؤثر لا عن العدد.", tags:["takhtit","tarbiya"]},
   {t:"التنويع الطبقي المقصود يحصّن المشروع من أن يُوصم بأنه مشروع فئة واحدة.", tags:["tarbiya","ukhuwa"]},
   {t:"الرسالة حملها شباب في العشرينات. سنّ الحماس إن وُجّه صار سنّ الإنجاز.", tags:["shabab"]}
  ], ppl:["khadija","ali","zayd","abubakr","uthman","zubayr","abduRahman","saadwaqqas","talha","abuubayda","abudharr","ibnmasud","bilal","suhaib","khabbab","yasir"]},

 {id:"e23", t:"دار الأرقم بن أبي الأرقم", d:"نحو السنة 3—6 من البعثة",
  s:"اتخذ ﷺ دار الأرقم عند الصفا مقراً سرياً للتعليم والتربية — أول مركز دعوي في الإسلام.",
  n:"اتّخذ النبي ﷺ <strong>دار الأرقم بن أبي الأرقم</strong> مقرّاً يجتمع فيه بأصحابه يعلّمهم القرآن ويربّيهم. والدار عند <strong>الصفا</strong> داخل مكة، ملتصقة بالحرم.\n\nوتأمّل عبقرية الاختيار من زوايا ثلاث:\n<strong>الأمنية:</strong> الأرقم من <strong>بني مخزوم</strong> — قبيلة أبي جهل نفسه — فلا يخطر ببال قريش أن تفتّش هناك.\n<strong>العملية:</strong> موقعها قرب الحرم يجعل تردّد الناس عليها غير لافت.\n<strong>السنّية:</strong> الأرقم كان شاباً صغيراً لا يُتوقّع منه ذلك.\n\nوفيها أسلم <strong>عمر بن الخطاب</strong> وكان تمام الأربعين. وبعد إسلامه خرجوا منها إلى العلن.",
  g:"mash", src:"سيرة ابن هشام، الطبقات، البداية والنهاية.",
  ben:[
   {t:"الأخذ بالأسباب الأمنية ليس ضعف يقين. النبي ﷺ أخفى مقره ثلاث سنين وهو المؤيد بالوحي.", tags:["takhtit","tawakkul"]},
   {t:"المكان الأكثر أماناً هو الأقل توقعاً. فكّر كخصمك لتعرف أين لن يبحث.", tags:["takhtit","siyasa"]},
   {t:"كل مشروع يحتاج «قاعدة» ثابتة يجتمع فيها الأفراد ويتلقون. الاجتماع العشوائي لا يبني هوية.", tags:["tarbiya","qiyada"]},
   {t:"الأرقم بذل بيته للدعوة وهو شاب. أعظم ما يقدّمه الإنسان أحياناً ليس مالاً بل مساحة وتسهيلاً.", tags:["shabab","mal"]}
  ], ppl:["arqam","umar"]}
]},

{
id:"public", t:"الجهر بالدعوة والابتلاء", era:"السنة 4 — 10 من البعثة", c:"#C4697F",
d:"من السرّ إلى العلن: مواجهة مفتوحة تتدرّج من السخرية إلى التعذيب إلى الحصار الاقتصادي الشامل.",
ev:[
 {id:"e24", t:"الإنذار على الصفا", d:"السنة الرابعة من البعثة",
  s:"صعد ﷺ الصفا ونادى بطون قريش فأنذرهم، فردّ عليه أبو لهب فنزلت سورة المسد.",
  n:"لما نزل قوله تعالى {وَأَنذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ}، صعد ﷺ <strong>الصفا</strong> فجعل ينادي: يا بني فهر، يا بني عديّ — لبطون قريش — حتى اجتمعوا.\n\nفقال: <strong>«أرأيتكم لو أخبرتكم أن خيلاً بالوادي تريد أن تُغير عليكم، أكنتم مصدقيّ؟»</strong> قالوا: نعم، ما جرّبنا عليك إلا صدقاً. قال: <strong>«فإني نذير لكم بين يدي عذاب شديد»</strong>.\n\nفقال أبو لهب: <strong>تبّاً لك سائر اليوم، ألهذا جمعتنا؟</strong> فنزلت: {تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ}.\n\nولاحظ المنهج: بنى ﷺ على <strong>رصيد سابق من المصداقية</strong> ثم انتقل من المسلّم به إلى المطلوب — وهو أسلوب حجاجي محكم.",
  g:"sahih", src:"صحيح البخاري (تفسير سورة المسد)، صحيح مسلم (الإيمان).",
  ben:[
   {t:"ابدأ من المتّفق عليه لتصل إلى المختلف فيه. «ما جرّبنا عليك إلا صدقاً» كانت أرضية مشتركة قبل الدعوة.", tags:["hiwar","ilam"]},
   {t:"سنوات الأمانة الأربعون كانت هي «رأس المال» في لحظة الجهر. استثمر في مصداقيتك قبل أن تحتاجها.", tags:["sidq"]},
   {t:"البدء بالأقربين أصعب لكنه أصدق. من لا يقنع أهله بمشروعه سيجد صعوبة في إقناع الغرباء.", tags:["tadarruj"]},
   {t:"القرابة لا تشفع مع العناد؛ عمّه أبو لهب نزلت فيه سورة، وابن عمه علي كان أول الصبيان إسلاماً.", tags:["ukhuwa","thabat"]}
  ], ppl:["abulahab"]},

 {id:"e25", t:"أساليب قريش: من السخرية إلى الحرب النفسية", d:"السنوات 4—10",
  s:"تدرّجت قريش: استهزاء، تشويه، تشكيك في القرآن، مساومة، إغراء، ثم تعذيب.",
  n:"سلكت قريش سلّماً متدرّجاً من الأساليب:\n<strong>1. السخرية والاستهزاء:</strong> وصفوه بالساحر والشاعر والمجنون والكاهن، وكانوا يضحكون منه ومن أتباعه.\n<strong>2. التشويه والتنفير:</strong> بعثوا النضر بن الحارث يحدّث الناس بأخبار رستم وإسفنديار ليقول: حديثي أحسن من حديثه.\n<strong>3. الحرب الإعلامية الموسمية:</strong> في موسم الحج كانوا يجلسون على مداخل مكة يحذّرون الوفود منه، حتى قال الوليد بن المغيرة كلمته: قولوا ساحر يفرّق بين المرء وأهله.\n<strong>4. التشكيك في المصدر:</strong> ادّعوا أن بشراً يعلّمه، فردّ القرآن: {لِسَانُ الَّذِي يُلْحِدُونَ إِلَيْهِ أَعْجَمِيٌّ وَهَٰذَا لِسَانٌ عَرَبِيٌّ مُّبِينٌ}.\n<strong>5. الأذى الجسدي المباشر:</strong> وضع سلا الجزور على ظهره وهو ساجد، وطرح التراب على رأسه.\n\nولاحظ: <strong>الدعاية السلبية زادت انتشاره</strong> — من حذّروهم منه صاروا يسألون عنه.",
  g:"sahih", src:"البخاري ومسلم (أذى قريش)، سيرة ابن هشام، تفسير الطبري.",
  ben:[
   {t:"الحملة المضادة قد تكون أفضل إعلان لك. تحذير قريش من محمد ﷺ جعل العرب يسألون عنه.", tags:["ilam","sabr"]},
   {t:"لا تنشغل بالردّ على كل تهمة. النبي ﷺ استمر في البناء بينما هم يستهلكون طاقتهم في التشويه.", tags:["awlawiyat","sabr"]},
   {t:"الخصم يعرف نقطة قوتك: اختاروا «ساحر يفرّق» لأنهم يعلمون أن القرآن يجذب. اقرأ اتهامهم لتعرف أين قوتك.", tags:["siyasa","ilam"]},
   {t:"الأذى تدرّج من الكلمة إلى اليد. من سكت عن الظلم اللفظي مهّد للظلم المادي.", tags:["sabr","ibtila"]}
  ], ppl:["abujahl","abulahab"]},

 {id:"e26", t:"مساومة عتبة بن ربيعة", d:"السنوات الوسطى من العهد المكي",
  s:"عرضت قريش المال والملك والزواج والطبّ مقابل ترك الدعوة، فردّ ﷺ بقراءة فصّلت.",
  n:"جاء <strong>عتبة بن ربيعة</strong> ممثلاً عن قريش، فعرض عليه عرضاً متدرّجاً ذكياً: <strong>إن كنت تريد مالاً</strong> جمعنا لك حتى تكون أكثرنا مالاً، <strong>وإن كنت تريد شرفاً</strong> سوّدناك علينا، <strong>وإن كنت تريد ملكاً</strong> ملّكناك، <strong>وإن كان هذا رئيّاً</strong> — أي مسّاً — طلبنا لك الطبّ وبذلنا أموالنا حتى نبرئك.\n\nفلما فرغ قال ﷺ: <strong>«أفرغت يا أبا الوليد؟»</strong> قال: نعم. فقرأ عليه صدر سورة فصّلت حتى بلغ آية السجدة فسجد، ثم قال: «قد سمعت يا أبا الوليد، فأنت وذاك».\n\nفرجع عتبة إلى قومه بوجه متغيّر وقال: <strong>خلّوا بينه وبين الناس</strong>، فوالله ليكونن لقوله نبأ.",
  g:"hasan", src:"سيرة ابن هشام، دلائل النبوة للبيهقي، ورواه ابن أبي حاتم.",
  ben:[
   {t:"«أفرغت يا أبا الوليد؟» — أنصت للخصم حتى يفرغ تماماً. الاستماع الكامل نزع سلاح المفاوض.", tags:["hiwar","akhlaq"]},
   {t:"العروض المغرية اختبار المبدأ الحقيقي. من كان في مشروعه ثمن فهو تاجر لا صاحب رسالة.", tags:["thabat"]},
   {t:"لم يجادله بمنطقه بل قرأ عليه القرآن. أحياناً أقوى ردّ هو عرض المحتوى نفسه لا الدفاع عنه.", tags:["ilam","hiwar"]},
   {t:"ناداه بكنيته «أبا الوليد» تكريماً وهو خصم. أدب الخطاب لا يسقط باختلاف الموقف.", tags:["akhlaq","mukhalif"]}
  ], ppl:["utba"]},

 {id:"e27", t:"تعذيب المستضعفين", d:"السنوات 4—10",
  s:"صبّت قريش عذابها على من لا عشيرة تحميه: بلال، آل ياسر، خبّاب، وغيرهم.",
  n:"عجزت قريش عن النبي ﷺ لمكان أبي طالب، وعن أصحاب العشائر، فصبّت غضبها على <strong>من لا حِمى له</strong>:\n\n<strong>بلال:</strong> كان أمية بن خلف يخرجه في حرّ الظهيرة فيطرحه على ظهره في الرمضاء ويضع الصخرة العظيمة على صدره ويقول: لا تزال هكذا حتى تموت أو تكفر بمحمد. فيقول: <strong>أحدٌ أحد</strong>.\n\n<strong>آل ياسر:</strong> كانوا يُخرجون إذا حميت البطحاء فيُعذّبون بحرّها. فيمرّ بهم النبي ﷺ فيقول: <strong>«صبراً آل ياسر، فإنّ موعدكم الجنة»</strong>. وطعن أبو جهل <strong>سميّة</strong> فقتلها فكانت <strong>أول شهيدة في الإسلام</strong>.\n\n<strong>خبّاب:</strong> كُوي ظهره على الجمر حتى أطفأه ودك ظهره.\n\nولم يملك النبي ﷺ لهم دفعاً مادياً، فأعطاهم <strong>الأفق</strong> بدل الحل.",
  g:"sahih", src:"صحيح البخاري (مناقب الأنصار)، مسلم، سيرة ابن هشام.",
  ben:[
   {t:"القائد الصادق لا يعد بما لا يملك. لم يقل ﷺ «سأنقذكم» بل «موعدكم الجنة» — ورفع سقف الرؤية بدل الوعد الكاذب.", tags:["qiyada","sidq"]},
   {t:"الظلم يبدأ بالأضعف دائماً. حماية المستضعفين ليست فضلاً بل خط دفاع أول عن الجميع.", tags:["adl","ukhuwa"]},
   {t:"«أحدٌ أحد» — كلمة واحدة قد تكون كل ما تملك. الثبات لا يحتاج بلاغة بل يقيناً.", tags:["thabat","sabr"]},
   {t:"أول دم أُريق في الإسلام دم امرأة. الحضور النسائي في التضحية سابق ومقدَّم.", tags:["maraa","ibtila"]}
  ], ppl:["bilal","yasir","khabbab","umayya","abujahl","abubakr"]},

 {id:"e28", t:"إسلام حمزة بن عبد المطلب", d:"السنة السادسة من البعثة",
  s:"أسلم حمزة غضباً حين علم أن أبا جهل شتم النبي ﷺ، فكان إسلامه قوة ومنعة للمسلمين.",
  n:"مرّ <strong>أبو جهل</strong> بالنبي ﷺ عند الصفا فآذاه وشتمه، والنبي ﷺ لا يكلّمه. ورأت ذلك مولاة لعبد الله بن جدعان.\n\nفلما أقبل <strong>حمزة</strong> راجعاً من قنصه — وكان صاحب صيد يخرج بقوسه — أخبرته المولاة الخبر. فاحتمل حمزة الغضب، وكان أعزّ فتى في قريش، فأقبل يسرع حتى وجد أبا جهل جالساً في القوم، فرفع القوس فضربه بها ضربة شجّته شجّة منكرة، ثم قال: <strong>أتشتمه وأنا على دينه، أقول ما يقول؟ فرُدّ ذلك عليّ إن استطعت</strong>.\n\nفقامت رجال من بني مخزوم لنصرة أبي جهل، فقال أبو جهل: <strong>دعوا أبا عمارة، فإني والله قد سببت ابن أخيه سبّاً قبيحاً</strong>. ثم ثبّت الله حمزة على الإسلام.\n\nفكان في إسلامه <strong>عزّ للمسلمين</strong> وكفّ من أذى قريش.",
  g:"mash", src:"سيرة ابن هشام، الطبقات لابن سعد.",
  ben:[
   {t:"الله يهدي بأسباب لا تُحصى — حتى الغيرة القبلية كانت باباً. لا تحتقر بداية أحد.", tags:["tarbiya"]},
   {t:"أبو جهل ابتلع الإهانة لحسابات المصلحة. الخصم الذكي قد يتراجع تكتيكياً — لا تظنّه تغيّر.", tags:["siyasa","mukhalif"]},
   {t:"دخول شخصية قوية للصف يغيّر موازين القوى. استثمر في كسب المؤثرين لا في كثرة الأتباع.", tags:["takhtit","qiyada"]},
   {t:"سكوت النبي ﷺ عن سبّ أبي جهل ثم نصرة الله له بحمزة: من ترك الانتصار لنفسه انتصر له الله.", tags:["sabr","tawakkul"]}
  ], ppl:["hamza","abujahl"]},

 {id:"e29", t:"الهجرة الأولى إلى الحبشة", d:"رجب، السنة الخامسة من البعثة",
  s:"أذن ﷺ لطائفة بالهجرة إلى الحبشة عند ملك عادل لا يُظلم عنده أحد — أول هجرة في الإسلام.",
  n:"لما اشتدّ البلاء قال لهم النبي ﷺ: <strong>«لو خرجتم إلى أرض الحبشة، فإن بها ملكاً لا يُظلم عنده أحد، وهي أرض صدق، حتى يجعل الله لكم فرجاً مما أنتم فيه»</strong>.\n\nفخرج نحو <strong>أحد عشر رجلاً وأربع نسوة</strong> — وقيل اثنا عشر وأربع — منهم <strong>عثمان بن عفان</strong> وزوجه <strong>رقية</strong> بنت النبي ﷺ، حتى قال ﷺ فيهما: إنهما أول من هاجر بعد لوط.\n\nخرجوا سرّاً متسلّلين إلى الشُّعيبة، فوجدوا سفينتين تجاريتين حملتاهم إلى الحبشة بنصف دينار. وأقاموا هناك في أمن.\n\nولاحظ عمق الاختيار: <strong>الحبشة دولة نصرانية</strong> — أي أقرب عقدياً من الوثنية — و<strong>خارج نفوذ قريش التجاري المباشر</strong>، و<strong>ملكها معروف بالعدل</strong>. قرار مبني على معلومات دقيقة لا على هروب عشوائي.",
  g:"hasan", src:"سيرة ابن هشام، الطبقات، والبخاري في مواضع من قصة الحبشة.",
  ben:[
   {t:"«ملك لا يُظلم عنده أحد» — معيار الاختيار كان العدل لا الدين. العدل قيمة يُبنى عليها التحالف.", tags:["mukhalif","adl"]},
   {t:"الانسحاب التكتيكي ليس هزيمة. حفظ النواة البشرية أهم من إثبات البطولة في مواجهة خاسرة.", tags:["awlawiyat","takhtit"]},
   {t:"جمع معلومات دقيقة عن الوجهة قبل التحرك. القرار الصحيح ابن المعلومة الصحيحة.", tags:["takhtit","siyasa"]},
   {t:"لم يهاجر النبي ﷺ معهم بل بقي في الميدان. القائد لا يخرج أولاً من الشدّة.", tags:["qiyada"]}
  ], ppl:["uthman","najashi"]},

 {id:"e30", t:"الهجرة الثانية وموقف النجاشي", d:"بعد الأولى",
  s:"هاجر أكثر من ثمانين، فأرسلت قريش وفداً لاستردادهم، فأفشله جعفر بكلمته وقراءته.",
  n:"هاجر بعد ذلك نحو <strong>ثلاثة وثمانين رجلاً وثماني عشرة امرأة</strong>. فأزعج ذلك قريشاً فبعثت <strong>عمرو بن العاص وعبد الله بن أبي ربيعة</strong> بالهدايا إلى النجاشي وبطارقته ليردّهم.\n\nفقالوا: إنهم سفهاء فارقوا دين قومهم. فأبى النجاشي أن يسلّمهم حتى يسمع منهم. فقام <strong>جعفر بن أبي طالب</strong> فقال كلمته الخالدة: <strong>«أيها الملك، كنا قوماً أهل جاهلية، نعبد الأصنام، ونأكل الميتة، ونأتي الفواحش، ونقطع الأرحام، ونسيء الجوار، ويأكل القوي منا الضعيف... فبعث الله إلينا رسولاً منّا نعرف نسبه وصدقه وأمانته وعفافه...»</strong> ثم عدّد ما أمرهم به.\n\nثم قرأ عليه صدر <strong>سورة مريم</strong>، فبكى النجاشي حتى أخضل لحيته، وبكت أساقفته، وقال: <strong>إن هذا والذي جاء به عيسى ليخرج من مشكاة واحدة</strong>. ثم قال لقريش: انطلقا، فلا والله لا أسلّمهم إليكما.",
  g:"hasan", src:"مسند أحمد، سيرة ابن هشام، وصحّح إسنادها جماعة.",
  ben:[
   {t:"خطبة جعفر نموذج لتقديم الرسالة: ابدأ بالواقع المشترك (فساد الجاهلية)، ثم المصدر، ثم المحتوى. تسلسل إقناعي كامل.", tags:["ilam","hiwar"]},
   {t:"اختيار سورة مريم أمام ملك نصراني — قمة فقه المخاطَب. تحدّث بلغة من تخاطبه لا بلغتك.", tags:["ilam","mukhalif"]},
   {t:"النجاشي سمع من الطرفين قبل الحكم. أصل من أصول العدل لا يستقيم قضاء بدونه.", tags:["adl","hiwar"]},
   {t:"قريش استخدمت المال والدبلوماسية لا السيف. الخصوم يطاردون في كل ميدان — كن مستعداً لكل الجبهات.", tags:["siyasa","mal"]},
   {t:"جعفر صدق ولم يجامل ولم يخف موقفه من عيسى عليه السلام. الصدق أمام السلطان أفضل من كسب مؤقت بمداهنة.", tags:["sidq","thabat"]}
  ], ppl:["jafar","najashi","amr","umsalama"]},

 {id:"e31", t:"إسلام عمر بن الخطاب", d:"السنة السادسة من البعثة",
  s:"خرج عمر متقلّداً سيفه يريد قتل النبي ﷺ، فانتهى ساجداً مسلماً، فخرج المسلمون للعلن.",
  n:"خرج <strong>عمر</strong> متوشحاً سيفه يريد النبي ﷺ، فلقيه نعيم بن عبد الله فقال: أرجع إلى أهل بيتك، إن أختك وختنك قد أسلما. فرجع مغضباً إلى أخته <strong>فاطمة</strong> وزوجها سعيد بن زيد، وعندهما <strong>خبّاب</strong> يقرئهما صحيفة فيها <strong>سورة طه</strong>.\n\nفسمع الهمهمة، فدخل فضربهما، فسال الدم من أخته، فقالت: <strong>يا عمر، افعل ما بدا لك، فقد أسلمنا</strong>. فلما رأى الدم ندم، وطلب الصحيفة فأبت حتى يغتسل. فاغتسل ثم قرأ {طه. مَا أَنزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ} فقال: <strong>ما أحسن هذا الكلام وأكرمه!</strong>\n\nفدلّوه على النبي ﷺ في <strong>دار الأرقم</strong> فأسلم، وكان تمام الأربعين. فقال: يا رسول الله، ألسنا على الحق؟ قال: بلى. قال: <strong>ففيمَ الاختفاء؟</strong> فخرجوا في صفّين — حمزة على أحدهما وعمر على الآخر — حتى دخلوا المسجد وصلّوا عند الكعبة علانية. وسمّاه ﷺ <strong>الفاروق</strong>.",
  g:"hasan", src:"سيرة ابن هشام، الطبقات، وأصله في مسند أحمد وسنن الدارقطني.",
  ben:[
   {t:"أشدّ الناس عليك اليوم قد يكون أنصرهم غداً. لا تُغلق باب الرجاء في أحد ولا تدعُ عليه.", tags:["afw","tarbiya"]},
   {t:"القرآن هو السلاح الحقيقي: عمر خرج بسيف فهزمته صحيفة. أقوى ما تملك ليس ردّك بل نصّك.", tags:["ilam","hiwar"]},
   {t:"ثبات المرأة (فاطمة بنت الخطاب) أمام أخيها المسلّح هو ما كسر عناده. الموقف الحازم من الضعيف أبلغ من مئة حجة.", tags:["maraa","thabat"]},
   {t:"«ففيمَ الاختفاء؟» — كل مرحلة سرية لها سقف. الجرأة الرشيدة تفتح باباً أغلقه التردّد.", tags:["tadarruj","qiyada"]},
   {t:"دعا النبي ﷺ بإسلام أحد العُمَرَين — دعاء مخصّص لشخص مؤثر. حدّد أهدافك حتى في الدعاء.", tags:["takhtit"]}
  ], ppl:["umar","khabbab","arqam","hamza"]},

 {id:"e32", t:"حصار الشِّعب: المقاطعة الشاملة", d:"السنة 7—10 من البعثة (نحو 3 سنوات)",
  s:"كتبت قريش صحيفة بمقاطعة بني هاشم اقتصادياً واجتماعياً، فحُوصروا في الشعب ثلاث سنوات.",
  n:"لما عجزت قريش، لجأت إلى <strong>سلاح الحصار الشامل</strong>. كتبوا صحيفة تعاقدوا فيها على: <strong>ألا يُنكحوا بني هاشم وبني المطلب، ولا يُنكحوا إليهم، ولا يبيعوهم، ولا يبتاعوا منهم، ولا يجالسوهم</strong> — حتى يسلّموا محمداً للقتل. وعلّقوا الصحيفة في جوف الكعبة تعظيماً لها.\n\nفانحاز بنو هاشم وبنو المطلب — مؤمنهم وكافرهم إلا أبا لهب — إلى <strong>شِعب أبي طالب</strong>، وحُوصروا نحو <strong>ثلاث سنين</strong>.\n\nبلغ منهم الجهد حتى <strong>أكلوا ورق الشجر والجلود</strong>، وكان يُسمع أصوات صبيانهم من وراء الشعب من الجوع. وكانوا لا يخرجون إلا في الأشهر الحرم، فإذا خرجوا للسوق أغلى عليهم أبو لهب السلعة حتى لا يقدروا.\n\nومع ذلك <strong>استمرّ ﷺ يعرض نفسه على القبائل في المواسم</strong> — لم يتوقف العمل الدعوي رغم الحصار.",
  g:"mash", src:"سيرة ابن هشام، الطبقات، البداية والنهاية.",
  ben:[
   {t:"الحصار الاقتصادي أخطر من السيف لأنه يستهدف الحاضنة كلها. تنويع مصادر الرزق حماية للمشروع.", tags:["mal","ibtila"]},
   {t:"استمرّ ﷺ في عرض الدعوة في المواسم وهو محاصر. لا توقف مشروعك كلياً لأزمة — قلّص وواصل.", tags:["thabat","qiyada"]},
   {t:"وقف مع النبي ﷺ أقاربه المشركون نصرةً للعصبية لا للدين. استثمر كل رابط شرعي متاح في حماية دعوتك.", tags:["siyasa","ukhuwa"]},
   {t:"ثلاث سنوات جوع لم تُنتج تنازلاً واحداً. الثبات يُقاس بطول المدة لا بشدة اللحظة.", tags:["thabat","sabr"]},
   {t:"العقاب الجماعي على النساء والأطفال أسلوب جاهلي قديم متجدد — ووجه قبحه لا يتغير بتغير العصر.", tags:["adl","ibtila"]}
  ], ppl:["abutalib","abulahab","khadija","hamza"]},

 {id:"e33", t:"نقض الصحيفة ونهاية الحصار", d:"السنة العاشرة من البعثة",
  s:"سعى خمسة من قريش في نقض الصحيفة، وأخبر ﷺ أن الأرَضة أكلتها إلا اسم الله، فكان كما قال.",
  n:"تحرّك في نقض الصحيفة خمسة من أشراف قريش، على رأسهم <strong>هشام بن عمرو</strong> و<strong>زهير بن أبي أمية</strong> و<strong>المُطعم بن عدي</strong> وأبو البختري وزمعة بن الأسود — وكلهم <strong>مشركون</strong> تحرّكهم الرحم والمروءة.\n\nفقام زهير في المسجد وقال: يا أهل مكة، أنأكل الطعام ونلبس الثياب وبنو هاشم هلكى لا يُباعون ولا يُبتاع منهم؟ والله لا أقعد حتى تُشقّ هذه الصحيفة. فعارضه أبو جهل فتتابع القوم عليه.\n\nوكان النبي ﷺ قد أخبر عمّه أبا طالب أن الله <strong>سلّط على صحيفتهم الأرَضة فأكلت ما فيها من جور وقطيعة، وبقي فيها كل ما ذُكر الله فيه</strong>. فذهب أبو طالب فأخبرهم، فقالوا: إن كان كاذباً أسلمناه، وإن كان صادقاً رجعتم. فوجدوها كما قال، فازداد أكثرهم عناداً — لكن الحصار انتهى.",
  g:"mash", src:"سيرة ابن هشام، الطبقات. القصة مشهورة في كتب السير.",
  ben:[
   {t:"الظلم المفرط يولّد رفضاً من داخل صفّ الظالمين أنفسهم. لا تيأس من انشقاق في جبهة الخصم.", tags:["siyasa","ibtila"]},
   {t:"استُخدمت المروءة والرحم كمدخل لنصرة الحق. خاطب الناس بالقيم التي يؤمنون بها هم.", tags:["hiwar","mukhalif"]},
   {t:"رأوا المعجزة بأعينهم فازداد أكثرهم عناداً. المشكلة ليست في نقص الدليل بل في مرض الإرادة.", tags:["mukhalif","thabat"]},
   {t:"بعد أشدّ ثلاث سنوات جاء الفرج من جهة لم تكن في الحسبان. {فَإِنَّ مَعَ الْعُسْرِ يُسْرًا}.", tags:["ibtila","tawakkul"]}
  ], ppl:["mutim","abutalib","abujahl"]}
]}
];
</script>

 {id:"e34", t:"وفاة أبي طالب", d:"السنة العاشرة من البعثة",
  s:"مات عمّه وحاميه على ملّة قومه رغم عرض النبي ﷺ عليه، فاجترأت قريش عليه بعده.",
  n:"لما حضرت أبا طالب الوفاة، جاءه النبي ﷺ وعنده <strong>أبو جهل وعبد الله بن أبي أمية</strong>، فقال: <strong>«يا عمّ، قل لا إله إلا الله، كلمة أحاجّ لك بها عند الله»</strong>. فقالا: أترغب عن ملّة عبد المطلب؟ فأعاد ﷺ وأعادا، فكان آخر ما قال: <strong>هو على ملّة عبد المطلب</strong> وأبى أن يقول لا إله إلا الله.\n\nفقال ﷺ: <strong>«لأستغفرنّ لك ما لم أُنهَ عنك»</strong>، فنزلت {مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ آمَنُوا أَن يَسْتَغْفِرُوا لِلْمُشْرِكِينَ}، ونزلت فيه {إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَن يَشَاءُ}.\n\nفلما مات، <strong>نالت قريش من النبي ﷺ ما لم تكن تنال في حياته</strong>، حتى اعترضه سفيه فنثر التراب على رأسه.",
  g:"sahih", src:"صحيح البخاري (الجنائز، تفسير القصص)، صحيح مسلم.",
  ben:[
   {t:"الهداية بيد الله وحده. بذل النبي ﷺ الغاية في عمّه ولم يُسلم — فلا تحمل ذنب من لم يستجب لك.", tags:["tawakkul","hiwar"]},
   {t:"قرين السوء يقتل في اللحظة الحاسمة. أبو جهل حضر ليمنع كلمة واحدة، ونجح. راجع من تجالس.", tags:["ukhuwa","mukhalif"]},
   {t:"عصبية «ملّة الآباء» أقوى حاجز أمام الحق عبر التاريخ. اكسر السؤال: هل الحق أن نتبع الآباء أم الدليل؟", tags:["thabat","hiwar"]},
   {t:"وفاء النبي ﷺ لعمّه بالاستغفار حتى نُهي — الوفاء لصاحب المعروف لا يسقط باختلاف الدين، ولكن له حدود شرعية.", tags:["wafa","mukhalif"]},
