  </div>
  <div id="sout"><div class="empty"><div class="big">ابحث</div><p>اكتب كلمتين على الأقل لبدء البحث.</p></div></div>`;
  let t;
  $('#q').oninput=e=>{ clearTimeout(t); t=setTimeout(()=>doSearch(e.target.value.trim()),200); };
}
function doSearch(q){
  const out=$('#sout');
  if(q.length<2){ out.innerHTML='<div class="empty"><div class="big">ابحث</div><p>اكتب كلمتين على الأقل لبدء البحث.</p></div>'; return; }
  const L=q.toLowerCase(), R=[];
  PERIODS.forEach(p=>p.ev.forEach(e0=>{ const e=getEv(e0.id);
    const hay=(e.t+' '+e.s+' '+e.n).toLowerCase();
    if(hay.includes(L)) R.push({k:'حدث', t:e.t, p:e.s, go:`openEvent('${e0.id}')`, sub:p.t+' · '+e.d});
  }));
  allBenefits().forEach(b=>{ if(b.t.toLowerCase().includes(L))
    R.push({k:'فائدة', t:b.t, p:'من: '+b.evT, go:b.ev?`openEvent('${b.ev}')`:'', sub:''}); });
  PEOPLE.forEach(p=>{ if((p.n+' '+p.r+' '+p.b).toLowerCase().includes(L))
    R.push({k:'شخصية', t:p.n, p:p.r, go:`openPerson('${p.id}')`, sub:KINDS[p.k].n}); });

  out.innerHTML = R.length
    ? `<div style="color:var(--muted);font-size:13px;margin-bottom:12px">${nf(R.length)} نتيجة</div>`+
      R.slice(0,80).map(r=>`<button class="sres" ${r.go?`onclick="${r.go}"`:''}>
        <div class="k">${r.k}${r.sub?' · '+esc(r.sub):''}</div>
        <h4>${hl(r.t,q)}</h4><p>${hl(r.p.slice(0,180),q)}</p></button>`).join('')
    : `<div class="empty"><div class="big">لا نتائج</div><p>جرّب كلمة أخرى أو أقصر.</p></div>`;
}

/* ============================================================
   المظهر
   ============================================================ */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  USER.theme=t; save();
}
$('#themeBtn').onclick=()=>setTheme(USER.theme==='dark'?'light':'dark');

/* ============================================================
   المزامنة والنسخ الاحتياطي
   ============================================================ */
let fbDB=null;
function fbInit(){
  if(!USER.fb) return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(USER.fb);
    fbDB=firebase.database(); return true;
  }catch(e){ console.warn(e); return false; }
}
let pushTmr;
function cloudPush(){
  if(!fbDB||!USER.code) return;
  clearTimeout(pushTmr);
  pushTmr=setTimeout(()=>{
    fbDB.ref('seerah/'+USER.code).set({
      notes:USER.notes, marks:USER.marks, ben:USER.ben, at:Date.now()
    }).catch(e=>console.warn(e));
  },1200);
}
function cloudPull(){
  if(!fbDB||!USER.code){ toast('اضبط إعدادات فايربيس ورمز المزامنة أولاً'); return; }
  fbDB.ref('seerah/'+USER.code).get().then(s=>{
    if(!s.exists()){ toast('لا توجد نسخة محفوظة بهذا الرمز'); return; }
    const d=s.val();
    USER.notes=d.notes||{}; USER.marks=d.marks||[]; USER.ben=d.ben||[];
    store.set(USER); toast('تم تنزيل النسخة السحابية');
    renderTimeline(); renderMine(); closeOvl();
  }).catch(e=>toast('تعذّر الاتصال: '+e.message));
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({notes:USER.notes,marks:USER.marks,ben:USER.ben},null,2)],
    {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='seerah-notes-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); toast('نُزّل الملف');
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    USER.notes=Object.assign(USER.notes,d.notes||{});
    USER.marks=[...new Set([...(USER.marks||[]),...(d.marks||[])])];
    USER.ben=[...(USER.ben||[]),...(d.ben||[])];
    save(); toast('تم الاستيراد والدمج'); renderTimeline(); renderMine(); closeOvl();
  }catch(e){ toast('الملف غير صالح'); } };
  r.readAsText(f);
}
$('#syncBtn').onclick=()=>{
  $('#sheet').style.setProperty('--pcol','var(--gold)');
  $('#sheet').innerHTML=`
  <div class="shead">
    <button class="xbtn" onclick="closeOvl()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <div class="eyebrow">حفظ ونقل</div>
    <h3>المزامنة والنسخ</h3>
  </div>
  <div class="sbody">
    <div class="sec">
      <h5>نسخة على جهازك</h5>
      <div class="srcbox">ملاحظاتك محفوظة تلقائياً في هذا المتصفح. صدّرها كملف لتحتفظ بنسخة أو تنقلها لجهاز آخر.</div>
      <div class="row">
        <button class="btn pri" onclick="exportJSON()">تصدير ملف</button>
        <label class="btn" style="cursor:pointer">استيراد ملف
          <input type="file" accept="application/json" style="display:none" onchange="importJSON(this)">
        </label>
      </div>
    </div>

    <div class="sec">
      <h5>المزامنة السحابية (فايربيس)</h5>
      <div class="srcbox">الصق إعدادات مشروعك من Firebase Console ← إعدادات المشروع ← تطبيق الويب. ثم اختر رمز مزامنة تستخدمه على كل أجهزتك.</div>
      <label class="lbl">إعدادات فايربيس (JSON)</label>
      <textarea class="note" id="fbCfg" style="min-height:130px;font-size:12.5px;direction:ltr;text-align:left"
        placeholder='{"apiKey":"…","authDomain":"…","databaseURL":"https://…","projectId":"…"}'>${USER.fb?esc(JSON.stringify(USER.fb)):''}</textarea>
      <label class="lbl">رمز المزامنة</label>
      <input class="fld" id="fbCode" placeholder="مثلاً: mazen-seerah" value="${esc(USER.code||'')}">
      <div class="row">
        <button class="btn pri" onclick="saveSync()">احفظ الإعدادات</button>
        <button class="btn" onclick="cloudPull()">تنزيل من السحابة</button>
        <button class="btn" onclick="cloudPush();toast('جارٍ الرفع…')">رفع الآن</button>
      </div>
      <div class="srcbox" style="margin-top:12px">الحالة: ${fbDB?'<span style="color:var(--sage)">متصل</span>':'<span style="color:var(--amber)">غير مضبوط</span>'}</div>
    </div>

    <div class="sec">
      <h5>عن هذا التطبيق</h5>
      <div class="srcbox">
        المحتوى مستخلَص من: صحيحَي البخاري ومسلم، سيرة ابن هشام، الطبقات لابن سعد، البداية والنهاية لابن كثير، والرحيق المختوم.<br><br>
        كل حدث مذيّل بدرجة ثبوته، وقد نُبّه صراحةً على الروايات الضعيفة أو المشهورة غير الثابتة.<br><br>
        <strong style="color:var(--ivory)">تنبيه:</strong> هذا عمل بشري قابل للخطأ، فراجع ما تحتاج الاستدلال به في مظانّه من كتب أهل العلم.
      </div>
    </div>
  </div>`;
  $('#ovl').classList.add('on'); document.body.style.overflow='hidden';
};
function saveSync(){
  const raw=$('#fbCfg').value.trim();
  USER.code=$('#fbCode').value.trim();
  if(raw){
    try{ USER.fb=JSON.parse(raw); }
    catch(e){ toast('صيغة الإعدادات غير صحيحة'); return; }
  } else USER.fb=null;
  store.set(USER);
  if(fbInit()){ toast('اتصلت بفايربيس'); cloudPush(); } else toast('حُفظت الإعدادات');
  closeOvl();
}

/* ============================================================
   الإقلاع
   ============================================================ */
document.documentElement.dataset.theme = USER.theme||'light';
renderTimeline(); renderSearch(); fbInit();
if(fbDB && USER.code) setTimeout(()=>{
  fbDB.ref('seerah/'+USER.code).get().then(s=>{
    if(s.exists()){
      const d=s.val(), local=Object.keys(USER.notes).length;
      if((Object.keys(d.notes||{}).length)>local){
        USER.notes=d.notes||{}; USER.marks=d.marks||[]; USER.ben=d.ben||[];
        store.set(USER); renderTimeline(); toast('حُدّثت البيانات من السحابة');
      }
    }
  }).catch(()=>{});
},900);
</script>
</body>
</html>
